<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>端口测试工装</title>
<style>
:root{
  --bg:#f3f4f7; --card:#fff; --line:#dbdfe6; --line2:#eef0f4;
  --ink:#151c26; --ink2:#4a5464; --ink3:#79838f;
  --accent:#c0561b; --accent-bg:#fbede3;
  --ok:#16794c; --ok-bg:#e4f2ea;
  --warn:#a8720b; --warn-bg:#faf0dc;
  --err:#b3392f; --err-bg:#fbe9e7;
  --off:#828c99; --off-bg:#eceef2;
  --sans:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;
  color:var(--ink);border-radius:4px;padding:4px 12px}
button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover:not(:disabled){opacity:.88;color:#fff}
input,select{font:inherit;border:1px solid var(--line);border-radius:4px;padding:3px 7px;
  background:#fff;color:var(--ink)}
input[type=number]{width:88px}
code,.mono{font-family:var(--mono)}
h1{font-size:17px;margin:0}
h2{font-size:14px;margin:0 0 10px;color:var(--ink3);font-weight:600;
  letter-spacing:.05em}

header{background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .sp{flex:1}
#status{font-size:13px;color:var(--ink2)}
#status b{color:var(--ok)}
#status.bad b{color:var(--err)}

/* 中间那一列是干活的地方，所以它最宽。日志窗原来占 60%，把面板挤到 200 px，
   卡片上但凡有一句整话都会被压成一条竖的细带。 */
main{display:grid;grid-template-columns:250px minmax(430px,1fr) minmax(340px,34%);
  gap:1px;background:var(--line);
  height:calc(100vh - 53px)}
main>section{background:var(--bg);overflow-y:auto;padding:14px}
@media(max-width:1100px){main{grid-template-columns:1fr;height:auto}}

.msg{border-left:3px solid var(--accent);background:#fff;border:1px solid var(--line);
  border-left-width:3px;padding:10px 14px;border-radius:0 4px 4px 0;margin-bottom:12px}
.msg.bad{border-left-color:var(--err)}

/* ---- port tree ---- */
.grp{margin-bottom:4px}
.grp>.hd{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:4px}
.grp>.hd:hover{background:#fff}
.blk{display:inline-block;width:19px;height:19px;line-height:18px;text-align:center;
  border-radius:3px;font:600 11px var(--mono);color:#fff;flex:none}
.blk.A{background:#4c6ea8}.blk.B{background:#2f7a68}.blk.C{background:#a85e33}
.blk.D{background:#6e56a0}.blk.x{background:#6b7684;width:auto;padding:0 5px}
.grp .nm{flex:1;font-weight:600;font-size:13px}
.tag{font:11px var(--mono);padding:1px 6px;border-radius:3px}
.tag.session{color:var(--ok);background:var(--ok-bg)}
.tag.run{color:#fff;background:var(--ok)}
.kids{padding:2px 0 6px 28px;display:flex;flex-direction:column;gap:2px}
.kids label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);
  cursor:pointer}
.kids .t{font-family:var(--mono);color:var(--ink3);font-size:11.5px}
.kids .selall{font-size:11.5px;color:var(--accent);cursor:pointer;
  background:none;border:none;padding:0;text-align:left}

/* ---- port cards ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:13px 15px;margin-bottom:12px}
.card>.hd{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.card>.hd .nm{font-weight:600}
.card>.hd .sp{flex:1}
.sub{font-size:11.5px;color:var(--ink3);font-family:var(--mono)}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:8px 0}
.row label{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.hint{font-size:11.5px;color:var(--ink3);margin-left:2px}

.tabs{display:flex;gap:4px;margin-bottom:10px}
.tab{font-size:12.5px;padding:3px 12px;border-radius:4px 4px 0 0}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.plansteps{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.plansteps .st{display:flex;align-items:center;gap:6px;padding:4px 6px;
  border-radius:4px;font-size:12.5px;cursor:pointer;border:1px solid transparent}
.plansteps .st:hover{background:#fff}
.plansteps .st.sel{background:#fff;border-color:var(--accent)}
.plansteps .st .ty{font:11px var(--mono);color:var(--ink3)}
.plansteps .st .vd{margin-left:auto;font:600 11px var(--mono)}
.vd.PASS{color:var(--ok)}.vd.FAIL,.vd.ERROR{color:var(--err)}
.vd.TIMEOUT{color:var(--warn)}.vd.SKIPPED{color:var(--ink3)}
.pgrid{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center;
  font-size:12.5px;margin:8px 0}
.pgrid .k{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
.pgrid input,.pgrid select{width:100%}
/* 判据的值。看得出是印上去的，不是能敲的。 */
.pgrid .ro{font-family:var(--mono);font-size:12px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line2);border-radius:3px;padding:3px 7px}
.pgroup{font:600 11px var(--mono);color:var(--ink3);letter-spacing:.05em;
  grid-column:1/-1;margin-top:8px;border-top:1px solid var(--line2);padding-top:7px}
/* 人工读数框：浮在最上层，因为它要在一次走点的中途一直站着不动。 */
#meterask{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;
  background:var(--card);border:2px solid #2f6fd0;border-radius:6px;
  padding:12px 16px;min-width:460px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#meterwhat{font:600 14px/1.5 var(--mono);color:var(--ink)}
.finding{font-size:12px;color:#8a5300;background:#fff7e6;border:1px solid #e0a34a;
  border-radius:4px;padding:6px 9px;margin:5px 0}
.reads{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
.bit{font:600 11px var(--mono);border:1px solid var(--line);border-radius:3px;
  padding:3px 7px;min-width:52px;text-align:center;background:var(--off-bg);color:var(--ink3)}
.bit.on{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.bit.off{background:#fff;color:var(--ink2)}
/* 复合读数：不表态。染成通/断会把一路死掉的模拟通道显示成绿色。 */
.bit.num{background:#fff;color:var(--ink)}
/* 悬空带：数看着像真的，这是这个故障最贵的地方，所以要显眼。 */
.bit.warn{background:#fff7e6;color:#8a5300;border-color:#e0a34a}
.sub.warn{color:#8a5300}

.chvals{border:1px solid var(--line2);border-radius:5px;padding:9px 11px;margin:9px 0;
  background:var(--bg)}
.chvals .st{font-size:11px;letter-spacing:.05em;color:var(--ink3);margin-bottom:7px;
  font-weight:600}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px 10px;
  margin-bottom:8px}
.chgrid label{display:flex;align-items:center;gap:6px;font-size:12px}
.chgrid .t{font-family:var(--mono);font-size:11px;color:var(--ink3);min-width:52px}
.chgrid input{width:64px}

.link{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;
  font:11.5px var(--mono);color:var(--ink3);display:flex;gap:14px;flex-wrap:wrap}
.link b{color:var(--ink2);font-weight:600}

.tgt{display:flex;align-items:center;gap:9px;padding:5px 0;border-top:1px solid var(--line2)}
.tgt:first-of-type{border-top:none}

/* DO -> DI cross-check. One row per output, one cell per input, so a crossed
   pair reads as an off-diagonal mark rather than as a number to compare. */
.rowgrid{margin-top:8px;overflow-x:auto}
.gridrow{display:flex;gap:2px;align-items:stretch}
.gridrow .c{flex:1 0 44px;text-align:center;padding:4px 2px;font-family:var(--mono);
            font-size:11.5px;border-top:1px solid var(--line2);color:var(--ink2)}
.gridrow .c:first-child{flex:0 0 52px;font-weight:600;color:var(--ink)}
.gridrow .c:last-child{flex:1 0 108px;font-family:var(--sans)}
.gridrow.hd2 .c{border-top:none;color:var(--ink3);font-weight:600}
.gridrow .c.hit{color:var(--ok);background:var(--ok-bg);border-radius:3px}
.gridrow .c.wrong{color:var(--err);background:var(--err-bg);border-radius:3px}
.tgt .n{font-family:var(--mono);font-size:12px;min-width:120px}
.tgt .d{flex:1;font-size:12px;color:var(--ink3)}

/* ---- log ---- */
#logwrap{display:flex;flex-direction:column;height:100%}
#logbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
#logbar .sp{flex:1}
#paused{font-size:12px;color:var(--warn);font-weight:600}
#log{flex:1;overflow-y:auto;background:#fff;border:1px solid var(--line);
  border-radius:5px;padding:8px 10px;font:12px/1.55 var(--mono);
  white-space:pre-wrap;word-break:break-all;min-height:300px}
.l{display:block;border-left:3px solid transparent;padding-left:7px;margin:1px 0}
.l .ts{color:var(--ink3)}
.l.ok{border-left-color:var(--ok)}
.l.err{border-left-color:var(--err);background:var(--err-bg);color:var(--err)}
.l.frame{border-left-color:#4c6ea8;color:var(--ink2)}
.l.log{color:var(--ink3)}
.l.tx{border-left-color:var(--accent);color:var(--accent)}
.l.echo{border-left-color:var(--off);color:var(--ink3)}
.l.panel{border-left-color:#2f7a68;color:#2f7a68}

/* Left column: pick the control port, then everything else. */
#connbox{padding:0 0 10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.step{font:600 12px var(--sans);color:var(--ink2);margin:0 0 7px;letter-spacing:.3px}
/* Tall enough for ten rows. It was six, and the simulated board is appended
   after every real port - so on a bench with a handful of USB adapters the one
   entry that does not need hardware was the one scrolled out of sight. */
#portlist{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow-y:auto;
  border:1px solid var(--line);border-radius:4px;background:#fff;padding:3px}
#portlist .p{display:block;font:11.5px var(--mono);color:var(--ink2);padding:4px 6px;
  border-radius:3px;cursor:pointer;border:1px solid transparent;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#portlist .p:hover{background:var(--line2)}
#portlist .p.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
#portlist .p .sug{color:var(--ok);font-weight:600}
/* The simulated board, set apart from the real ports above it. Everything it
   reports is invented, so it must not read as one more COM port in the list. */
#portlist .p.sim{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;
  color:var(--warn)}
#portlist .p.sim .tag{font-weight:600}
.connrow{display:flex;gap:6px;margin-top:7px}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:7px}
/* Not disabled attributes on every control - one rule, so a new control added
   later cannot forget to be gated. */
.gated{opacity:.35;pointer-events:none}
.tgtres{font-size:11.5px;color:var(--ink3);margin-left:8px}
.headsup{border-left:3px solid var(--warn);background:#fffaf3;padding:7px 10px;
         margin:0 0 8px;border-radius:0 4px 4px 0}
.headsup>.st{font:600 12px var(--sans);color:var(--warn);margin-bottom:4px}
.headsup>.v{font-size:12px;line-height:1.7;color:var(--ink2)}
.headsup>.v+.v{margin-top:4px}
input.bad{border-color:var(--err);background:#fff5f5}
.rangetip{font-size:11.5px;color:var(--err);margin-left:6px;white-space:nowrap}
.tgtres.bad{color:var(--err);font-weight:600}
/* 用例式卡片。段与段之间要一眼分得开 —— 整件事的重点就是让人不用猜
   「哪些是该点的、哪些是要填的」。 */
.case{border:1px solid var(--line);border-radius:6px;margin:10px 0;overflow:hidden}
.casehd{display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:var(--line2);border-bottom:1px solid var(--line)}
.casehd .no{font:700 15px var(--sans);color:var(--accent)}
.casehd .nm{font:600 13.5px var(--sans)}
.casehd .casetag{font-size:11.5px;color:var(--warn);margin-left:auto}
.caserow{display:flex;gap:8px;padding:4px 10px;font-size:12px;line-height:1.6}
.caserow .k{flex:0 0 52px;color:var(--ink3)}
.caserow .v{color:var(--ink2)}
/* 配置：浅底，和说明区分开。里面全是「要填的」。 */
.casecfg{margin:6px 10px 0;padding:8px 10px;background:#fafafa;
  border:1px solid var(--line);border-radius:4px}
.casecfg>.st{font:600 12px var(--sans);color:var(--ink3);margin-bottom:6px}
.casecfg label{margin-right:10px}
/* 动作：整段只有这里能点。 */
.caseact{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px}
/* 结果：跟着自己的用例，不再是全卡一行。 */
.caseres{display:flex;gap:8px;padding:6px 10px 9px;border-top:1px dashed var(--line);
  font-size:12px;align-items:baseline}
.caseres>.st{flex:0 0 52px;color:var(--ink3);font-weight:600}

.gated.live{opacity:1;pointer-events:auto}

/* The port list: one row per port, grouped by board. A hardware engineer reads
   this for two things only - has it been tested, did it pass. */
.boardhd{font:600 11.5px var(--sans);color:var(--ink3);margin:10px 0 3px;
  letter-spacing:.3px;border-bottom:1px solid var(--line2);padding-bottom:3px}
.prow{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:4px;
  cursor:pointer;border:1px solid transparent}
.prow:hover{background:var(--line2)}
.prow .pick{margin:0;flex:none}
.batchbar{border:1px solid var(--accent);background:var(--accent-bg);border-radius:4px;
  padding:7px 8px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.batchbar .hours{flex-wrap:wrap}
.batchbar button{align-self:flex-start}
.prow.on{background:var(--accent-bg);border-color:var(--accent)}
.prow .ico{font-size:12px;line-height:1}
.prow .nm{font:12.5px var(--sans);color:var(--ink)}
.prow .key,.howhd .key{font:10.5px var(--mono);color:var(--ink3);font-weight:400}
.prow .stat{margin-left:auto;font-size:11px;color:var(--ink3)}
.prow.pass .stat{color:var(--ok)}
.prow.fail .stat{color:var(--err);font-weight:600}
.prow.testing .stat{color:var(--accent)}

/* How to test the selected port - first thing in the middle column. */
.howto{background:var(--card);border:1px solid var(--line);border-radius:5px;
  padding:10px 12px;margin-bottom:10px}
.howhd{font:600 13px var(--sans);color:var(--ink);margin-bottom:7px}
.howrow{display:flex;gap:8px;font-size:12.5px;line-height:1.65;margin:3px 0}
.howrow .k{flex:0 0 62px;color:var(--ink3)}
.howrow .v{color:var(--ink2)}

/* The one button. Given room, because it is what the page is for. */
.startrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:4px 0 10px;
  padding:8px 10px;background:var(--accent-bg);border-radius:5px}
/* 按钮上的字不许折行。挤窄了宁可整行换行，也不要把「开始测试」竖着码成一列。 */
.startrow button{padding:6px 20px;font-weight:600;white-space:nowrap}
/* 结论那句话自己占一行，而且不用等宽体 —— 它是给人读的句子，不是一行日志。
   `>` 是必须的：底下那两组单选里也有 .sub，它们不能被撑成整行。 */
.startrow>.note{color:var(--ink2);font-size:12.5px;font-family:inherit;
  flex:1 0 100%;line-height:1.6}
/* 单选一行一个，名字后面直接跟它的用途 —— 用途只写在这一处。 */
.runhow,.enumpick{display:flex;flex-direction:column;gap:3px}
.runhow{flex:1 1 260px}
.runhow label,.enumpick label{display:flex;align-items:baseline;gap:6px;
  font-size:12.5px;cursor:pointer;line-height:1.55}
.runhow label b,.enumpick label b{white-space:nowrap}
.runhow .sub,.enumpick .sub{font-family:inherit;color:var(--ink3);font-size:12px}
details{margin-top:10px;border-top:1px solid var(--line2);padding-top:7px}
details summary{cursor:pointer;font-size:12px;color:var(--ink3);outline:none}
details summary:hover{color:var(--ink2)}
</style>
</head>
<body>

<header>
  <h1>端口测试工装</h1>
  <span id="status">没有连接</span>
  <label id="echobox" hidden style="font-size:12.5px;display:flex;align-items:center;gap:5px">
    <input type="checkbox" id="autoecho" checked> 自动回环应答
    <span id="echostat" class="sub"></span>
  </label>
  <span class="sp"></span>
  <!-- Which limits the ticks on this page were produced by. It sits in the
       header rather than in a settings pane because it qualifies every verdict
       on screen: the same board passes under one limit set and fails under
       another, and a green tick that does not say which is not a claim. -->
  <label id="critbox" hidden style="font-size:12.5px;display:flex;align-items:center;gap:5px">
    <span class="sub">判据</span>
    <select id="critplan"></select>
    <span id="critver" class="sub"></span>
  </label>
</header>

<main>
  <section id="tree">
    <!-- Step one, and nothing else works until it is done: every reading on
         this page arrives over this one cable. The list stays visible rather
         than collapsing into a dropdown, because which adapter is which is the
         question people actually get wrong. -->
    <div id="connbox">
      <div class="step">① 选择 RS232 控制口</div>
      <div id="portlist"><div class="sub">正在找串口…</div></div>
      <div class="connrow">
        <button id="connect" class="primary" disabled>连接</button>
        <button id="disconnect" hidden>断开</button>
        <button id="refresh">重新找</button>
      </div>
      <div id="connhint" class="hint">先选一个口，再点连接。板子的控制口是端子
        <b>C05 / C06</b>，要用 USB-RS232 适配器（端子是真 ±12 V）。</div>
    </div>

    <div id="afterconn" class="gated">
      <div class="step">② 端口与方案</div>
      <div class="tabs">
        <button class="tab on" data-tab="manual">端口</button>
        <button class="tab" data-tab="plan">方案</button>
      </div>
      <div id="batchbar" class="batchbar" hidden></div>
      <div id="treebody"></div>
      <div id="planlist" hidden>
        <!-- Said once, here, because "方案" means nothing on its own and a
             hardware engineer debugging one port should know to ignore it. -->
        <div id="planwhat" class="hint">
          <b>方案 = 产线用。</b>一个文件写好跑哪些步骤、每步什么算过，点一下整套跑完出报告。
          单个端口调试用左边的「端口」页，不用碰这里。
        </div>
      </div>
    </div>
  </section>
  <section id="panel">
    <h2 id="panelhead">面板</h2>
    <div id="panelbody"></div>
    <div id="planbody" hidden></div>
  </section>
  <section>
    <div id="logwrap">
      <div id="logbar">
        <h2 style="margin:0">日志</h2>
        <span class="sp"></span>
        <span id="paused" hidden></span>
        <button id="pause">暂停</button>
        <button id="clear">清空</button>
        <button id="save">导出</button>
      </div>
      <div class="row" style="margin:0 0 7px">
        <label><input type="checkbox" class="filt" value="ok" checked> 应答</label>
        <label><input type="checkbox" class="filt" value="err" checked> 错误</label>
        <label><input type="checkbox" class="filt" value="frame" checked> 采样</label>
        <label><input type="checkbox" class="filt" value="log" checked> 板子日志</label>
        <label><input type="checkbox" class="filt" value="echo" checked> 回环应答</label>
        <label><input type="checkbox" class="filt" value="panel" checked> 对端链路</label>
        <label><input type="checkbox" class="filt" value="caps"> 板子自述</label>
      </div>
      <div id="log"></div>
      <div class="row" style="margin-top:8px">
        <input id="raw" placeholder="直接敲命令，比如 pt.start din ch=1,3,5" style="flex:1"
               autocomplete="off">
        <button id="send">发送</button>
      </div>
      <div class="hint">面板做不到的事，在这里都能做。命令原样发给板子，回复原样显示。</div>
    </div>
  </section>
</main>

<!-- 人工读数框。⚠️ 刻意放在 <main> 外面：每来一帧 applyState() 都会重建
     #panelbody，输入框在里面的话，人打字打到一半就会被重建掉。放这里它不受
     重建影响，所以人可以慢慢读表、慢慢填。 -->
<div id="meterask" hidden>
  <div id="meterwhat"></div>
  <div class="row" style="margin-top:8px">
    <input id="meterval" type="number" step="any" placeholder="表上读到多少" style="flex:1">
    <span id="meterunit" class="hint"></span>
    <button id="meterok" class="primary">记下</button>
    <button id="meterskip">跳过这一点</button>
    <button id="meterstop">中止</button>
  </div>
  <div class="hint" id="meterhint"></div>
</div>

<script>
"use strict";

const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag);
  if (cls) n.className = cls; if (txt !== undefined) n.textContent = txt; return n; };

let state = { connected:false, ports:[], links:{} };
let picked = {};        // port name -> Set of selected channel numbers
let expanded = {};      // port name -> bool
let reads = {};         // port name -> latest frame fields

// Event frames - a port name with a dot, like knx.rx - are occurrences, not
// periodic readings. The latest one is not enough: the point is the sequence,
// so they accumulate here per owning port instead of overwriting.
//
// ⚠️ Module level, not a card closure. applyState() calls renderPanel() after
// every command, so anything a card has to keep across commands has to live
// out here (the same rule testing[] and verdicts[] follow).
let events = {};        // owning port -> [{tick, sub, fields}], newest last
const EVENTS_MAX = 10;
let evtSource = null;

/* ---------------- log ---------------- */
const MAX_LOG = 20000;
let logBuf = [];        // every line, kept whether shown or not
let paused = false, pausedCount = 0;
// caps 默认不在里面 —— 见 addLog 里的说明。
let filters = new Set(["ok","err","frame","log","tx","echo","panel"]);

function isEchoTraffic(kind, line) {
  return (kind === "ok" && line.startsWith("OK echo ")) ||
         (kind === "tx" && line.startsWith("> pt.echo "));
}

// 板子自述 —— pt.caps 那 54 行。
//
// *** 面板每执行一条命令都会自动重读一次 caps *** 来刷新端口状态（任何命令都可能
// 改变端口在报什么）。那 54 行是面板在跟自己对话，不是操作员要看的东西：清空日志
// 之后点一下「执行」，屏幕上 55 行里有 53 行是板子在重新自我介绍。
//
// 所以给它们自己的一类，默认折起。**不是丢掉** —— 勾上「板子自述」就全回来，
// 导出的日志也一直是全的。
function isCaps(kind, line) {
  return kind === "ok" && /^OK (porttool|port|vals|limits|terms|run)=/.test(line);
}

function addLog(kind, line, at) {
  if (isEchoTraffic(kind, line)) kind = "echo";
  else if (isCaps(kind, line)) kind = "caps";
  logBuf.push({kind, line, at: at || nowStamp()});
  if (logBuf.length > MAX_LOG) logBuf.splice(0, logBuf.length - MAX_LOG);
  if (paused) { pausedCount++; $("#paused").textContent = "已暂停，攒了 " + pausedCount + " 行"; return; }
  appendLine(logBuf[logBuf.length-1]);
}
function logNode(e) {
  const n = el("span", "l " + e.kind);
  n.appendChild(el("span", "ts", e.at + "  "));
  n.appendChild(document.createTextNode(e.line));
  return n;
}

// One line, appended live. Reading scrollTop/scrollHeight here is what keeps
// the view stuck to the bottom only while the person is already at the bottom.
function appendLine(e) {
  if (!filters.has(e.kind)) return;
  const box = $("#log");
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  box.appendChild(logNode(e));
  while (box.childElementCount > 4000) box.removeChild(box.firstChild);
  if (stick) box.scrollTop = box.scrollHeight;
}

// *** The whole pane at once, and NOT by calling appendLine in a loop. ***
// Reading scrollHeight right after inserting a node forces a synchronous
// layout; doing that four thousand times over a growing tree took **21.7 s**
// measured here on 2026-09-13, and the page is frozen for every one of them.
// Building into a fragment touches layout once.
//
// This is the path 继续 (resume) takes, so before the fix, resuming a paused
// log after a full port sweep looked exactly like the panel hanging - which is
// how it was found: the browser test's click on 继续 timed out.
function redrawLog() {
  const box = $("#log");
  const frag = document.createDocumentFragment();
  for (const e of logBuf.slice(-4000)) {
    if (!filters.has(e.kind)) { continue; }
    frag.appendChild(logNode(e));
  }
  box.textContent = "";
  box.appendChild(frag);
  box.scrollTop = box.scrollHeight;
}
function nowStamp() {
  const d = new Date(), p = (n,w=2) => String(n).padStart(w,"0");
  return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())+"."+p(d.getMilliseconds(),3);
}

$("#pause").onclick = () => {
  paused = !paused;
  $("#pause").textContent = paused ? "继续" : "暂停";
  $("#paused").hidden = !paused;
  if (!paused) { pausedCount = 0; redrawLog(); }
  else { pausedCount = 0; $("#paused").textContent = "已暂停，攒了 0 行"; }
};
// 清空之后插一条看得见的分隔线。
//
// *** 清是真清了，看着像没清。*** 会话跑着的时候新行 120 毫秒内就填回来，而新行
// 和刚被清掉的那些长得一模一样 —— 用户 2026-09-14 的原话是「log 清空我发现没有
// 真正的清空」。**不停数据流**：停了就漏掉板子这期间说的话，那比看着乱更糟。
// 有一条线在，底下的就都是新的。
$("#clear").onclick = () => {
  logBuf = [];
  addLog("log", "—— " + nowStamp() + " 清空，下面都是新的 ——");
  redrawLog();
};
// Saved as .txt, and named for the moment it was saved.
//
// The content was always plain text; the extension was .log, which Windows
// hands to whatever happens to have claimed it and which some mail clients and
// chat apps refuse to attach. .txt opens by double-clicking anywhere and can
// be pasted into a ticket, which is what this button is for.
//
// The whole buffer goes out, not the filtered view: a log is exported to send
// to somebody, and one silently missing the lines the filter was hiding is
// worse than no log at all.
//
// *** Structured output is a different thing and already exists - `porttool
// *** run --json/--csv` writes the report a production line archives. This is
// *** the raw serial conversation, for a person to read.
$("#save").onclick = () => {
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,"");
  const head = [
    "PortTool log  " + new Date().toString(),
    "control port: " + (state.port || "(not connected)") +
      "   firmware: " + (state.firmware || "?"),
    "lines: " + logBuf.length,
    "".padEnd(60, "-"),
  ].join("\r\n");
  const text = head + "\r\n" + logBuf.map(e => e.at + "  " + e.line).join("\r\n") + "\r\n";
  const a = el("a");
  a.href = URL.createObjectURL(new Blob([text], {type:"text/plain;charset=utf-8"}));
  a.download = "porttool-" + stamp + ".txt";
  a.click(); URL.revokeObjectURL(a.href);
};
document.querySelectorAll(".filt").forEach(c => c.onchange = () => {
  filters = new Set([...document.querySelectorAll(".filt:checked")].map(x=>x.value));
  filters.add("tx");
  redrawLog();
});

/* ---------------- api ---------------- */
async function api(path, body) {
  const opt = body ? {method:"POST", headers:{"Content-Type":"application/json"},
                      body:JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({error:"服务返回的内容看不懂。"}));
  return j;
}

let allPorts = [];

let chosenPort = null;

// Which port the left list has selected - the middle column always explains
// this one thing, whether it is a port or a plan.
let selected = null;

// Per-port pass/fail from the last time it was tested here. Kept in the page
// because it is about this session at this bench, not about the board.
let verdicts = {};

// A hint, never a decision: the label is the only thing there is to go on, and
// on 2026-09-08 the CAN adapter and the RS485 adapter could not be told apart
// from their VID/PID at all. So it marks a likely one and still makes somebody
// click.
function looksLikeRs232(label) {
  return /pl2303|prolific|ft232|ftdi|cp210|ch343|usb-serial ch34/i.test(label);
}

async function loadPorts() {
  const j = await api("/api/ports");
  allPorts = j.ports || [];
  const host = $("#portlist"); host.textContent = "";

  if (j.error || !j.ports || !j.ports.length) {
    host.appendChild(el("div", "sub",
      j.error || "没找到串口 —— 插上 USB-RS232 适配器再点「重新找」"));
    $("#connect").disabled = true;
    return;
  }

  // What was chosen last time. Offered as the selection rather than connected
  // to automatically: opening a serial port is a side effect, and a page that
  // grabbed a port the moment it loaded would fight anything else using it.
  if (!chosenPort && state && state.saved && state.saved.control &&
      j.ports.some(p => p.name === state.saved.control)) {
    chosenPort = state.saved.control;
  }

  for (const p of j.ports) {
    const row = el("div", "p");
    row.title = p.label;
    // 机器按这个认行，不按屏幕上的字 —— 标签是中文的，而且会改。
    row.dataset.port = p.name;
    row.textContent = p.label;
    if (looksLikeRs232(p.label)) {
      row.appendChild(el("span", "sug", "  ← 像是 RS232"));
    }
    // 模拟板单独标出来。它排在所有真串口后面，不加个记号就读成了又一个 COM 口 ——
    // 而它给的每一个读数都是编的。
    if (p.name === "sim") {
      row.classList.add("sim");
      if (p.unavailable) {
        // 找不到就把原因摆出来，而不是从列表里消失 ——
        // “本来就没有”和“没编”在屏幕上长得一模一样。
        row.classList.add("off");
        row.appendChild(el("span", "tag", "  ← 没编，点不了"));
        row.title = p.unavailable;
        row.appendChild(richText("div", "sub",
          "先编一个：`cd TestCase/host/porttool_caps && python build.py --sim`"));
      } else {
        row.appendChild(el("span", "tag", "  ← 不用接板子"));
      }
    }
    if (p.unavailable) {
      row.style.opacity = "0.55";
      host.appendChild(row);
      continue;
    }
    if (chosenPort === p.name) {
      row.classList.add("on");
      if (state && state.saved && state.saved.control === p.name) {
        row.appendChild(el("span", "sug", "  ← 上次用的"));
      }
    }
    row.onclick = () => {
      if (state && state.connected) { return; }
      chosenPort = p.name;
      for (const other of host.querySelectorAll(".p")) { other.classList.remove("on"); }
      row.classList.add("on");
      $("#connect").disabled = false;
      $("#connhint").innerHTML = "已选 <b>" + p.name + "</b> —— 点「连接」继续。";
    };
    host.appendChild(row);
  }

  // A port that went away between refreshes must not stay selected: connecting
  // to it would fail with a message about a port nobody can see any more.
  if (chosenPort && !j.ports.some(p => p.name === chosenPort)) {
    chosenPort = null;
  }
  $("#connect").disabled = !chosenPort;
}

$("#refresh").onclick = loadPorts;

// Off is a diagnostic, not a preference: with it on a healthy loop is all
// anyone ever sees, so switching it off and watching miss climb while seq
// stands still is how you confirm the counter means anything.
$("#autoecho").onchange = async () => {
  applyState(await api("/api/autoecho", {on: $("#autoecho").checked}));
};

$("#connect").onclick = async () => {
  if (!chosenPort) { return; }
  $("#connect").disabled = true;
  const j = await api("/api/connect", {port: chosenPort});
  $("#connect").disabled = false;
  if (j.error) { showMessage(j.error, true); return; }
  applyState(j);
  startEvents();
};

$("#disconnect").onclick = async () => {
  if (evtSource) { evtSource.close(); evtSource = null; }
  applyState(await api("/api/disconnect", {}));
};

function startEvents() {
  if (evtSource) evtSource.close();
  evtSource = new EventSource("/api/events");
  evtSource.onmessage = e => {
    const d = JSON.parse(e.data);
    addLog(d.kind, d.line, d.at);
    // 故障、复位、断线不能只埋在日志里 —— 摆到最上面，并刷新状态（决策 77）。
    if (d.kind === "panel" && /^\[(故障|连接)\]/.test(d.line || "")) {
      refreshState().then(() => showMessage(d.line, true));
      return;
    }
    if (d.kind === "frame" && d.port) {
      reads[d.port] = d;
      const dot = d.port.indexOf(".");
      if (dot > 0) {
        // An event frame belongs to the port before the dot, and is NOT
        // judged: the plan states criteria per port, so asking for knx.rx's
        // criteria would find none and report the port unjudged - overwriting
        // a verdict its own session had already reached.
        const owner = d.port.slice(0, dot);
        const list = events[owner] || (events[owner] = []);
        list.push({tick: d.tick, sub: d.port.slice(dot + 1), fields: d.fields});
        while (list.length > EVENTS_MAX) list.shift();
        renderPanel();
        return;
      }
      renderPanel(); judge(d);
    }
  };
  evtSource.onerror = () => { /* EventSource retries by itself */ };
}

/* ---------------- state ---------------- */
function applyState(j) {
  const st = j.state || j;
  state = st;
  $("#disconnect").hidden = !st.connected;
  $("#connect").hidden = !!st.connected;

  // One gate for the whole rest of the page. Everything on it is a reading
  // that arrives over the control port, so before that port is open there is
  // nothing here that could mean anything.
  $("#afterconn").classList.toggle("live", !!st.connected);
  $("#connhint").innerHTML = st.connected
    ? "控制口 <b>" + st.port + "</b> 已连上。要换口先点「断开」。"
    : "先选一个口，再点连接。板子的控制口是端子 <b>C05 / C06</b>，"
      + "要用 USB-RS232 适配器（端子是真 ±12 V）。";

  const s = $("#status");
  if (st.connected && st.linkError) {
    s.classList.add("bad"); s.textContent = "控制口断了";
  } else if (st.connected) {
    s.classList.remove("bad");
    s.innerHTML = "已连上 <b>" + st.port + "</b>　固件 " + (st.firmware || "?");
  } else {
    s.classList.add("bad"); s.textContent = "没有连接"; reads = {};
  }
  $("#echobox").hidden = !st.connected;
  renderCriteria(st);
  $("#autoecho").checked = st.autoEcho !== false;
  const es = $("#echostat");
  if (st.echoNote) { es.textContent = "回不过去：" + st.echoNote; es.style.color = "var(--err)"; }
  else if (st.autoEcho === false) { es.textContent = "关着 —— miss 会开始涨"; es.style.color = "var(--warn)"; }
  else { es.textContent = "已回 " + (st.echoCount || 0) + " 次"; es.style.color = ""; }

  showMessage(st.linkError || st.capsError, true);
  renderTree(); renderPanel();
}

function showMessage(text, bad) {
  const host = $("#panelbody");
  const old = host.querySelector(".msg"); if (old) old.remove();
  if (!text) return;
  const m = el("div", "msg" + (bad ? " bad" : "")); m.textContent = text;
  host.prepend(m);
}

async function refreshState() { applyState(await api("/api/state")); }

/* ---------------- port tree ---------------- */
function chanSet(p) {
  if (!picked[p.name]) {
    picked[p.name] = new Set();
    for (let i = 1; i <= p.channels; i++) picked[p.name].add(i);
  }
  return picked[p.name];
}
// 格子上印工程师嘴里的名字，不印端子号（用户 2026-09-11 定）。
// 名字取自 Hardware/Klemmenbezeichnungen-R.pdf，按用户的习惯缩写。
const CHAN_NAME = {
  dout: "DO",  din: "DI",  ain: "AI",  aout: "AO",  relay: "Relay ",
  temp: "温度",
};
const PORT_NAME = {
  rs485: "RS485", can: "CAN", rs232: "RS232", knx: "KNX",
  eth: "网口", usb: "USB", sd: "SD 卡", sdram: "SDRAM", temp: "温度",
};
function displayName(p, i) {
  if (CHAN_NAME[p.name]) return CHAN_NAME[p.name] + i;
  if (p.channels === 1 && PORT_NAME[p.name]) return PORT_NAME[p.name];
  return p.name + i;
}

// 通道读数该不该染成「通 / 断」。
//
// 只有单值通道能这么染 —— din 的 0/1、dout 的占空、relay 的电平。
// 模拟量报的是复合串（ain 的 raw/mV、aout 的 asked/量化/µA、temp 的
// mV/0.1℃），把它当布尔判会得出「一路死掉的模拟通道显示为绿色」：
// "0/0" 不等于字符串 "0"。所以复合串一律不染色，只显示数。
function readingClass(v) {
  if (v === undefined) return "";
  if (v.indexOf("/") >= 0) return "num";
  return v === "0" ? "off" : "on";
}

// ---- 模拟量：从引脚上的数换算到端子上的量 ----------------------------
//
// 固件刻意只报引脚上的 raw / mV，不做前端换算 —— 因为换算取决于板子焊成了
// 哪个档位，而**跳线状态固件读不回来**（porttool_ain.c 有明文声明）。
// 换算因此在这里做，系数出自 HARDWARE-FACTS.md「模拟输入前端」。
//
// ⚠️ 档位是 2026-08-27 定死的：**AIN1 电压档、AIN2 电流档**。板子要是焊成
// 别的样子，下面这两行就是错的 —— 所以卡片上会把这个前提写出来。
const AIN_RANGE = [
  { unit: "V",  scale: 4.0089 / 1000, digits: 3 },   // 端子 mV = 引脚 mV × 4.0089
  { unit: "mA", scale: 1 / 124,       digits: 3 },   // 端子 µA = 引脚 mV × 1000/124
];

// 出厂九个跳线全开路，此时 MCU 引脚彻底悬空，读到的不是端子上的信号。
//
// ⚠️ 判据用**毫伏**，不用 raw。原来写的是 raw 200–650，那是一个 12 位的数，
// 而固件报的 raw 是 16 位的（`ADC_RESOLUTION_16B`，满量程 65535）。380 mV
// 在 16 位下是 raw ≈ 10000，所以那条判据**一次都不可能命中**；反过来 raw
// 200–650 在 16 位下只有 8–25 mV，是「引脚贴着地」，会把另一种故障误报成
// 悬空。换成毫伏之后，固件改分辨率也不会再把它带偏。
//
// ⚠️ 这条带子本身还没定论：2026-08-27 在 bring-up 固件上测到约 380 mV，
// 2026-09-10 在工装镜像上同样两路读到的却是 0–12 raw（≈0 mV）。两次对不上，
// 所以真正的判据仍然是「有没有人确认那四处锡桥焊了」——
// 见 $PROD/docs/outbound/AIN-JUMPER-REQUEST.md。
const AIN_FLOAT_MIN_MV = 300, AIN_FLOAT_MAX_MV = 450;

// formatReading 把一路读数变成 {text, hint}。text 顶替原来那串生数，
// hint 是补充说明；两者都拿不准就原样显示，绝不猜。
function formatReading(portName, ch, v) {
  if (v === undefined) return null;
  const parts = v.split("/");

  if (portName === "ain" && parts.length === 2) {
    const raw = Number(parts[0]), mv = Number(parts[1]);
    if (!isFinite(raw) || !isFinite(mv)) return null;
    const r = AIN_RANGE[ch - 1];
    const floating = mv >= AIN_FLOAT_MIN_MV && mv <= AIN_FLOAT_MAX_MV;
    const out = { text: r ? (mv * r.scale).toFixed(r.digits) + " " + r.unit : v,
                  hint: "引脚 " + mv + " mV，raw " + raw };
    if (floating) {
      out.hint = "⚠ 落在悬空带（引脚 " + mv + " mV，raw " + raw + "）—— 跳线可能没焊，这个数不是端子上的信号";
      out.warn = true;
    }
    return out;
  }

  if (portName === "aout" && parts.length === 3) {
    const asked = Number(parts[0]), quant = Number(parts[1]), ua = Number(parts[2]);
    if (!isFinite(ua)) return null;
    return { text: (ua / 1000).toFixed(3) + " mA",
             // 这个电流是算出来的，不是量出来的 —— 板上没有任何回读通道。
             hint: "算出来的，非实测。要 " + asked + " mV，DAC 实际 " + quant + " mV" };
  }

  if (portName === "temp" && parts.length === 2) {
    const mv = Number(parts[0]), deci = Number(parts[1]);
    if (!isFinite(deci)) return null;
    return { text: (deci / 10).toFixed(1) + " °C", hint: mv + " mV" };
  }

  return null;
}

// The product's boards. This is the only mapping the page keeps, and it is the
// product's structure rather than a list of ports: the board a port lives on
// comes from the firmware's own board= field, so a port added to the firmware
// lands in the right group here without touching this file. An unknown value
// is shown verbatim instead of hiding the port.
// How to test each port, in the words a hardware engineer needs: what to wire,
// what the test does, and what counts as passing. Deliberately NOT in the
// firmware - it is Chinese prose that changes with wording, and a reflash to
// fix a typo would be absurd. A port with no entry says so on screen, so a
// port added to the firmware shows up here as missing rather than silently
// bare. The facts come from $PROD/docs/modules/M4/PORTTOOL-FLOW.md section B.
// 一个端口怎么接线。
//
// *** 这里只剩接线。*** 「测什么 / 怎么做 / 什么算过」跟着用例走，写在下面的
// CASE_TEXT 里 —— 一个端口常常有好几个用例，前置和判据互相矛盾：以太网①不用
// 插网线、②必须先起会话；RS485①不要对端、②非有对端不可。把它们并成端口级的

// 一个用例的说明。没写的端口给一段老实话，不编。
function caseTextFor(p, key) {
  const t = ((CASE_TEXT[p.name] || {})[key]) || {};
  if (t.title) { return t; }
  return {
    title: key === "session" ? "持续采样" : targetCN(key),
    what: "这一项还没有写说明。板子报了它，能跑也能看读数，只是判据要问人。",
    how: key === "session" ? "点开始。" : "点执行。",
    pass: "",
  };
}

// 说明里的 **一段** 印成粗体。
//
// *** 页面的文字一律走 textContent，所以写在字符串里的星号原来是**原样显示**的
// *** —— 说明越长越要有重点，而一屏星号读起来比没有重点还糟。只认这一种记号，
// *** 不做别的 markdown：多一种就是多一种在别处咬人的转义。
function richText(tag, cls, s) {
  const node = el(tag, cls);
  String(s).split("**").forEach((part, i) => {
    if (part === "") { return; }
    // 换行也照写。一条一条配的说明挤成一整段，等于没分条。
    part.split("\n").forEach((line, k) => {
      if (k) { node.appendChild(el("br")); }
      if (line === "") { return; }
      node.appendChild(i % 2 ? el("b", null, line) : document.createTextNode(line));
    });
  });
  return node;
}

// ---- 判据那句话 -----------------------------------------------------------
//
// 判据本身来自方案文件、由 internal/ptcheck 求值，这里一个字都不判 —— 只是把
// 它给的结构化结果（字段、算子、值、读到什么）拼成中文。
//
// *** 为什么不让 Go 那边直接出中文：同一份文案还要进命令行和 CSV 报告，而
// *** 那两处按约定是英文（~/.claude/rules/language.md）。所以英文留在 Go 里，
// *** 屏幕上这一层自己拼。
const OP_CN = {eq: "要等于", ne: "不能是", contains: "要包含"};

function fieldLabel(port, field) {
  const m = /^([A-Za-z0-9_.]+)(?:\[(\d+)\])?$/.exec(String(field || ""));
  if (!m) { return String(field || ""); }
  const p = (state.ports || []).find(x => x.name === port);
  const ch = /^ch(\d+)$/.exec(m[1]);
  const base = (ch && p) ? displayName(p, Number(ch[1])) : fieldCN(m[1]);
  return m[2] === undefined ? base : (base + "（第 " + (Number(m[2]) + 1) + " 个数）");
}

function checkCN(port, c) {
  if (!c || !c.field) { return "这条判据"; }
  const f = fieldLabel(port, c.field);
  const unit = c.unit ? " " + c.unit : "";
  const has = v => v !== undefined && v !== null;
  if (c.op === "range") {
    if (has(c.min) && has(c.max)) { return f + " 要在 " + c.min + "–" + c.max + unit + " 之间"; }
    if (has(c.min)) { return f + " 要不小于 " + c.min + unit; }
    return f + " 要不大于 " + c.max + unit;
  }
  if (c.op === "count_zero") { return f + " 必须一次都没有"; }
  return f + " " + (OP_CN[c.op] || c.op) + " " + valueCN(c.value) + unit;
}

// 一条没过的判据，说成一句话。
function failCN(port, x) {
  const c = x.check || {};
  const what = checkCN(port, c);
  if (x.missing) {
    return what + "，可是板子这一帧里根本没有" + fieldLabel(port, c.field) + "这个读数";
  }
  return what + "，读到的是 " + (x.got === "" ? "空" : valueCN(x.got));
}

// What a hardware engineer wants off this list at a glance: has this port been
// tested, and did it pass. Nothing else.
// Asks the server to judge a frame against the plan's criteria.
//
// The judging is deliberately NOT done here: the criteria live in the plan file
// and the evaluator is internal/ptcheck, and a copy of either in this page
// would drift from what a production run decides. So the page sends the numbers
// it has and shows the answer it gets.
let judgeBusy = {};
let judgeWhy = {};

// Returns the verdict as three states, not two: true, false, or null for "no
// criteria, so nobody knows". Returning a boolean is what made a target with
// no criteria come out as 通过 - the caller only tested for === false, and
// undefined is not false. Found 2026-09-08.
async function judge(frame) {
  if (judgeBusy[frame.port]) { return curVerdict(frame.port); }
  // 多点测量正在逐点改这个口的输出，方案那组判据此刻不成立 —— 它是程序在改，
  // 不是人在改，所以 offPlan 看不见（那张表只记人改过的）。
  if (aocalRunning && frame.port === "aout") {
    delete verdicts[frame.port];
    judgeWhy[frame.port] = "多点测量在跑，逐点改着输出 —— 方案的判据这会儿不适用";
    renderTree(); renderPanel();
    return null;
  }
  // 参数被人改过的会话帧，不判 —— 判据是按方案那组参数写的，拿它去判一组别的
  // 参数，好板子也会报失败。pt.run 的目标不受影响：它不带卡片上的参数。
  if (!frame.target) {
    const p = (state.ports || []).find(x => x.name === frame.port);
    const off = p ? offPlan(p) : [];
    if (off.length) {
      delete verdicts[frame.port];
      judgeWhy[frame.port] = offPlanWhy(off);
      renderTree(); renderPanel();
      return null;
    }
  }
  judgeBusy[frame.port] = true;
  try {
    // 只送原始行：字段怎么读由服务端定，和产线跑方案用的是同一份（决策 77）。
    const r = await api("/api/judge", {
      port: frame.port, target: frame.target || "",
      line: frame.line || "", lines: frame.lines || [],
      args: frame.args || {},
    });
    if (r.known === false) {
      judgeWhy[frame.port] = r.why || "";
      delete verdicts[frame.port];
    } else if (r.error) {
      judgeWhy[frame.port] = r.error;
      delete verdicts[frame.port];
    } else {
      verdicts[frame.port] = !!r.pass;
      judgeWhy[frame.port] = (r.results || [])
        .filter(x => !x.pass)
        .map(x => failCN(frame.port, x))
        .join("；");
      // 持续测试里判出不过：停掉整轮、点故障灯（决策 37 第 3 件）。只在持续测试里，
      // 因为单次测试的「不过」就摆在卡片上，人就在跟前。
      if (!r.pass && state.run && (state.run.ports || []).includes(frame.port)) {
        api("/api/fault", {on: true,
          why: portLabel(frame.port) + " 判为不过：" + (judgeWhy[frame.port] || "")})
          .then(refreshState);
      }
    }
  } catch (e) {
    judgeWhy[frame.port] = String(e);
    delete verdicts[frame.port];
  } finally {
    judgeBusy[frame.port] = false;
    renderTree(); renderPanel();
  }
  return curVerdict(frame.port);
}

function curVerdict(port) {
  return verdicts[port] === undefined ? null : verdicts[port];
}

// How the plan starts each port, fetched once per port and kept.
//
// *** The card's inputs are prefilled from this, and 开始测试 sends whatever
// *** the inputs say. *** One source of truth on screen: the criteria were
// written for particular parameters, so the page shows those parameters rather
// than starting with one set of values and judging by another. Changing an
// input is then a deliberate act with a visible consequence.
let planParams = {};      // port -> {params, frames} | null when not in the plan
let planPending = {};

// pt.run 目标 -> 方案给它的参数。**一定要发出去** —— 判据是照着某一个窗口写的
// （`sdram.crc` 只算 64 KiB），不带参数跑出来的是固件的默认值，再拿另一套限值去
// 判它，好板子也会报失败。命令行一直是带着参数发的，页面以前没带，于是同一条方案
// 步骤两边得出不同结论。2026-09-13 修。
let planRunArgs = {};

function ensurePortPlan(name) {
  if (planParams[name] !== undefined || planPending[name]) { return; }
  planPending[name] = true;
  api("/api/portplan?port=" + encodeURIComponent(name)).then(pp => {
    Object.assign(planRunArgs, (pp && pp.runs) || {});
    planParams[name] = (pp && pp.known)
      ? {params: pp.params || {}, frames: pp.frames || 3, step: pp.step, peer: pp.peer || ""}
      : null;
  }).catch(() => { planParams[name] = null; })
    .finally(() => { planPending[name] = false; renderPanel(); });
}

// What the person typed, else what the plan says, else what the board reports.
function paramDefault(p, name) {
  const mine = editedVal(p, name);
  if (mine !== undefined) { return mine; }
  const pp = planParams[p.name];
  if (pp && pp.params && pp.params[name] !== undefined) {
    return String(pp.params[name]);
  }
  return (p.values || {})[name] || "";
}

// A per-channel parameter is written "1:100,2:100" in both the plan and the
// board's own vals= line. Prefilling only the scalar ones was a real bug: the
// relay step asks for on=1:1..6:1 and its criteria check ch1 and ch6, so with
// the board's default on=1:0 the one-button test drove nothing and reported a
// healthy board as failed. Found by the browser test, 2026-09-08.
function planPerCh(p, name) {
  const pp = planParams[p.name];
  const spec = pp && pp.params ? pp.params[name] : undefined;
  const out = {};
  if (spec === undefined) { return out; }
  for (const tok of String(spec).split(",")) {
    const [ch, v] = tok.split(":");
    if (v !== undefined) { out[Number(ch)] = v; }
  }
  return out;
}

// ---- 人改过的参数 ---------------------------------------------------------
//
// 存在页面状态里，不存在输入框里。每来一帧 applyState() 都会 renderPanel()，而
// renderPanel() 第一件事就是 #panelbody 整个清空重建 —— 值只活在 DOM 里的话，
// 会话一跑起来，人刚敲进去的数就被下一帧抹掉。
//
// *** 这和 testing / picked / aocal 是同一类东西，理由也是同一个。
let edited = {};          // 端口 -> {参数: "值"} 或 {参数: {通道: "值"}}

function editedVal(p, name) {
  const v = (edited[p.name] || {})[name];
  return (v === undefined || typeof v === "object") ? undefined : v;
}
function setEdited(p, name, v) {
  if (!edited[p.name]) { edited[p.name] = {}; }
  edited[p.name][name] = v;
}
function editedCh(p, name, ch) {
  const m = (edited[p.name] || {})[name];
  return (m && typeof m === "object") ? m[ch] : undefined;
}
function setEditedCh(p, name, ch, v) {
  if (!edited[p.name]) { edited[p.name] = {}; }
  const m = edited[p.name];
  if (!m[name] || typeof m[name] !== "object") { m[name] = {}; }
  m[name][ch] = v;
}

// 当前卡片上的参数和方案里写的差在哪。空数组 = 一模一样。
//
// *** 这是判据能不能用的唯一依据。判据是按方案那组参数写的（station6 的
// *** high-side-out 判 ch1 eq 100 / ch8 eq 100），人把通道或占空比一改，那两条
// *** 判据就永远落空 —— 好板子照样报失败。用户 2026-09-11 就是这么撞上的：
// *** 勾 DO3、占空比 50，1.4 秒出一个「失败」。
function offPlan(p) {
  const pp = planParams[p.name];
  if (!pp || !pp.params) { return []; }
  const out = [];
  for (const [k, planned] of Object.entries(pp.params)) {
    if (k === "ch") {
      const now = chList(p);
      const was = String(planned).split(",").map(s => Number(s.trim()))
                    .filter(n => n >= 1).sort((a,b) => a-b).join(",");
      if (now !== was) {
        out.push({what: "测哪几路", was: chanNames(p, was), now: chanNames(p, now)});
      }
      continue;
    }
    if ((p.perChannel || {})[k]) {
      const was = planPerCh(p, k);
      const now = {};
      for (const i of [...chanSet(p)].sort((a,b) => a-b)) {
        now[i] = String(editedCh(p, k, i) ?? was[i] ?? (p.perChannel[k]||{})[i] ?? 0);
      }
      const wasS = perChText(p, was), nowS = perChText(p, now);
      if (nowS !== wasS) { out.push({what: paramCN(k), was: wasS, now: nowS}); }
      continue;
    }
    const now = String(editedVal(p, k) ?? planned);
    if (now !== String(planned)) {
      out.push({what: paramCN(k), was: valueCN(String(planned)), now: valueCN(now)});
    }
  }
  return out;
}

// 八路都一样就说「八路都一样」，不要把八个格子一个一个念出来 —— 那样一句话
// 撑满半屏，而真正要看的「哪里不一样」反而埋在里面。
function chanNames(p, list) {
  const ns = String(list).split(",").filter(Boolean).map(Number);
  if (!ns.length) { return "一个都没选"; }
  if (ns.length === p.channels) { return "全部 " + p.channels + " 路"; }
  return ns.map(n => displayName(p, n)).join("、");
}

function perChText(p, m) {
  const keys = Object.keys(m).map(Number).sort((a,b) => a-b);
  if (!keys.length) { return "没有"; }
  const vals = [...new Set(keys.map(k => String(m[k])))];
  if (vals.length === 1 && keys.length > 1) {
    return (keys.length === p.channels ? "全部 " + p.channels + " 路" : keys.length + " 路") +
           "都是 " + vals[0];
  }
  return keys.map(k => displayName(p, k) + "=" + m[k]).join("、");
}

// 判据为什么这次不适用。细节写在卡片顶上的说明块里，按钮旁边只留一句短的 ——
// 同一段话印两遍，等于两处都没人读。
function offPlanWhy(off) {
  const plan = state.criteriaPlan || "方案";
  return "**这次只给读数、不给结论** —— 判据是照 " + plan +
         " 里那组参数写的，配成别的样子它就不适用了。\n" +
         off.map(d => "**" + d.what + "**：方案是 " + d.was + "，现在是 " + d.now).join("；") +
         "。点「恢复方案参数」就回到能判的状态。";
}

// The plan's channel list, applied once when a port is first selected. Once,
// not on every render: the checkboxes are the person's to change, and a render
// that put them back would make unchecking one impossible.
let chanApplied = {};
function applyPlanChannels(p) {
  const pp = planParams[p.name];
  if (!pp || chanApplied[p.name]) { return; }
  chanApplied[p.name] = true;
  const spec = pp.params ? pp.params["ch"] : undefined;
  if (!spec) { return; }
  const s = chanSet(p);
  s.clear();
  for (const tok of String(spec).split(",")) {
    const n = Number(tok.trim());
    if (n >= 1 && n <= p.channels) { s.add(n); }
  }
}

function portStatus(p) {
  if (p.running) { return {icon:"⏳", cls:"testing", text:"测试中"}; }
  const v = verdicts[p.name];
  if (v === true)  { return {icon:"✅", cls:"pass", text:"通过"}; }
  if (v === false) { return {icon:"❌", cls:"fail", text:"失败"}; }
  return {icon:"⬜", cls:"untested", text:"未测"};
}

function renderTree() {
  const host = $("#treebody"); host.textContent = "";
  if (!state.connected) { host.appendChild(el("div","hint","连上板子以后，这里会列出它自己报的端口。")); return; }

  // Group by the firmware's board= field, in the order boards are stacked.
  const order = ["bridge","upper","lower","junction","whole"];
  const groups = new Map();
  for (const p of state.ports || []) {
    const b = p.board || "other";
    if (!groups.has(b)) { groups.set(b, []); }
    groups.get(b).push(p);
  }
  const seen = [...groups.keys()].sort(
    (a,b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));

  for (const b of seen) {
    host.appendChild(el("div","boardhd", BOARD_LABEL[b] || b));
    for (const p of groups.get(b)) {
      const st = portStatus(p);
      const row = el("div", "prow " + st.cls + (selected === p.name ? " on" : ""));
      row.appendChild(el("span","ico", st.icon));
      row.appendChild(el("span","nm", portLabel(p.name)));
      // The protocol key is what the log lines and the plan files say, so it
      // stays reachable - but it is not printed here any more. The panel is
      // read in Chinese (user 2026-09-11), and the key has its own labelled
      // row on the card.
      row.title = "协议里的名字：" + p.name;
      // 协议名不上屏了，但机器还要认得出这一行是哪个端口 —— 浏览器测试按这个挑。
      row.dataset.port = p.name;
      row.appendChild(el("span","stat", st.text));
      row.onclick = () => { selected = p.name; renderTree(); renderPanel(); };

      // 勾一个就是「这一轮带上它」。只有会话能勾 —— 一次性的用例自己跑完就回来了，
      // 没有「带上它一起持续跑」这回事。
      if (p.kind === "session") {
        const c = el("input","pick"); c.type = "checkbox";
        c.checked = picked2.has(p.name);
        c.dataset.pick = p.name;
        c.title = "勾上，和别的端口一起跑";
        c.onclick = (e) => {
          e.stopPropagation();
          c.checked ? picked2.add(p.name) : picked2.delete(p.name);
          renderBatchBar();
        };
        row.insertBefore(c, row.firstChild);
      }
      host.appendChild(row);
    }
  }
  renderBatchBar();
}

// 勾了哪几个端口要一起跑。和 picked（通道选择）不是一回事，所以另起一个名字。
const picked2 = new Set();

// 左边列表顶上的那一条：勾了几个、跑多久、一个「开始」。
//
// *** 这里没有「单次 / 持续」的选择 —— 一次点好几个端口，要的就是让它们一起跑
// *** 着。要单跑一轮拿结论，去那个端口自己的卡片上点，那里才有判据。
function renderBatchBar() {
  const bar = $("#batchbar");
  if (!bar) { return; }
  bar.textContent = "";
  if (!state.connected) { bar.hidden = true; return; }
  bar.hidden = false;

  const live = state.run;
  if (live) {
    const left = live.left_s;
    bar.appendChild(richText("div","note",
      "**持续测试跑着**：" + (live.ports || []).map(portLabel).join("、") +
      "\n" + (left === null || left === undefined
        ? "不限时长，点停止才结束。"
        : "还剩 " + Math.floor(left / 60) + " 分 " + (left % 60) + " 秒。") +
      // 页面的日志窗只留最后几分钟，跑几小时的那部分靠这个文件。说出来，
      // 否则人跑完四小时才发现要找的东西早滚没了。
      (live.log ? "\n全程日志边跑边写进：**" + live.log + "**" : "")));
    const stop = el("button","primary","停止");
    stop.dataset.batch = "stop";
    stop.onclick = () => stopContinuous();
    bar.appendChild(stop);
    return;
  }

  const names = [...picked2];
  const head = el("div","note");
  head.appendChild(el("b", null, "一起跑：" + (names.length
    ? names.map(portLabel).join("、") : "还没勾端口")));
  bar.appendChild(head);
  if (!names.length) {
    bar.appendChild(el("div","sub","在下面的端口前面打勾，可以勾多个。"));
    return;
  }

  bar.appendChild(hoursPicker(renderBatchBar, false));

  const warn = bandwidthWarning(names);
  if (warn) { bar.appendChild(richText("div","sub warn", warn)); }

  const go = el("button","primary","开始");
  go.dataset.batch = "start";
  go.disabled = !!warn;
  go.onclick = async () => {
    const cmds = [];
    for (const name of names) {
      const p = (state.ports || []).find(x => x.name === name);
      if (p) { cmds.push(startCommandFor(p)); }
    }
    await startContinuous(names, cmds);
  };
  bar.appendChild(go);
}

// The old expandable tree, kept for the channel checkboxes the cards need.
function renderTreeDetail() {
  const host = $("#treebody");
  for (const p of state.ports || []) {
    const g = el("div","grp");
    const hd = el("div","hd");
    const cb = el("input"); cb.type = "checkbox"; cb.checked = !!expanded[p.name];
    cb.onchange = () => { expanded[p.name] = cb.checked; renderTree(); renderPanel(); };
    hd.appendChild(cb);
    hd.appendChild(el("span","blk " + (["A","B","C","D"].includes(p.blk) ? p.blk : "x"),
                      p.blk === "-" ? "板载" : p.blk));
    hd.appendChild(el("span","nm", p.name));
    if (p.running) hd.appendChild(el("span","tag run","跑着"));
    hd.appendChild(el("span","tag " + p.kind, "会话"));
    g.appendChild(hd);

    if (expanded[p.name]) {
      const kids = el("div","kids");
      if (p.kind === "session" && p.channels > 1) {
        const all = el("button","selall","全选 / 全不选");
        all.onclick = () => {
          const s = chanSet(p);
          if (s.size === p.channels) s.clear(); else
            for (let i=1;i<=p.channels;i++) s.add(i);
          renderTree(); renderPanel();
        };
        kids.appendChild(all);
        for (let i = 1; i <= p.channels; i++) {
          const lb = el("label");
          const c = el("input"); c.type="checkbox"; c.checked = chanSet(p).has(i);
          c.onchange = () => { c.checked ? chanSet(p).add(i) : chanSet(p).delete(i);
                               renderPanel(); };
          lb.appendChild(c);
          lb.appendChild(document.createTextNode(displayName(p, i)));
          kids.appendChild(lb);
        }
      } else {
        kids.appendChild(el("div","t", p.term));
      }
      g.appendChild(kids);
    }
    host.appendChild(g);
  }
}

/* ---------------- port cards ---------------- */
function chList(p) { return [...chanSet(p)].sort((a,b)=>a-b).join(","); }

// Which values a parameter takes comes from the board's own limits= line, so a
// mode added to the firmware appears here with no change to this page and a
// dropdown can never offer something the board will refuse. The hard-coded
// pair is the fallback for firmware older than the limits= line.
function modesFor(p) {
  const enum_ = ((p.limits || {}).mode || {}).enum;
  if (enum_ && enum_.length) { return enum_; }
  if (p.name === "relay") return ["hold","square"];
  if (p.name === "dout")  return ["hold","blink"];
  return [(p.values || {}).mode || ""];
}

// A number the board bounds is bounded in the input too, so a value it would
// refuse is hard to type rather than refused after the fact.
function applyLimit(p, name, inp) {
  const l = (p.limits || {})[name];
  if (!l) { return; }
  if (l.min !== null && l.min !== undefined) { inp.min = l.min; }
  if (l.max !== null && l.max !== undefined) { inp.max = l.max; }
  if (l.spec) { inp.title = paramCN(name) + "（协议里叫 " + name + "）接受 " + l.spec; }
  watchRange(p, name, inp);
}

// 超出板子收的范围就当场说，不等命令发出去。
//
// *** 范围出自 pt.caps 的 limits= 行，不是按端口写死的。*** 所以「继电器周期
// 不能小于 1000」「DO 频率不能超过 2000」这两条根本不出现在代码里 —— 固件改了
// 上下限，这里跟着变，新加一个参数也自动有。写死的版本会在固件改了之后继续拦
// 一个板子其实能收的值，而那种错最难看出来。
//
// *** 不改用户敲进去的字。*** 悄悄把 500 改成 1000，人下一眼看到的是一个自己
// 没打过的数，而他要的那个值到底行不行，没有任何地方说过。
function watchRange(p, name, inp) {
  const l = (p.limits || {})[name] || {};
  const lo = (l.min === null || l.min === undefined) ? null : Number(l.min);
  const hi = (l.max === null || l.max === undefined) ? null : Number(l.max);
  if (lo === null && hi === null) { return; }

  const say = () => {
    const raw = inp.value.trim();
    const v = Number(raw);
    let why = "";
    if (raw === "") { why = ""; }
    else if (!isFinite(v)) { why = "这不是一个数"; }
    else if (lo !== null && v < lo) {
      why = "板子最小收 " + lo + "，填 " + raw + " 会被它拒绝";
    } else if (hi !== null && v > hi) {
      why = "板子最大收 " + hi + "，填 " + raw + " 会被它拒绝";
    }
    inp.classList.toggle("bad", !!why);
    // 说明贴在这一格自己后面 —— 八路各一格时，说「有一格超了」等于没说。
    let tip = inp.nextElementSibling;
    if (tip && tip.className !== "rangetip") { tip = null; }
    if (why && !tip) {
      tip = el("span", "rangetip");
      inp.parentNode.insertBefore(tip, inp.nextSibling);
    }
    if (tip) { tip.textContent = why; tip.hidden = !why; }
  };

  inp.addEventListener("input", say);
  inp.addEventListener("change", say);
  say();
}

// 按下去之前就该知道的事：这个口有什么前提没满足、有什么硬件条件不由软件决定。
//
// *** 和用例说明里的「怎么做」不是一回事。*** 那一行讲的是每次都一样的步骤；
// 这里讲的是**此刻这组勾选和这块板子**的状况，勾法一变，说的话就变。
// 按当前的周期和时长，这一轮持续测试要花掉多少次吸合。
//
// *** 算出来的数，不是一句「有寿命」。*** 3 万次听起来很多，14400 次听起来
// 很少，直到把它们放在一句话里 —— 而这两个数正是人要拿来决定的那两个。
function relayWearSays() {
  const p = (state.ports || []).find(x => x.name === "relay");
  const per = p ? portPeriodMs(p) : 1000;
  const hours = runHours || 4;
  const cycles = Math.round(hours * 3600 * 1000 / per);
  const pct = Math.round(cycles / 30000 * 100);
  return "周期 " + per + " 毫秒跑 " + (runHours ? runHours + " 小时" : "四小时")
       + " 是 " + cycles.toLocaleString() + " 次吸合，**一轮就吃掉额定寿命的 "
       + pct + " %**。";
}

function headsUp(p) {
  const out = [];

  // *** 不再说「拿一根八芯线把 DO 接到 DI」。*** 那是这张工作台上的
  // 一种夹具选择，不是必然的接法 —— 面板替产线定夹具，就是替它定了
  // 工位怎么建（DECISIONS 43）。板子那一侧的事实照说：DI 只等输入，DO 只管输出。
  if (p.name === "din") {
    out.push("这个口**只读不驱动** —— 它等的是外面给到端子上的 24 V。"
           + "激励从哪来是工位的事（工装板、别的夹具、手里一根线都行），"
           + "面板不知道，也不判它。");
  }
  if (p.name === "dout") {
    out.push("这一段只证明**固件收下并保持住了你设的值**。"
           + "**端子上真出没出 24 V、电流够不够，板上没有回读，读不回来** —— "
           + "那要工位自己的办法去量。");
  }

  // 出厂九个跳线全开路。这不是配置，是板子焊成什么样 —— 软件读不回来，所以只能
  // 在人按下去之前说一句，免得把「没焊跳线」当成「AI 坏了」。
  if (p.name === "ain" && chanSet(p).size) {
    out.push("⚠️ **出厂九个跳线全是开路的**，那时这两个脚彻底悬空，读数会趴在 0 附近而判失败 ——"
           + "那是**跳线没焊**，不是 AI 坏了。先确认 JP5 / JP6 / JP8 / JP9 焊了没有。");
  }
  if (p.name === "aout" && chanSet(p).size) {
    out.push("⚠️ **端子上出来的是几伏还是几毫安，取决于 JP3 / JP4 焊成什么样** ——"
           + "软件读不回来。判据只看板子收没收下你填的毫伏；**万用表量到多少，是另一件事**。");
  }

  // 半双工：发的时候收发器被切去发，所以板子听不见自己。这解释了为什么这个口
  // 非要一个真的对端，而 RS232 不用。
  //
  // *** 这条不看接没接上。*** 它讲的是这块板子的接法，接上了也还是半双工 ——
  // 而「这个口为什么非要对端」正是接上之后最容易忘的那件事。要不要现在去接
  // 是另一句话，跟在后面，只在真台子上没接的时候说。
  if (p.name === "rs485") {
    let t = "⚠️ **RS485 是半双工的** —— 一根方向脚同时管收和发，板子说话的时候是聋的，"
          + "**听不见自己**。所以这个口不像 RS232 那样能自己绕回来，"
          + "要靠对端把每一行送回来。";
    if (!(state.links || {})[p.name] && state.port !== "sim") {
      t += "**现在还没绑对端** —— 在上面那一行选上适配器再跑。";
    }
    out.push(t);
  }

  // 触点是消耗品，而「持续」会一直吸合释放。这一句只在真要那么跑的时候说。
  if (p.name === "relay" && (runMode[p.name] || "once") === "loop") {
    out.push("⚠️ **继电器不做持续测试**（DECISIONS 46）。触点是消耗品，"
           + "HF41F 额定 3 万次 —— " + relayWearSays()
           + "**通不通「单次」就能证明**，选「单次」跑。");
  }

  return out;
}

// 「按之前先知道」那一块。位置固定，没话说的时候是空的。
function headsSlot(p) {
  const slot = el("div", "headsslot");
  slot.dataset.heads = p.name;
  fillHeads(p, slot);
  return slot;
}

function fillHeads(p, slot) {
  const out = headsUp(p);
  slot.textContent = "";
  slot.hidden = !out.length;
  if (!out.length) { return; }
  const box = el("div", "headsup");
  box.appendChild(el("div", "st", "按之前先知道"));
  for (const t of out) { box.appendChild(richText("div", "v", t)); }
  slot.appendChild(box);
}

// Which plan supplies the limits, shown and switchable.
//
// Switching is a real thing a bench and a line both need - a looser limit set
// exists (station6-poweron-relaxed.json) and somebody has to be able to say
// they used it. What must NOT happen is a limit being edited on screen: that
// leaves no trace, and the production guide bans passing a board by widening a
// limit. Choosing a whole named plan keeps the decision auditable, because the
// name and its limit_version go into every report.
//
// The plan list is fetched once and cached; it only changes when somebody adds
// a file next to the exe.
let critPlans = null;

async function renderCriteria(st) {
  const box = $("#critbox");
  box.hidden = !st.connected;
  if (!st.connected) { return; }

  const sel = $("#critplan");
  if (critPlans === null) {
    critPlans = [];
    try {
      const r = await api("/api/plans");
      critPlans = (r.plans || []).map(p => p.name || p);
    } catch (e) { critPlans = []; }
  }
  const want = st.criteriaPlan || "";
  // Whatever the server says is in use has to be selectable even if the list
  // came back empty, or the box would show something that is not what is
  // judging.
  const names = critPlans.slice();
  if (want && names.indexOf(want) < 0) { names.unshift(want); }

  const same = sel.options.length === names.length &&
               names.every((n, i) => sel.options[i].value === n);
  if (!same) {
    sel.textContent = "";
    for (const n of names) {
      const o = el("option", null, n);
      o.value = n;
      sel.appendChild(o);
    }
  }
  sel.value = want;

  const ver = $("#critver");
  if (st.criteriaProblem) {
    ver.textContent = "读不了：" + st.criteriaProblem;
    ver.style.color = "var(--err)";
  } else {
    ver.textContent = st.criteriaLimits ? "限值 " + st.criteriaLimits : "";
    // A limit set that is not the default is worth noticing, since a board can
    // pass under it and fail under the strict one.
    ver.style.color = /relax|宽/i.test(st.criteriaPlan || "") ? "var(--warn)" : "";
  }
}

$("#critplan").onchange = async () => {
  const j = await api("/api/criteria", {plan: $("#critplan").value});
  if (j.error) { showMessage(j.error, true); return; }
  // Every verdict on screen was produced by the old limits, so they are no
  // longer claims about anything. Cleared rather than left to look current.
  verdicts = {}; judgeWhy = {};
  addLog("panel", "判据换成 " + j.plan + "（限值 " + (j.limitVersion || "?") +
                  "）—— 之前的结论已经清掉，要重新测");
  const st = await api("/api/state");
  applyState(st);
};

function renderPanel() {
  const host = $("#panelbody");
  const msg = host.querySelector(".msg");
  host.textContent = ""; if (msg) host.appendChild(msg);

  if (!state.connected) {
    host.appendChild(el("div","hint","上面选一个串口，点「连接」。板子要用 PORTTOOL_ENABLE=1 编的固件，接线是端子 C05 / C06 / C02，115200。"));
    return;
  }
  // One rule for this column: it always explains whatever the left list has
  // selected. That is why the plan lives on the same left list - a second
  // explaining pane would be a second rule to learn.
  const p = (state.ports||[]).find(x => x.name === selected);
  if (!p) {
    host.appendChild(el("div","hint","左边选一个端口，这里就说明它怎么测。"));
    return;
  }
  ensurePortPlan(p.name);
  applyPlanChannels(p);

  // 这个端口怎么接线，以及它此刻是什么状态。
  //
  // *** 这一块只说接线。*** 「测什么 / 怎么做 / 什么算过」跟着用例走，写在下面
  // 每一段里 —— 一个端口的几个用例前置和判据常常互相矛盾，并成端口级的一段话
  // 就没人知道哪句管哪件事。
  const wiring = PORT_WIRING[p.name];
  const hb = el("div","howto");
  hb.appendChild(el("div","howhd",
    portLabel(p.name) + "\u3000" + portStatus(p).text + "\u3000"));
  for (const [k, v] of [["接线", wiring ||
        "这个端口还没有写接线说明 —— 板子报了它，能跑也能看读数，只是接法要问人。"],
                        ["协议名", p.name]]) {
    const r = el("div","howrow");
    r.appendChild(el("span","k", k));
    r.appendChild(richText("span","v", v));
    hb.appendChild(r);
  }
  host.appendChild(hb);

  // expanded[] still drives the channel checkboxes the cards use, so
  // selecting a port is also what opens it.
  expanded[p.name] = true;
  host.appendChild(portCard(p));


}

/* ===================== 用例式卡片：先在以太网上试，认可了再铺到别的口 =====================
 *
 * 一个端口有几件不同的事要测，就分成几段「用例」。段内顺序是固定的：
 *
 *     测什么 → 怎么做 → 什么算过 → 配置 → 执行按钮 → 结果
 *
 * *** 按钮永远在它自己那段的配置下面。*** 原来的排法是「动作 → 结果 → 设置 →
 * 设置 → 动作 → 结果 → 动作」，同一张卡上「该点的」和「要填的」交替出现三轮，
 * 五个按钮散在四个地方、四种长相。用户 2026-09-14 看着那张卡说的原话是
 * 「我都不知道哪些是该点的，哪些是参数设置」。
 *
 * *** 一段一个执行按钮。*** 一段里有辅助性的按钮（以太网的 ping）就放进配置区，
 * 它不出结论，只是帮人分辨故障在哪一层。
 */
function caseBlock(o) {
  const box = el("div", "case");
  const hd = el("div", "casehd");
  hd.appendChild(el("span", "no", o.no));
  hd.appendChild(el("span", "nm", o.title));
  if (o.tag) { hd.appendChild(el("span", "casetag", o.tag)); }
  box.appendChild(hd);

  for (const [k, v] of [["测什么", o.what], ["怎么做", o.how], ["什么算过", o.pass]]) {
    if (!v) continue;
    const r = el("div", "caserow");
    r.appendChild(el("span", "k", k));
    r.appendChild(richText("span", "v", v));
    box.appendChild(r);
  }

  if (o.config && o.config.length) {
    const cfg = el("div", "casecfg");
    cfg.appendChild(el("div", "st", "配置"));
    for (const n of o.config) { if (n) cfg.appendChild(n); }
    box.appendChild(cfg);
  }

  const act = el("div", "caseact");
  for (const n of o.actions || []) { if (n) act.appendChild(n); }
  box.appendChild(act);

  const res = el("div", "caseres");
  res.appendChild(el("span", "st", "结果"));
  res.appendChild(o.result || el("span", "sub", "—— 还没跑"));
  box.appendChild(res);
  return box;
}

/* 一个标量参数的输入框，带板子报的取值范围。 */
function scalarParam(p, name, build) {
  const lb = el("label", null, paramCN(name) + " ");
  lb.title = "协议里的名字：" + name;
  lb.dataset.param = name;
  const inp = el("input");
  inp.value = paramDefault(p, name);
  if (/^\d+$/.test(inp.value)) { inp.type = "number"; applyLimit(p, name, inp); }
  inp.oninput = () => { setEdited(p, name, inp.value); build(); };
  inp.onchange = inp.oninput;
  lb.appendChild(inp);
  return lb;
}

/* 枚举参数做成一行一个的单选，每项后面写它是干什么的。 */
function enumParam(p, name, build) {
  const lim = (p.limits || {})[name] || {};
  const box = el("div", "chvals");
  box.dataset.param = name;
  const st = el("div", "st", paramCN(name));
  st.title = "协议里的名字：" + name;
  box.appendChild(st);
  const pick = el("div", "enumpick");
  const cur = paramDefault(p, name);
  for (const o of (lim.enum || [])) {
    const lb = el("label");
    const r = el("input"); r.type = "radio"; r.name = p.name + "-" + name;
    r.value = o; r.checked = (o === cur); r.title = name + "=" + o;
    r.onchange = () => { setEdited(p, name, o); build(); };
    lb.appendChild(r);
    lb.appendChild(el("b", null, valueCN(o)));
    const why = valueHelp(p.name, o);
    if (why) { lb.appendChild(el("span", "sub", "—— " + why)); }
    pick.appendChild(lb);
  }
  box.appendChild(pick);
  return box;
}

/* ===================== 用例式卡片 =====================
 *
 * 一个端口有几件不同的事要测，就分成几段「用例」。段内顺序是固定的：
 *
 *     测什么 → 怎么做 → 什么算过 → 配置 → 执行按钮 → 结果
 *
 * *** 按钮永远在它自己那段的配置下面。*** 原来的排法是「动作 → 结果 → 设置 →
 * 设置 → 动作 → 结果 → 动作」，同一张卡上「该点的」和「要填的」交替出现三轮，
 * 五个按钮散在四个地方、四种长相。用户 2026-09-14 看着那张卡说的原话是
 * 「我都不知道哪些是该点的，哪些是参数设置」。
 *
 * *** 一段一个执行按钮。*** 一段里有辅助性的按钮（以太网的 ping、把八路设成
 * 同一个值）就放进配置区，它们不出结论。
 *
 * *** 「开始」和「单独跑」的区别这样消掉。*** 原来一个口有一个「开始」（跑这个
 * 口的全部）加上每个单项一个「单独跑」，两者跑的东西重叠，谁也说不清区别 ——
 * 用户 2026-09-14 的原话是「开始指的是什么，单独跑指的是什么？」。现在：
 *   · 每个用例自己一个按钮，一次性的写「执行」，会话写「开始」；
 *   · 想一口气跑完，用卡片最下面那一行「依次跑一遍」，而且它写清了跑哪几段。
 * 一个用例的端口根本不出现那一行，也就没有两个按钮可比。
 */

// 这个端口有哪几个用例，按屏幕上出现的顺序：一次性的动作在前，会话在后。
//
// 顺序不是排版偏好 —— 一次性的那些问的是静态的事（芯片在不在、线通不通），
// 会话问的是跑起来之后的事。静态的先答，会话失败时才知道要不要怀疑硬件。
function portCases(p) {
  const out = (p.runs || []).map(t => ({key: t, run: t}));
  if (p.kind === "session") { out.push({key: "session"}); }
  return out;
}

const CASE_NO = ["①","②","③","④","⑤","⑥","⑦","⑧"];

// 这个口要人先插对端适配器、而人还没绑。返回要说的话，没问题就返回空。
//
// 模拟板不算 —— 它按构造就把每个 link 端口的对端都演了，在那上面要求先绑一个
// 真适配器，是要求一件没有意义的事。
function peerMissing(p) {
  const pk = planParams[p.name];
  if (!pk || pk.peer !== "com") { return ""; }
  if (state.port === "sim") { return ""; }
  if ((state.links || {})[p.name]) { return ""; }
  return "「" + portLabel(p.name) + "」还没绑对端串口 —— 在卡片最上面的「对端串口」" +
         "里选上那个适配器、点「绑上」，再回来跑。" +
         "这个端口的回环走被测链路本身，没有对端永远闭合不了。";
}

// 一个端口一张卡。会话口、一次性口、两者都有的口，走的都是这一条路径。
function portCard(p) {
  const c = el("div", "card");
  c.dataset.port = p.name;

  const hd = el("div", "hd");
  hd.appendChild(cardName(p));
  hd.appendChild(el("span", "sub", blkTerm(p)));
  c.appendChild(hd);

  const cases = portCases(p);
  if (cases.length > 1) {
    c.appendChild(el("div", "hint",
      "这个口有 " + cases.length + " 个用例，每个用例自己一个按钮、自己一个结果。" +
      "想一口气跑完用最下面那一行。"));
  }

  // *** 要人插适配器的口，那一行排在所有用例前面。*** 它是开始之前必须先办的
  // 事 —— 没绑对端，这个口跑出来的一定是「丢失一直涨」，而那句话读起来像板子
  // 坏了。用户 2026-09-14：「如有需要绑定端口的都放在最前面」。
  //
  // *** 判断依据是方案里写的 peer，不是 loop=link。*** 按 loop=link 挂，CAN 和
  // KNX 也会挂上一个串口对端选择框 —— 那两个口的回路是板子自己在选定模式下
  // 闭合的（extloop / loopback），总线上根本接不了一个「把每行原样送回来」的
  // 串口适配器。挂在那儿的结果是让人去办一件办不成的事，还附一句「没有对端永
  // 远闭合不了」，而那句话在那两个口上是错的。
  const peerKind = (planParams[p.name] || {}).peer || "";
  if (peerKind === "com") { c.appendChild(linkRow(p, "com")); }

  let build = null;
  cases.forEach((cs, i) => {
    const no = cases.length > 1 ? (CASE_NO[i] || String(i + 1)) : "";
    if (cs.run) {
      c.appendChild(runCase(p, cs.run, no));
    } else {
      const s = sessionCase(p, no);
      build = s.build;
      c.appendChild(s.node);
    }
  });

  if (cases.length > 1) { c.appendChild(allCasesRow(p, cases, build)); }

  return c;
}

// 一次性动作的那一段。
function runCase(p, t, no) {
  const tx = caseTextFor(p, t);

  const cfg = [];
  // pt.run 的参数可以改，因为判据是按参数挑的（judge.go 的 criteriaFor）。
  // 同一个目标在方案里可以有好几步：sd.integrity 跑 1 轮和跑 64 轮是两
  // 组不同的判据，填哪个就按哪组判。填一个方案里没有的值，就只给读数。
  //
  // 没有参数的用例不画配置区 —— 一个只写着「没有要设的参数」的灰框占的
  // 地方和真有参数时一样大。
  const args = Object.assign({}, planRunArgs[t] || {}, runEdited[t] || {});
  const named = Object.entries(args);
  if (named.length) {
    const row = el("div", "row");
    for (const [k, v] of named) {
      const lb = el("label", null, paramCN(k) + " ");
      lb.title = "协议里的名字：" + k;
      lb.dataset.param = k;
      const inp = el("input");
      inp.dataset.run = t;
      inp.value = v;
      if (/^\d+$/.test(String(v))) { inp.type = "number"; inp.min = 0; }
      inp.oninput = () => {
        runEdited[t] = runEdited[t] || {};
        runEdited[t][k] = inp.value;
      };
      lb.appendChild(inp);
      row.appendChild(lb);
    }
    cfg.push(row);
    cfg.push(richText("div", "sub",
      "默认是方案给的那组。**改了也有结论** —— 方案里有对应这组参数的判据就按它判，"
    + "没有就只给读数。"));
  }

  const b = el("button", "primary", "执行");
  b.dataset.run = t;
  b.title = "协议里的名字：pt.run " + t;
  b.onclick = () => runOne(p, t);

  const note = caseNote[p.name + "|" + t];
  const res = el("span", "tgtres" + (note && note.indexOf("❌") >= 0 ? " bad" : ""),
                 note || "还没跑");
  res.dataset.case = t;

  return caseBlock({
    no: no, title: tx.title, tag: tx.tag,
    what: tx.what, how: tx.how, pass: tx.pass,
    config: cfg, actions: [b], result: res,
  });
}

// 通道复选。和左边树里那组共用同一份 picked 状态 —— 两处显示的永远是同一件事。
//
// *** 也放在卡上，是因为只放在树里等于没放：每路的值就在这张卡上，勾哪几路却
// *** 要跑到另一个面板去，中间还隔着「哪个数字对应哪个端子」这一层。
function channelPicker(p) {
  const pick = el("div", "chvals");
  pick.appendChild(el("div", "st", "测哪几路 —— 不勾的路这次不动"));
  const pg = el("div", "chgrid");
  for (let i = 1; i <= p.channels; i++) {
    const lb = el("label");
    const cb = el("input"); cb.type = "checkbox"; cb.checked = chanSet(p).has(i);
    cb.onchange = () => {
      cb.checked ? chanSet(p).add(i) : chanSet(p).delete(i);
      renderTree(); renderPanel();
    };
    lb.appendChild(cb);
    const t = el("span", "t");
    t.appendChild(el("b", null, displayName(p, i)));
    lb.appendChild(t);
    pg.appendChild(lb);
  }
  pick.appendChild(pg);
  const all = el("button", null, "全选 / 全不选");
  all.onclick = () => {
    const set = chanSet(p);
    if (set.size === p.channels) { set.clear(); }
    else { for (let i = 1; i <= p.channels; i++) set.add(i); }
    renderTree(); renderPanel();
  };
  pick.appendChild(all);
  return pick;
}

// 会话的那一段：配置是通道和参数，动作是「单次 / 持续 + 开始」，结果是读数。
// 返回 build，好让卡片最下面那一行「依次跑一遍」发同一条命令。
function sessionCase(p, no) {
  const cfg = [], res = el("div");
  const inputs = {};       // 参数 -> 一个控件（八路共用）
  const perCh = {};        // 参数 -> { 通道: 控件 }
  const fr = reads[p.name];

  // ------------------------------------------------------------ 配置
  cfg.push(headsSlot(p));
  if (p.channels > 1) { cfg.push(channelPicker(p)); }

  const row = el("div", "row");
  for (const name of p.params || []) {
    if (name === "ch") continue;                 // 通道由上面那组复选管
    const cur = paramDefault(p, name);

    // 板子按通道报的参数，就一路一个框。哪些参数是这样不写死在这里 —— 是什么
    // 形状回来的就按什么形状画，固件加一个新的，这里不用改。
    if ((p.perChannel || {})[name]) {
      const box = el("div", "chvals");
      box.dataset.param = name;
      // 参数名后面跟上板子自己报的取值范围。范围出自 limits= 行，不是写死的。
      const spec = ((p.limits || {})[name] || {}).spec;
      const st = el("div", "st",
        paramCN(name) + " —— 每路一个" + (spec ? "（" + spec + "）" : ""));
      st.title = "协议里的名字：" + name;
      const ph = paramHelp(p.name, name);
      if (ph) { st.appendChild(el("span", "sub", "　" + ph)); }
      box.appendChild(st);
      const grid = el("div", "chgrid");
      perCh[name] = {};
      const want = planPerCh(p, name);
      for (const i of [...chanSet(p)].sort((a, b) => a - b)) {
        const lb = el("label");
        const t = el("span", "t");
        t.appendChild(el("b", null, displayName(p, i)));
        lb.appendChild(t);
        const inp = el("input"); inp.type = "number"; inp.min = 0;
        inp.dataset.ch = i;
        inp.value = editedCh(p, name, i) ?? want[i] ?? p.perChannel[name][i] ?? 0;
        applyLimit(p, name, inp);
        inp.oninput = () => {
          setEditedCh(p, name, i, inp.value);
          refreshStartRow(p, build);
        };
        perCh[name][i] = inp;
        lb.appendChild(inp);
        grid.appendChild(lb);
      }
      box.appendChild(grid);
      const same = el("button", null, "全都设成第一路的值");
      same.onclick = () => {
        const first = Object.values(perCh[name])[0];
        for (const [ch, inp] of Object.entries(perCh[name])) {
          inp.value = first.value;
          setEditedCh(p, name, Number(ch), first.value);
        }
        renderPanel();
      };
      box.appendChild(same);
      cfg.push(box);
      continue;
    }

    const lim = (p.limits || {})[name] || {};

    // 有名字的枚举做成一行一个的单选，每项后面直接写它是干什么的。
    //
    // *** 下拉框只给名字，用途就只能挤到别处再讲一遍 —— 而「别处再讲一遍」正是
    // *** 这张卡最早的毛病。
    //
    // *** 分界是「值有没有名字」，不是「有几个」。*** 按个数分的结果是反的：CAN
    // 的波特率四个纯数字排成了四个单选（125000 要解释什么呢），而模式五个值各有
    // 各的用途，偏偏因为多了一个被挤进下拉框。纯数字的列表照旧用下拉。
    if (lim.enum && lim.enum.length && lim.enum.length <= 6 &&
        lim.enum.some(v => !/^[0-9]+$/.test(v))) {
      const box = enumParam(p, name, () => refreshStartRow(p, build));
      cfg.push(box);
      const pickbox = box.querySelector(".enumpick");
      // build() 只读 .value，给它一个照实回答的对象就够了。
      inputs[name] = {get value() {
        const on = pickbox.querySelector("input:checked");
        return on ? on.value : "";
      }};
      continue;
    }

    const lb = el("label", null, paramCN(name) + " ");
    lb.title = "协议里的名字：" + name;
    lb.dataset.param = name;
    let inp;
    // 板子把某个参数报成一组取值，它就变成下拉 —— 任何参数，不只是「模式」。
    // 哪些是不写死在这里：固件加一个新的枚举参数，这一页不用改，而板子会拒绝
    // 的值这里根本敲不进去。选项印中文，value 还是板子认的原值。
    if (lim.enum && lim.enum.length) {
      inp = el("select");
      for (const o of lim.enum) {
        const op = el("option", null, valueCN(o)); op.value = o; op.title = o;
        if (o === cur) op.selected = true;
        inp.appendChild(op);
      }
    } else if (name === "mode") {
      // 留给不报 limits 的老固件：modesFor 里是按端口写死的那份退路。
      inp = el("select");
      for (const o of modesFor(p)) {
        const op = el("option", null, valueCN(o)); op.value = o; op.title = o;
        if (o === cur) op.selected = true;
        inp.appendChild(op);
      }
    } else {
      inp = el("input"); inp.value = cur;
      if (/^\d+$/.test(cur)) { inp.type = "number"; applyLimit(p, name, inp); }
    }
    inp.oninput = () => { setEdited(p, name, inp.value); refreshStartRow(p, build); };
    inp.onchange = inp.oninput;
    lb.appendChild(inp); inputs[name] = inp; row.appendChild(lb);
  }
  if (p.channels > 1) {
    row.appendChild(el("span", "hint", "这次要动：" + chanNames(p, chList(p))));
  }
  if (row.childNodes.length) { cfg.push(row); }

  // 面板自己能接上的对端排在这一段的配置里，不在卡片最上面 —— 卡片最上面那个
  // 位置是留给「你必须先动手」的事的，而这两个都不用人动手：
  //   以太网 —— 地址是板子在帧里报的；
  //   USB   —— 板子那个 CDC 口有唯一的 VID:PID。
  // 两个还都有先有鸡还是先有蛋的问题：板子要会话起来才拿 IP、才枚举 CDC，所以
  // 「开始之前先选」根本做不到。
  if (p.name === "aout") { cfg.push(aocalConfig(p)); }
  if (p.name === "eth") { cfg.push(ethPeerRow(p)); }
  else if ((planParams[p.name] || {}).peer === "usb") { cfg.push(linkRow(p, "usb")); }

  // ------------------------------------------------------------ 结果
  if (fr) {
    if (p.channels > 1 || p.name === "ain" || p.name === "aout" || p.name === "temp") {
      const rr = el("div", "reads");
      let anyFloating = false;
      for (let i = 1; i <= p.channels; i++) {
        const v = fr.fields["ch" + i];
        const eng = formatReading(p.name, i, v);
        const shown = eng ? eng.text : v;
        const b = el("div", "bit " + readingClass(v) + (eng && eng.warn ? " warn" : ""),
                     displayName(p, i) + (shown === undefined ? "" : " " + shown));
        if (eng) { b.title = eng.hint; anyFloating = anyFloating || !!eng.warn; }
        rr.appendChild(b);
      }
      res.appendChild(rr);
      // 换算前提要写在看得见的地方：档位是焊出来的，固件读不回来，所以这行
      // 数字只在板子确实按这个档位焊了的时候才成立。
      if (p.name === "ain") {
        res.appendChild(el("div", "sub",
          "按已定档位换算：AIN1 电压（0–10 V）、AIN2 电流（0–20 mA）。跳线焊成别的样子，这两个数就是错的"));
      }
      if (p.name === "aout") {
        res.appendChild(richText("div", "sub",
          "毫安是按 Iout = Vin × 10 / 1024 算的，**不是实测** —— 板上没有回读通道，万用表才是判据"));
      }
      if (p.name === "dout" && fr.fields.tick !== undefined) {
        res.appendChild(el("div", "sub",
          "中断率 " + fr.fields.tick + " Hz 是八路共用的，由最快的那一路定 —— " +
          "慢的那几路因此分辨得更细，不会更粗。每一路的占空比和频率互不影响"));
      }
      if (anyFloating) {
        res.appendChild(el("div", "sub warn",
          "⚠ 有通道落在悬空带（引脚 300–450 mV）。出厂九个跳线全开路，此时 MCU 引脚彻底悬空 —— 先确认 JP5/JP6/JP8/JP9 焊了没有"));
      }
    }
    // 帧里除通道读数以外的那些数，印中文名。原文在悬停里 —— 对着日志查还要它。
    const extra = Object.entries(fr.fields)
      .filter(([k]) => !/^ch\d+$/.test(k) && !["seq", "rx", "miss"].includes(k))
      .map(([k, v]) => fieldCN(k) + " " + valueCN(v));
    if (extra.length) {
      const line = el("div", "sub", extra.join("　"));
      line.title = Object.entries(fr.fields)
        .filter(([k]) => !/^ch\d+$/.test(k) && !["seq", "rx", "miss"].includes(k))
        .map(([k, v]) => k + "=" + v).join(" ");
      res.appendChild(line);
    }
  } else if (p.running) {
    res.appendChild(el("div", "sub", "起来了，等第一帧…"));
  }
  // 没起来就什么都不加 —— 下面那个结论span已经写着「还没跑」，再说一遍只会让
  // 人以为那是两件事。

  // 报文事件。字段是板子写什么就是什么，固件开始报事件这里不用改。
  const ev = events[p.name];
  if (ev && ev.length) {
    const box = el("div", "chvals");
    box.appendChild(el("div", "st", "报文事件 —— 最近 " + ev.length + " 条，新的在上"));
    for (let i = ev.length - 1; i >= 0; i--) {
      const e = ev[i];
      const bad = e.fields.crc === "bad";
      const line = el("div", "sub" + (bad ? " warn" : ""));
      const parts = [valueCN(e.sub)];
      const raw = [e.sub];
      for (const [k, v] of Object.entries(e.fields)) {
        if (k === "t") continue;
        parts.push(fieldCN(k) + " " + valueCN(v));
        raw.push(k + "=" + v);
      }
      line.textContent = parts.join("　");
      line.title = raw.join(" ");
