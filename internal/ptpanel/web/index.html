// 本机网卡查一次就存着，按板子的 IP 存。
//
// *** 不能每次重画都去查。*** 会话跑着的时候这张卡每 500 ms 重画一次，而异步
// 请求回来之前那次重画已经把结果扔了 —— 现象是「查着…」永远停在那儿，偏偏就是
// 会话在跑、最需要看这一行的时候。同一个坑页面里已经有先例（方案参数就是这么
// 存的）。
let netCache = {};
let netPending = {};

function netFor(ip) {
  if (netCache[ip] !== undefined) { return netCache[ip]; }
  if (!netPending[ip]) {
    netPending[ip] = true;
    api("/api/net?board=" + encodeURIComponent(ip))
      .then(n => { netCache[ip] = n || {error: true}; })
      .catch(() => { netCache[ip] = {error: true}; })
      .finally(() => { netPending[ip] = false; renderPanel(); });
  }
  return null;
}

// 板子的 IP、本机能不能够得着、ping、TCP 对端。
//
// *** 「本机 IP」不是一个数。*** 这台机器有五个地址（无线、虚拟网卡、代理…），
// 挑一个显示多半挑错。有用的是「哪一个和板子同网段」，而**一个都没有**才是最该
// 说出来的那句 —— 2026-09-10 就栽在这里：代理网卡占着默认路由，有线网口是断的，
// PC 根本不在板子那个网段上，而屏幕上什么都没说。
// 以太网那一段的「对端」配置块。ping 就在这里 —— 它不出结论，是用来分辨
// 「网段不对」还是「应用层没起来」的辅助（用户 2026-09-14 定）。
function ethPeerRow(p) {
  const box = el("div","linkbox");
  box.appendChild(el("div","st",T("ui.ethPeerRow.1")));

  const fr = reads[p.name];
  const ip = fr && fr.fields ? fr.fields.ip : null;
  const port = (fr && fr.fields && fr.fields.port) || "5000";

  if (!ip || ip === "dhcp" || ip === "0.0.0.0") {
    box.appendChild(el("div","hint",
      T("ui.ethPeerRow.2")));
    return box;
  }

  const info = el("div","row");
  info.appendChild(el("span","sub",T("ui.ethPeerRow.3")));
  info.appendChild(el("b",null, ip));
  box.appendChild(info);

  const mine = el("div","hint");
  box.appendChild(mine);
  const n = netFor(ip);
  if (!n) {
    mine.textContent = T("ui.ethPeerRow.4");
  } else if (n.error) {
    mine.textContent = T("ui.ethPeerRow.5");
  } else {
    if (n.match) {
      mine.appendChild(el("div",null,T("ui.ethPeerRow.6", {match: n.match})));
    } else {
      const bad = el("div",null,
        T("ui.ethPeerRow.7"));
      bad.style.color = "var(--warn)";
      mine.appendChild(bad);
    }
    mine.appendChild(el("div","sub", (n.nics || []).map(x =>
      x.name + " " + x.ip + (x.same ? T("ui.ethPeerRow.8") : "")).join(" · ")));
  }

  const acts = el("div","row");
  const pingBtn = el("button",null,T("ui.ethPeerRow.9"));
  const said = el("span","sub","");
  pingBtn.onclick = async () => {
    pingBtn.disabled = true; said.textContent = T("ui.ethPeerRow.10");
    try {
      const r = await api("/api/ping?ip=" + encodeURIComponent(ip));
      said.textContent = T("ui.ethPeerRow.pings", {got: r.received, sent: r.sent}) +
        (r.received ? T("ui.ethPeerRow.12", {r: r.avg_ms.toFixed(1)}) : "");
      said.style.color = r.received ? "var(--ok)" : "var(--err)";
    } catch (e) { said.textContent = String(e); }
    pingBtn.disabled = false;
  };
  acts.appendChild(pingBtn);

  const bound = (state.links || {})[p.name];
  if (bound) {
    const off = el("button",null,T("ui.ethPeerRow.13"));
    off.onclick = () => api("/api/unlink", {port: p.name}).then(applyState);
    acts.appendChild(off);
    acts.appendChild(el("span","sub",
      T("ui.ethPeerRow.14", {com: bound.com, rx_lines: bound.rxLines, echoed: bound.echoed})));
  } else {
    const on = el("button","primary",T("ui.ethPeerRow.15"));
    on.onclick = async () => {
      on.disabled = true;
      const r = await api("/api/link", {port: p.name, tcp: ip + ":" + port});
      if (r && r.error) { showMessage(r.error, true); } else { applyState(r); }
      on.disabled = false;
    };
    acts.appendChild(on);
  }
  acts.appendChild(said);
  box.appendChild(acts);

  box.appendChild(el("div","hint",
    T("ui.ethPeerRow.16")));
  return box;
}

// kind 决定这一行说什么话：
//   com —— 人插的适配器，面板分不出哪个插在哪个端子上，只能他来选
//   usb —— 板子自己那个 CDC 口，面板点了开始之后自己接；这里是接不上时的退路
function linkRow(p, kind) {
  const bound = (state.links || {})[p.name];
  const usb = kind === "usb";
  // peerbox：机器按这个找，不按里面的字找。
  const box = el("div","chvals peerbox");
  box.dataset.peer = kind || "com";
  box.appendChild(el("div","st", usb
    ? T("ui.linkRow.1")
    : T("ui.linkRow.2")));

  if (bound) {
    const r = el("div","row");
    r.appendChild(el("span","sub", T("ui.linkRow.3", {com: bound.com, baud: bound.baud, rx_lines: bound.rxLines, echoed: bound.echoed})));
    const off = el("button",null,T("ui.linkRow.4"));
    off.onclick = async () => { applyState(await api("/api/unlink", {port:p.name})); };
    r.appendChild(off);
    box.appendChild(r);
    if (bound.error) {
      const e = el("div","hint", T("ui.linkRow.5", {error: bound.error}));
      e.style.color = "var(--err)";
      box.appendChild(e);
    }
    box.appendChild(el("div","hint",
      T("ui.linkRow.6")));
  } else {
    const r = el("div","row");
    const sel = el("select");
    // Which adapter was on this terminal last time. The panel has been saving
    // this since it was first bound and was not reading it back, so somebody
    // picked the same COM out of a list of five on every connect.
    const was = ((state.saved || {}).peers || {})[p.name];
    for (const o of linkChoices()) {
      const op = el("option",null,o.label + (was && was.com === o.name ? T("ui.linkRow.7") : ""));
      op.value = o.name;
      if (was && was.com === o.name) { op.selected = true; }
      sel.appendChild(op);
    }
    r.appendChild(sel);
    const on = el("button","primary",T("ui.linkRow.8"));
    on.onclick = async () => {
      const j = await api("/api/link", {port:p.name, com:sel.value});
      if (j.error) showMessage(j.error, true); else applyState(j);
    };
    r.appendChild(on);
    box.appendChild(r);
    box.appendChild(richText("div","hint", usb
      ? T("ui.linkRow.9")
      : T("ui.linkRow.unbound") +
        (was ? T("ui.linkRow.12", {com: was.com}) : "")));
  }
  return box;
}

// Everything except the control port. The panel cannot tell which adapter is
// wired to which terminal - only the person at the bench can - so it lists
// them all with their descriptions and lets them choose.
function linkChoices() {
  return (allPorts || []).filter(p => p.name !== state.port);
}


// The one button the whole page is organised around: press it, wait, read the
// verdict. Asked for on 2026-09-08 - "选了端口，看一下做什么测试，然后开始，
// 就等着测试结果了".
// Whether a port's one-button test is in flight, and how far it has got.
//
// Page state, NOT a DOM node: judging a reading re-renders this card, so a
// button or a label the click handler was holding on to would be replaced
// mid-test and the progress and verdict would vanish. Found on 2026-09-08 by
// the browser test - the run really happened and the card had nothing to show
// for it.
let testing = {};
let cancelled = {};

// 打字的时候只重画「开始测试」那一行。
//
// *** 不能调 renderPanel()：它把 #panelbody 整个重建，人正打着字焦点就没了，
// *** 八路占空比一个一个 Tab 过去会变成酷刑。可是那一行必须当场跟上 —— 判据
// *** 适不适用取决于刚敲进去的这个数，晚一步说，说的就是上一个数的事。
// *** 第三个参数不能丢。*** 它只被会话那一段的参数框调，而重画出来的那一行
// 要和原来那一行按同一个东西跑 —— 少传一个 "session"，打一个字之后「开始」就
// 从「只跑会话」变成「把这个口的一次性动作也跑一遍」。
function refreshStartRow(p, cmdFor) {
  const old = $("#panelbody").querySelector(".startrow");
  if (old) { old.replaceWith(startRow(p, cmdFor, "session")); }
  // 「按之前先知道」里有一条看的是单次还是持续（继电器的触点寿命），而那两个
  // 单选就在这一行里 —— 只重画这一行，那句话会停在上一个选择上。
  const slot = $("#panelbody").querySelector(".headsslot");
  if (slot) { fillHeads(p, slot); }
}

// 跑一轮还是一直跑。存页面状态，理由和 edited 一样：每来一帧这一行都会重建。
//
// *** 这是上位机自己的事，不是发给板子的参数 —— 所以它不能塞进「模式」那一组
// *** 单选里。板子只认 hold / blink 那种模式，多一个它不认识的值就是一条发不
// *** 出去的命令。
let runMode = {};

// 「持续」跑多久，小时。0 = 一直。
//
// *** 计时在上位机，不在板子上。板子那边只有一个看门狗：上位机每 2 秒续一次期，
// *** 6 秒没续上它就自己把输出放了。所以这个数字只决定上位机什么时候发停止，
// *** 而「上位机死了怎么办」由看门狗回答，不由这个数字回答。
let runHours = 1;

const HOUR_CHOICES = [
  [1, T("ui.top.8")], [2, T("ui.top.9")], [3, T("ui.top.10")], [4, T("ui.top.11")],
  [0, T("ui.top.12")],
];

// 一个会话端口每帧要占多少字节。板子推一帧、上位机回一条 pt.echo、板子再回一个
// OK —— 三趟都走同一条 115200 的线。
//
// *** 这不是估着玩的：线一堵，printf 是阻塞的，超循环就慢下来，于是所有端口的
// *** 采样周期一起失准，而且没有任何东西会报错。人只会看到数据变怪。
const LINE_BYTES_PER_SEC = 11520;   // 115200 8N1
const FRAME_BYTES = 90, ECHO_BYTES = 16, OK_BYTES = 20;

function portPeriodMs(p) {
  const v = (edited[p.name] && edited[p.name].period) ||
            (p.values && p.values.period);
  const n = Number(v);
  return (n >= 50) ? n : 200;
}

// 勾中的这些端口一起跑，会占这条线多少。
function bandwidthOf(names) {
  let bytes = 0;
  for (const name of names) {
    const p = (state.ports || []).find(x => x.name === name);
    if (!p || p.kind !== "session") { continue; }
    const per = (p.loop === "ctrl" || p.loop === "self")
      ? FRAME_BYTES + ECHO_BYTES + OK_BYTES
      : FRAME_BYTES;
    bytes += per * 1000 / portPeriodMs(p);
  }
  return bytes;
}

// 时长一组单选。卡片上和左边的批量启动共用同一个 runHours，所以两处永远一致 ——
// 两个地方各记一份，人换了一边另一边不动，那是个必然会咬人的坑。
function hoursPicker(onChange, disabled) {
  const box = el("div","runhow hours");
  box.appendChild(el("span","sub",T("ui.hoursPicker.1")));
  for (const [h, nm] of HOUR_CHOICES) {
    const lb = el("label");
    const r = el("input"); r.type = "radio"; r.name = "runhours";
    r.value = String(h); r.checked = (runHours === h); r.disabled = !!disabled;
    r.dataset.hours = String(h);
    r.onchange = () => { runHours = h; onChange(); };
    lb.appendChild(r);
    lb.appendChild(el("b", null, nm));
    box.appendChild(lb);
  }
  return box;
}

// 从左边批量启动时，这个端口该发哪条命令。
//
// *** 不能用卡片上那个 build()：它读的是屏幕上的输入框，而中间那一列一次只画
// *** 一个端口的卡。批量启动要发的端口，多数一个输入框都不在文档里。所以这里
// *** 读的是同一组页面状态（方案参数 + 改过的值 + 勾中的通道），和 offPlan()
// *** 判「改没改」读的是同一处 —— 两处读不同的地方，迟早会一个说改了一个说没改。
function startCommandFor(p) {
  let cmd = "pt.start " + p.name;
  if (p.channels > 1) { cmd += " ch=" + chList(p); }

  const planned = (planParams[p.name] || {}).params || {};
  const keys = (p.params || []).filter(k => k !== "ch");

  for (const k of keys) {
    if ((p.perChannel || {})[k]) {
      const was = planPerCh(p, k);
      const parts = [];
      for (const i of [...chanSet(p)].sort((a,b) => a-b)) {
        parts.push(i + ":" + String(editedCh(p, k, i) ?? was[i] ??
                                    (p.perChannel[k] || {})[i] ?? 0));
      }
      if (parts.length) { cmd += " " + k + "=" + parts.join(","); }
      continue;
    }
    const v = editedVal(p, k) ?? planned[k] ?? (p.values || {})[k];
    if (v !== undefined && v !== "") { cmd += " " + k + "=" + v; }
  }
  return cmd;
}

// 一条线的余量够不够。够就回空串，不够就回一句能照着改的话。
function bandwidthWarning(names) {
  const used = bandwidthOf(names);
  if (used <= LINE_BYTES_PER_SEC * 0.8) { return ""; }
  const pct = Math.round(used * 100 / LINE_BYTES_PER_SEC);
  return T("ui.bandwidthWarning.1", {pct, used: Math.round(used), line_bytes_per_sec: LINE_BYTES_PER_SEC});
}

// 起一轮持续测试：先把每个端口发起来，再交给服务端计时和续期。
//
// *** 续期由服务端做，不由这个页面做 —— 页面关了、笔记本睡了，24 V 不能还开着。
// *** 服务端的进程在，续期才在；进程没了，板子 6 秒内自己关。
async function startContinuous(names, cmds) {
  const warn = bandwidthWarning(names);
  if (warn) { showMessage(warn.replace(/\n/g, " "), true); return false; }

  for (const cmd of cmds) { await run(cmd); }
  const j = await api("/api/hold", {ports: names, hours: runHours});
  if (j.error) { showMessage(j.error, true); return false; }
  applyState(j);
  renderTree(); renderPanel();
  return true;
}

async function stopContinuous() {
  const j = await api("/api/hold", {stop: true});
  if (j.error) { showMessage(j.error, true); return; }
  applyState(j);
  renderTree(); renderPanel();
}

// only="session" 时这一行只跑会话那一半，不连带跑这个端口的一次性动作。
//
// *** 用例式卡片要的就是这个。*** 一段一个按钮，按钮只该做那一段说的事 ——
// 原来「开始」是整个端口的总开关（跑完全部 pt.run 再跑会话，合成一个结论），
// 放进②那一段就成了「点②连①也跑了」，而且两半的判据被合并成一句话。用户
// 2026-09-14 点了一下②就看到整个端口判失败，说的是「我只点了一处」。
function startRow(p, cmdFor, only) {
  const row = el("div","startrow");
  const busy = testing[p.name];
  // 参数一改，方案的判据就不成立了 —— 那时「单发」也只给读数，说明写在下面。
  const off = offPlan(p);
  // 读表那一档自己就是一轮多点走查，没有「持续」这回事（DECISIONS 47）。
  const aoWalk = (p.name === "aout" && aocal.meter === "manual");
  const aiWalk = (p.name === "ain" && aical.meter === "manual");
  const session = p.kind === "session" && !!cmdFor && !aoWalk && !aiWalk;
  const mode = runMode[p.name] || "once";

  if (session) {
    const box = el("div","runhow");
    for (const [v, nm, why] of [
      ["once", T("ui.startRow.1"), T("ui.startRow.2")],
      ["loop", T("ui.startRow.3"), T("ui.startRow.4")],
    ]) {
      const lb = el("label");
      const r = el("input"); r.type = "radio"; r.name = "run-" + p.name;
      r.value = v; r.checked = (mode === v); r.disabled = !!busy;
      r.dataset.mode = v;
      r.onchange = () => { runMode[p.name] = v; refreshStartRow(p, cmdFor); };
      lb.appendChild(r);
      lb.appendChild(el("b", null, nm));
      lb.appendChild(el("span","sub", "—— " + why));
      box.appendChild(lb);
    }
    row.appendChild(box);

    // 时长和「这个口持续起来到底在循环什么」只在选了「持续」之后出现。
    //
    // *** 不常驻，是因为这一段的「测什么」已经说过这个会话在干什么。*** 同一件
    // 事在同一段里写两遍，读的人会以为是两件事。留在这里的是只有选了持续才
    // 成立的那一半：跑久了会怎样，有什么代价。
    if (mode === "loop") {
      const what = SESSION_WHAT[p.name];
      if (what) { row.appendChild(richText("div","sub", what)); }
      row.appendChild(hoursPicker(() => refreshStartRow(p, cmdFor), busy));
    }
  }

  const b = el("button","primary" + (aoWalk ? " aocalgo" : "") + (aiWalk ? " aicalgo" : ""),
                aoWalk ? (aocal.busy ? T("ui.startRow.5") : T("ui.startRow.6"))
                       : aiWalk ? (aical.busy ? T("ui.startRow.7") : T("ui.startRow.8"))
                       : (busy ? T("ui.startRow.9") : T("ui.startRow.10")));
  b.disabled = !!busy || (aoWalk && !!aocal.busy) || (aiWalk && !!aical.busy);
  b.onclick = async () => {
    if (aiWalk) {
      if (aical.busy) { return; }
      aicalRunning = true;
      aical.busy = T("ui.startRow.11");
      aical.rows = []; aical.note = ""; aical.fit = null;
      renderPanel();
      try {
        await aicalRun(p, t => { aical.busy = t; renderPanel(); }, () => renderPanel());
        aical.note = T("ui.startRow.12");
      } catch (e) {
        aical.note = T("ui.startRow.13", {e});
      } finally {
        aical.busy = "";
        meterDone(null);
        setTimeout(() => {
          aicalRunning = false;
          delete verdicts.ain;
          judgeWhy.ain = T("ui.startRow.14");
          renderTree(); renderPanel();
        }, 2500);
        renderPanel();
      }
      return;
    }
    // 多点走查走自己那条路：逐点改输出、每点停下来等人读表。
    if (aoWalk) {
      if (aocal.busy) { return; }
      aocalRunning = true;
      aocal.busy = T("ui.startRow.15");
      aocal.rows = []; aocal.note = ""; aocal.fit = null;
      renderPanel();
      try {
        await aocalRun(p, t => { aocal.busy = t; renderPanel(); }, () => renderPanel());
        aocal.note = T("ui.startRow.16");
      } catch (e) {
        aocal.note = T("ui.startRow.17", {e});
      } finally {
        aocal.busy = "";
        meterDone(null);
        // 收尾那几条命令自己也会来帧，等它们过去再放开判定。
        setTimeout(() => {
          aocalRunning = false;
          delete verdicts.aout;
          judgeWhy.aout = T("ui.startRow.18");
          renderTree(); renderPanel();
        }, 2500);
        renderPanel();
      }
      return;
    }
    if (p.channels > 1 && chanSet(p).size === 0) {
      showMessage(T("ui.startRow.19", {name: portLabel(p.name)}), true);
      return;
    }
    // 对端要人插适配器的端口，没绑就别跑 —— 跑出来的一定是「丢失一直涨」，
    // 而那句话读起来像板子坏了。说清楚要先做什么，比给一个误导的结论好。
    const why = peerMissing(p);
    if (why) { showMessage(why, true); return; }
    // 触点是消耗品，而这个代价不可逆 —— 一句读过就忘的警告挡不住一次误点。
    // 「一轮老化吃掉将近一半寿命」的算法在 DECISIONS 46。
    if (session && (runMode[p.name] || "once") === "loop" && p.name === "relay") {
      showMessage(T("ui.startRow.20", {relay_wear_says: relayWearSays()}), true);
      return;
    }
    // 持续：发起来之后交给服务端计时，到点它发停止。
    if (session && (runMode[p.name] || "once") === "loop") {
      await startContinuous([p.name], [cmdFor()]);
      return;
    }
    testing[p.name] = T("ui.startRow.21");
    delete cancelled[p.name];
    renderPanel();
    try {
      const say = t => { testing[p.name] = t; renderPanel(); };
      if (only === "session") {
        const note = await runSessionTest(p, say, cmdFor);
        // 会话这一段自己的结论，和一次性动作那几段分开记 —— 一个口有五段时，
        // 端口那一个总状态说不出是哪一段的结果。
        caseNote[p.name + "|session"] =
          (verdicts[p.name] === true ? "\u2705 \u8fc7\u3000" :
           verdicts[p.name] === false ? "\u274c \u4e0d\u8fc7\u3000" : "") + (note || "");
      } else {
        await runPortTest(p, say, cmdFor);
      }
    } finally {
      delete testing[p.name];
      renderTree(); renderPanel();
    }
  };
  row.appendChild(b);
  // 一直跑着的会话，停它的按钮就在起它的地方。
  //
  // *** 一轮持续测试跑着的时候，这个按钮停的是整轮 —— 不是只停这一个端口。
  // *** 判出故障要全停（DECISIONS 37 第 5 件），人点停止也一样：留着另外几个
  // *** 端口在跑，而看门狗的续期已经停了，那是最难解释的一种状态。
  if (!busy && p.running) {
    const running = !!(state.run);
    const stop = el("button",null, running ? T("ui.startRow.22") : T("ui.startRow.23"));
    stop.dataset.stop = p.name;
    stop.onclick = async () => {
      if (running) { await stopContinuous(); return; }
      await run("pt.stop " + p.name);
      renderTree(); renderPanel();
    };
    row.appendChild(stop);
  }
  // A burn-in can be told to run for ten hours, so a test in flight has to be
  // stoppable from the same place it was started. Without this the only way
  // out of a long run is the reset key, which also loses every other verdict
  // on the page.
  if (busy) {
    const x = el("button",null,T("ui.startRow.24"));
    x.onclick = () => {
      cancelled[p.name] = true;
      testing[p.name] = T("ui.startRow.25");
      run("pt.stop " + p.name);
      renderPanel();
    };
    row.appendChild(x);
  }
  // 改回方案那组参数，判据就又能用了。一个按钮，不用人记住原来是多少。
  if (off.length && !busy) {
    const back = el("button",null,T("ui.startRow.26"));
    back.onclick = () => {
      delete edited[p.name];
      delete picked[p.name];
      delete chanApplied[p.name];
      delete judgeWhy[p.name];
      delete verdicts[p.name];
      // *** 这一段自己那句结论也要撤掉。*** 它是上一次跑完时抄下来的一句话，
      // 不像 judgeWhy 那样会被下一次判定盖掉 —— 少删这一条，参数恢复以后
      // 「这次只给读数、不给结论」会继续挂在「开始」旁边，而那句话已经不成立了。
      delete caseNote[p.name + "|session"];
      renderTree(); renderPanel();
    };
    row.appendChild(back);
  }
  // note 这个类是给「哪一行是状态」用的：这一行里还有单选自己的说明，也是 .sub。
  //
  // *** 这一行只说这一段自己的事。*** 端口级的 judgeWhy 会被同一个口的任何一个
  // 一次性动作改写 —— 拿它当会话的状态，等于把上一次点「执行」的结果印在
  // 「开始」旁边。
  // 会话那一段的结论摆在它自己的「结果」里，这一行就不再说一遍 —— 留在这里的
  // 只有跑着时的进度，和「参数被改过所以判据不适用」那句话，两样都是按下去
  // 之前就要看见的。
  row.appendChild(richText("span","sub note" + (off.length ? " warn" : ""),
    busy || (off.length ? offPlanWhy(off) : "") ||
    (only === "session" ? "" :
     judgeWhy[p.name] ||
     (verdicts[p.name] === true ? T("ui.startRow.27") :
      verdicts[p.name] === false ? T("ui.startRow.28") : T("ui.startRow.29")))));
  return row;
}

// Runs one pt.run target and judges the reply it comes back with.
// Returns {state, note}: state is true, false, or null for "no criteria".
async function runOne(p, target) {
  const args = Object.assign({}, planRunArgs[target] || {}, runEdited[target] || {});
  let cmd = "pt.run " + target;
  for (const [k, v] of Object.entries(args)) { cmd += " " + k + "=" + v; }
  const j = await run(cmd);
  const lines = (j && j.lines) || [];
  let state;
  if (!lines.length) {
    verdicts[p.name] = false;
    judgeWhy[p.name] = T("ui.runOne.noreply", {target,
      why: j && j.error ? T("ui.runOne.2", {error: j.error}) : T("ui.runOne.3")});
    state = false;
  } else {
    // 跟着参数一起发：同一个目标在方案里可能有两步（轮数不同），
    // 服务端靠这组参数挑出该用哪一组判据。
    state = await judge({port: p.name, target: target, lines: lines, args: args});
  }
  // 按用例记一份。judgeWhy 只按端口存一个槽，而一个端口有好几个用例 —— 共用
  // 一个槽的话，后跑的那个会把先跑的结果抹掉，卡片上就只剩最后一次。
  const note = judgeWhy[p.name] ||
               (state === true ? T("ui.runOne.4") : state === false ? T("ui.runOne.5") : T("ui.runOne.6"));
  caseNote[p.name + "|" + target] = (state === true ? T("ui.runOne.7") :
                                     state === false ? T("ui.runOne.8") : "") + note;
  renderTree(); renderPanel();
  return {state: state, note: note};
}

// 每个用例自己的结果。键是「端口|用例」，会话那一段用端口名本身。
let caseNote = {};

// 人改过的 pt.run 参数，按目标存。和会话那边的 edited 同一个理由：
// 每来一帧面板都重建，值只活在输入框里的话会被抹掉。
let runEdited = {};

// One port, one press.
//
// Runs whichever halves the port has - its one-shot targets, its session, or
// both - and reports a single verdict for the hardware.
async function runPortTest(p, say, cmdFor) {
  // A port can have both: eth's session is the TCP server and eth.link is the
  // PHY probe over MDIO, one RJ45 between them (DECISIONS.md 28). Both have to
  // run - a board whose PHY answers but whose link carries nothing is not a
  // good board, and running only the one-shot would never find that out.
  let pre = null;

  if ((p.runs || []).length) {
    // Every target has to pass, and each is judged by its own step's criteria.
    // Letting the last one's verdict stand was the bug the browser test caught
    // on 2026-09-08 - sdram ran three targets and reported the third's
    // judgement as the chip's.
    //
    // A target with no criteria leaves the port unjudged, not passed: three
    // states in, three states out.
    const notes = [];
    let worst = true;                 // true -> null -> false
    for (const t of p.runs) {
      say(T("ui.runPortTest.1", {t}));
      const r = await runOne(p, t);
      notes.push(T("ui.runPortTest.2", {t, note: r.note}));
      if (r.state === false) { worst = false; break; }
      if (r.state === null && worst === true) { worst = null; }
    }
    pre = {state: worst, note: notes.join(T("ui.runPortTest.3"))};

    // Nothing else to run for a port that is only one-shots.
    if (p.kind !== "session") {
      if (worst === null) { delete verdicts[p.name]; } else { verdicts[p.name] = worst; }
      judgeWhy[p.name] = pre.note;
      return judgeWhy[p.name];
    }
  }

  const note = await runSessionTest(p, say, cmdFor);
  if (pre === null) {
    return note;
  }

  // Merge the two halves. false wins over null wins over true: a port is only
  // good when nothing said otherwise, and a half nobody could judge must not
  // be reported as a pass.
  const after = (p.name in verdicts) ? verdicts[p.name] : null;
  let merged = pre.state;
  if (after === false || merged === false) { merged = false; }
  else if (after === null || merged === null) { merged = null; }
  else { merged = true; }

  if (merged === null) { delete verdicts[p.name]; } else { verdicts[p.name] = merged; }
  judgeWhy[p.name] = T("ui.runPortTest.4", {note: pre.note, note2: note});
  return judgeWhy[p.name];
}

// The session half of one port's test: start it the way the plan says, let it
// produce frames, judge, and stop it again - stopping matters, because a relay
// left closed or an analog output left driving after the answer is in is a
// hazard rather than a result.
// 会话起来之后，能自己接的对端自己接。

//

// *** 分两类，界限是「这件事只有人知道吗」。***

//

//   板子自己就是对端 —— 面板接：以太网的 IP 是板子在帧里报的，USB 的 CDC 口

//   有唯一的 VID:PID。这两件事没有人的知识在里面，让人去选等于让他抄一个

//   屏幕上已经有的值。而且这两个都有先有鸡还是先有蛋的问题：板子要会话起来

//   才拿 IP、才枚举 CDC，所以「开始之前先选」根本做不到。

//

//   人插的适配器 —— 人选：RS485 那种。**面板分不出哪个适配器接在被测端子上**

//   （linkRow 的注释从一开始就是这么写的）。方案里写着 COM16 是上次的事，

//   今天可能插在别的口 —— 照着猜绑上去，报出来的失败会像板子的毛病。

//   用户 2026-09-14：「485 等转接口要先选端口，再开始」。

async function autoPeer(p, say) {

  const pp = planParams[p.name];

  const kind = pp && pp.peer;

  if (!kind || kind === "com") { return; }            // com 由人选，见上

  if ((state.links || {})[p.name]) { return; }        // 人已经自己接了



  let body = null;

  if (kind === "tcp") {

    let ip = null, port = "5000";

    for (let i = 0; i < 40 && !ip; i++) {

      const f = (reads[p.name] || {}).fields || {};

      if (f.port) { port = f.port; }

      if (f.ip && f.ip !== "dhcp" && f.ip !== "0.0.0.0") { ip = f.ip; break; }

      say(T("ui.autoPeer.1"));

      await new Promise(r => setTimeout(r, 250));

    }

    if (!ip) { addLog("panel", () => T("ui.autoPeer.2", {name: p.name})); return; }

    body = {port: p.name, tcp: ip + ":" + port};

  } else {

    // 板子的 CDC。会话起来才枚举，所以要等它出现。

    say(T("ui.autoPeer.3"));

    let com = "";

    for (let i = 0; i < 12 && !com; i++) {

      await loadPorts();

      const hit = (allPorts || []).find(x => /0483:5740/i.test(x.label || ""));

      if (hit) { com = hit.name; break; }

      await new Promise(r => setTimeout(r, 400));

    }

    if (!com) {

      addLog("panel", () => T("ui.autoPeer.4", {name: p.name}));

      return;

    }

    body = {port: p.name, com: com};

  }



  say(T("ui.autoPeer.5"));

  const r = await api("/api/link", body);

  if (r && r.error) { addLog("panel", () => T("ui.autoPeer.6", {name: p.name, error: r.error})); return; }

  addLog("panel", () => T("ui.autoPeer.7", {name: p.name, com: (body.tcp || body.com)}));

  applyState(r);

}



async function runSessionTest(p, say, cmdFor) {
  // Started with exactly what the card shows. The inputs were prefilled from
  // the plan, so by default the session runs the way the criteria were written
  // for - can's are written for mode=extloop, and judging a default
  // mode=normal session by them would fail a healthy board - and an engineer
  // who changes an input can see that is what they did.
  const pp = planParams[p.name];
  const frames = (pp && pp.frames) || 3;
  const cmd = cmdFor ? cmdFor() : ("pt.start " + p.name);

  say(T("ui.runSessionTest.1"));
  const started = await run(cmd);
  if (started && (started.error || started.refused)) {
    verdicts[p.name] = false;
    judgeWhy[p.name] = T("ui.runSessionTest.2", {error: (started.refused || started.error)});
    return judgeWhy[p.name];
  }

  // *** 对端自己接上，不要人先点。*** 板子是 TCP 服务端，判据要求「连接数 1」，
  // 而连接数要变 1 得有客户端连上来 —— 但客户端连不上，除非会话已经在跑
  // （板子是会话起来才开始监听的）。「先连对端再开始」做不到，先有鸡还是先有蛋。
  //
  // 命令行跑方案时本来就是自己接的（方案里 peer: {tcp:"auto"}），面板没做，于是
  // 点一下「开始」必然判失败。用户 2026-09-14 的原话：「我现在测试了 tcp server
  // 就失败了」。
  await autoPeer(p, say);

  // A session carrying minutes= times itself and says so with done=; waiting
  // for a fixed handful of frames would judge it while it was still running,
  // and done=0 would fail a burn-in that was going perfectly well.
  const mins = Number((cmd.match(/\bminutes=(\d+)/) || [])[1] || 0);
  let seen;
  if (mins > 0) {
    seen = await waitForDone(p.name, mins * 60000 + 60000, say);
  } else {
    seen = await waitForFrames(p.name, frames, 30000);
  }
  await run("pt.stop " + p.name);

  if (cancelled[p.name]) {
    delete verdicts[p.name];
    judgeWhy[p.name] = T("ui.runSessionTest.3");
    return judgeWhy[p.name];
  }
  if (!seen) {
    verdicts[p.name] = false;
    judgeWhy[p.name] = T("ui.runSessionTest.4");
    return judgeWhy[p.name];
  }
  return judgeWhy[p.name] ||
         (verdicts[p.name] === true ? T("ui.runSessionTest.5") :
          verdicts[p.name] === false ? T("ui.runSessionTest.6") : T("ui.runSessionTest.7"));
}

// Resolves once the port has pushed n frames, or on timeout. Counts distinct
// ticks rather than events, so one frame arriving twice is not two frames.
function waitForFrames(port, n, ms) {
  return new Promise(resolve => {
    const ticks = new Set();
    const start = Date.now();
    const iv = setInterval(() => {
      if (cancelled[port]) { clearInterval(iv); resolve(ticks.size > 0); return; }
      const r = reads[port];
      if (r && r.tick !== undefined) { ticks.add(r.tick); }
      if (ticks.size >= n) { clearInterval(iv); resolve(true); }
      else if (Date.now() - start > ms) { clearInterval(iv); resolve(ticks.size > 0); }
    }, 300);
  });
}

// Resolves once the board says done=1, showing how far it has got meanwhile.
// The board times itself and stops driving at its own deadline whatever the PC
// does, so the timeout here is only a backstop for a board that went quiet.
function waitForDone(port, ms, say) {
  return new Promise(resolve => {
    const start = Date.now();
    const iv = setInterval(() => {
      if (cancelled[port]) { clearInterval(iv); resolve(false); return; }
      const r = reads[port];
      const f = (r && r.fields) || {};
      if (f.done === "1") { clearInterval(iv); resolve(true); return; }
      if (Date.now() - start > ms) { clearInterval(iv); resolve(!!r); return; }
      if (f.left_s !== undefined) {
        say(T("ui.waitForDone.left", {left: fmtLeft(f.left_s), faults: f.faults ?? "?"}) +
            (f.tmax !== undefined ? T("ui.waitForDone.tmax", {t: (Number(f.tmax) / 10).toFixed(1)}) : ""));
      } else {
        say(T("ui.waitForDone.4"));
      }
    }, 500);
  });
}

function fmtLeft(s) {
  const n = Number(s) || 0;
  if (n < 60) { return T("ui.fmtLeft.1", {n}); }
  const m = Math.floor(n / 60);
  if (m < 60) { return T("ui.fmtLeft.2", {m, n: (n % 60)}); }
  return T("ui.fmtLeft.3", {m: Math.floor(m / 60), m2: (m % 60)});
}

/* ---------------- send ---------------- */
async function run(cmd) {
  addLog("tx", "> " + cmd);
  const j = await api("/api/command", {cmd});
  if (j.error) showMessage(j.error, true);
  else if (j.refused) showMessage(T("ui.run.1", {refused: j.refused}), true);
  else showMessage("", false);
  if (j.state) applyState(j);
  // Returned so a caller can read the board's own reply - the one-button test
  // judges a pt.run answer, and it has to see the line to do that.
  return j;
}

/* ================= 方案页 =================
 *
 * 三栏和参考架构一样：左边方案文件，中间步骤表（复选框 = 跑不跑），
 * 右边属性网格。日志那一栏两个页面共用，因为跑方案时最该看的就是它。

let planTab = "manual";
let plan = null;         // 当前方案，编辑就地改这个对象
let planName = "";
let planSaved = "";      // JSON of the plan as opened or last saved
let planSel = 0;         // 选中第几步

function switchTab(which) {

async function loadPlanList() {
  const r = await api("/api/plans");
  const host = $("#planlist");
  host.textContent = "";

  // What a plan is, said before the list of them: "方案" on its own tells a
  // hardware engineer nothing, and the one debugging a single port needs to
  // know this tab is not for them.
  const what = el("div", "hint");
  what.id = "planwhat";
  what.innerHTML = T("ui.loadPlanList.1");
  host.appendChild(what);

  if (r.error) { host.appendChild(el("div", "msg bad", r.error)); return; }

async function openPlan(name) {
  const r = await api("/api/plan?name=" + encodeURIComponent(name));
  if (r.error) { $("#planbody").textContent = ""; $("#planbody").appendChild(el("div", "msg bad", r.error)); return; }
  plan = r.plan; planName = r.name; planSel = 0; planVerdicts = {};
  planSaved = JSON.stringify(plan);
  loadPlanList();
  renderPlan();
  checkPlan();
}

/* 只有固件说得清的事才发到板子上判：端口在不在、参数收不收、值在不在范围内。 */
async function checkPlan() {
  if (!plan) return;
  const r = await api("/api/plan/check", { plan });
  const host = $("#planfindings");
  if (!host) return;
  host.textContent = "";
  if (r.error) { host.appendChild(el("div", "msg bad", r.error)); return; }
  if (r.note) { host.appendChild(el("div", "hint", r.note)); return; }
  for (const f of (r.findings || [])) {
    host.appendChild(el("div", "finding", f));
  }
}

function renderPlan() {
  const host = $("#planbody");
  host.textContent = "";
  if (!plan) {
    host.appendChild(el("div", "hint", T("ui.renderPlan.1")));
    return;
  }

  const hd = el("div", "card");
  const t = el("div", "hd");
  t.appendChild(el("div", "nm", plan.name));
  t.appendChild(el("span", "sp"));
  const run = el("button", "primary", T("ui.renderPlan.2"));
  run.onclick = runPlan;
  const save = el("button", null, T("ui.renderPlan.3"));
  save.onclick = savePlan;
  t.appendChild(run); t.appendChild(save);
  hd.appendChild(t);
  hd.appendChild(el("div", "sub", T("ui.renderPlan.4", {limit_version: plan.limit_version, plan_name: planName})));
  hd.appendChild(el("div", "findings-host"));
  hd.lastChild.id = "planfindings";
  host.appendChild(hd);

  const list = el("div", "plansteps");
  (plan.steps || []).forEach((st, i) => {
    const row = el("div", "st" + (i === planSel ? " sel" : ""));
    const cb = el("input");
    cb.type = "checkbox";
    cb.checked = st.enabled !== false;
    /* 勾掉 = 这一步不跑，但仍然会进报告并标成跳过 —— 悄悄消失的步骤
       就是没人知道没跑过的步骤。 */
    cb.onclick = e => { e.stopPropagation(); st.enabled = cb.checked; };
    row.appendChild(cb);
    row.appendChild(el("span", null, st.id));
    const ty = el("span", "ty", stepTypeCN(st.type));
    ty.title = T("ui.renderPlan.5", {type: st.type});
    row.appendChild(ty);
    const v = planVerdicts[st.id];
    if (v) { row.appendChild(el("span", "vd " + v, v)); }
    row.onclick = () => { planSel = i; renderPlan(); };
    list.appendChild(row);
  });
  host.appendChild(list);

  host.appendChild(renderStepProps());
}

/* 属性网格。分组照参考架构：类型专有参数在上，六个通用字段在「杂项」里。 */
function renderStepProps() {
  const card = el("div", "card");
  const st = (plan.steps || [])[planSel];
  if (!st) { card.appendChild(el("div", "hint", T("ui.renderStepProps.1"))); return card; }

  const nm = el("div", "nm", st.id + " · " + stepTypeCN(st.type));
  nm.title = T("ui.renderStepProps.2", {type: st.type});
  card.appendChild(el("div", "hd")).appendChild(nm);
  const g = el("div", "pgrid");

  // raw 省略时，label 本身就是文件里的写法（判据那几行是这种）。
  const put = (label, node, raw) => {
    g.appendChild(raw === undefined ? el("div", "k", label) : planLabel(label, raw));
    g.appendChild(node);
  };
  const text = (get, set) => {
    const i = el("input");
    i.value = get() ?? "";
    i.onchange = () => set(i.value);
    return i;
  };
  const num = (get, set) => {
    const i = el("input");
    i.type = "number";
    i.value = get() ?? "";
    i.onchange = () => set(i.value === "" ? undefined : Number(i.value));
    return i;
  };

  const pf = (key, node) => put(planFieldCN(key), node, key);

  if (st.type === "PtSession") {
    pf("port", text(() => st.port, v => { st.port = v; checkPlan(); }));
    pf("frames", num(() => st.frames, v => st.frames = v));
    const ports = (state.ports || []).filter(p => p.name === st.port);
    const lim = ports.length ? (ports[0].limits || {}) : {};
    for (const k of Object.keys(st.params || {})) {
      const spec = lim[k] ? lim[k].spec : "";
      put(paramCN(k) + (spec ? "  " + spec : ""),
          text(() => st.params[k], v => { st.params[k] = v; checkPlan(); }), k);
    }
  }
  if (st.type === "PtRun")  { pf("target", text(() => st.target, v => st.target = v)); }
  if (st.type === "PtRaw")  { pf("command", text(() => st.command, v => st.command = v)); }
  if (st.type === "Tool")   { pf("tool_name", text(() => st.tool_name, v => st.tool_name = v)); }
  if (st.type === "UserConfirm") { pf("prompt", text(() => st.prompt, v => st.prompt = v)); }
  if (st.type === "ReadSN") { pf("source", text(() => st.source, v => st.source = v)); }
  if (st.type === "PushResult") { pf("sink", text(() => st.sink, v => st.sink = v)); }

  /* 判据只读。放宽一个限值就是让不合格的板子通过，所以屏幕上没有任何
     可编辑的限值 —— 换限值的唯一办法是换一份具名方案文件
     （DECISIONS.md 第 30 条，第 34 条又重申了一遍）。 */
  if ((st.checks || []).length) {
    g.appendChild(el("div", "pgroup", T("ui.renderStepProps.3")));
    // 这几行和上面能改的格子一样印中文，原词都在 title 上。差别只在这几行
    // 根本不能改 —— 理由见下面那条说明。
    st.checks.forEach(c => {
      const parts = [];
      if (c.op !== undefined) parts.push(c.op);
      if (c.min !== undefined || c.max !== undefined) {
        parts.push((c.min ?? "") + ".." + (c.max ?? ""));
      }
      if (c.value !== undefined) parts.push(String(c.value));
      if (c.unit !== undefined) parts.push(c.unit);
      const k = el("div", "k", fieldLabel(st.port, c.field));
      k.title = c.field;
      const v = el("div", "ro", checkCN(st.port, c));
      v.title = c.field + " " + parts.join(" ");
      g.appendChild(k);
      g.appendChild(v);
    });
    g.appendChild(el("div", "k", ""));
    g.appendChild(el("div", "sub",
      T("ui.renderStepProps.4")));
  }

  /* 六个通用字段。它们是框架和一堆脚本的分界线 —— 每个步骤都有，
     与步骤类型无关（DECISIONS.md 第 24 条）。 */
  g.appendChild(el("div", "pgroup", T("ui.renderStepProps.5")));
  const cond = el("select");
  ["PASS", "FAIL", "ALWAYS"].forEach(o => {
    const opt = el("option", null, EXECCOND_CN[o] || o);
    opt.value = o;             // 写回文件的仍然是 PASS / FAIL / ALWAYS
    opt.title = T("ui.renderStepProps.6", {o});
    if ((st.execute_condition || "PASS") === o) opt.selected = true;
    cond.appendChild(opt);
  });
  cond.onchange = () => st.execute_condition = cond.value;
  pf("execute_condition", cond);
  pf("retry_count", num(() => st.retry_count, v => st.retry_count = v));
  pf("retry_interval_ms", num(() => st.retry_interval_ms, v => st.retry_interval_ms = v));
  pf("sleep_before_ms", num(() => st.sleep_before_ms, v => st.sleep_before_ms = v));
  pf("sleep_after_ms", num(() => st.sleep_after_ms, v => st.sleep_after_ms = v));
  pf("timeout_ms", num(() => st.timeout_ms, v => st.timeout_ms = v));

  card.appendChild(g);
  if (st._note) { card.appendChild(el("div", "sub", st._note)); }
  return card;
}

async function savePlan() {
  const r = await api("/api/plan", { name: planName, plan });
  if (r.error) { alert(T("ui.savePlan.1", {error: r.error})); return; }
  planSaved = JSON.stringify(plan);
  loadPlanList();
}

async function runPlan() {
  if (!plan) return;
  planVerdicts = {};
  renderPlan();
  const r = await api("/api/plan/run", { plan, sn: "" });
  if (r.error) { alert(r.error); return; }
  for (const s of (r.report.steps || [])) { planVerdicts[s.id] = s.outcome; }
  renderPlan();
}

document.querySelectorAll(".tab").forEach(b =>
  b.onclick = () => switchTab(b.dataset.tab));

// 人工读数框的按钮。绑在这里而不是在卡片里：这个框在 <main> 外面，
// renderPanel() 不重建它，所以只需要绑一次 —— 而这正是它放在外面的理由。
$("#meterok").onclick    = () => meterDone($("#meterval").value.trim());
$("#meterskip").onclick  = () => meterDone("");
$("#meterstop").onclick  = () => meterDone(null);
$("#meterval").onkeydown = e => {
  if (e.key === "Enter") { meterDone($("#meterval").value.trim()); }
};

</script>
