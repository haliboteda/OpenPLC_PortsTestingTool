// *** 只译标签，不译值。那些格子改的就是文件本身，把 "PtSession" 换成中文写
// *** 回去，文件就读不了了。原词一律进 title 悬停，和面板别处一样。
const STEPTYPE_CN = tr({
  PtSession:   "steptype.PtSession",
  PtRun:       "steptype.PtRun",
  PtRaw:       "steptype.PtRaw",
  Tool:        "steptype.Tool",
  UserConfirm: "steptype.UserConfirm",
  ReadSN:      "steptype.ReadSN",
  PushResult:  "steptype.PushResult",
});

const PLANFIELD_CN = tr({
  port:              "planfield.port",
  frames:            "planfield.frames",
  target:            "planfield.target",
  command:           "planfield.command",
  tool_name:         "planfield.tool_name",
  prompt:            "planfield.prompt",
  source:            "planfield.source",
  sink:              "planfield.sink",
  execute_condition: "planfield.execute_condition",
  retry_count:       "planfield.retry_count",
  retry_interval_ms: "planfield.retry_interval_ms",
  sleep_before_ms:   "planfield.sleep_before_ms",
  sleep_after_ms:    "planfield.sleep_after_ms",
  timeout_ms:        "planfield.timeout_ms",
});

// 门的三个取值。值发回文件，所以照旧是大写英文，只有印出来的字是中文。
const EXECCOND_CN = tr({
  PASS:   "execcond.PASS",
  FAIL:   "execcond.FAIL",
  ALWAYS: "execcond.ALWAYS",
});

function stepTypeCN(t)  { return STEPTYPE_CN[t] || t; }
function planFieldCN(k) { return PLANFIELD_CN[k] || paramCN(k); }

// 标签印中文，原词挂在 title 上。方案页每一处都这么做，所以抽出来。
function planLabel(text, raw) {
  const d = el("div", "k", text);
  d.title = T("ui.planLabel.1", {raw});
  return d;
}

// ---- 判据那句话 -----------------------------------------------------------
//
// 判据本身来自方案文件、由 internal/ptcheck 求值，这里一个字都不判 —— 只是把
// 它给的结构化结果（字段、算子、值、读到什么）拼成中文。
//
// *** 为什么不让 Go 那边直接出中文：同一份文案还要进命令行和 CSV 报告，而
// *** 那两处按约定是英文（~/.claude/rules/language.md）。所以英文留在 Go 里，
// *** 屏幕上这一层自己拼。
const OP_CN = tr({eq: "op.eq", ne: "op.ne", contains: "op.contains"});

function fieldLabel(port, field) {
  const m = /^([A-Za-z0-9_.]+)(?:\[(\d+)\])?$/.exec(String(field || ""));
  if (!m) { return String(field || ""); }
  const p = (state.ports || []).find(x => x.name === port);
  const ch = /^ch(\d+)$/.exec(m[1]);
  const base = (ch && p) ? displayName(p, Number(ch[1])) : fieldCN(m[1]);
  return m[2] === undefined ? base : (T("ui.fieldLabel.1", {base, m: (Number(m[2]) + 1)}));
}

function checkCN(port, c) {
  if (!c || !c.field) { return T("ui.checkCN.1"); }
  const f = fieldLabel(port, c.field);
  const unit = c.unit ? " " + c.unit : "";
  const has = v => v !== undefined && v !== null;
  if (c.op === "range") {
    if (has(c.min) && has(c.max)) { return T("ui.checkCN.2", {f, min: c.min, max: c.max, unit}); }
    if (has(c.min)) { return T("ui.checkCN.3", {f, min: c.min, unit}); }
    return T("ui.checkCN.4", {f, max: c.max, unit});
  }
  if (c.op === "count_zero") { return T("ui.checkCN.5", {f}); }
  return f + " " + (OP_CN[c.op] || c.op) + " " + valueCN(c.value) + unit;
}

// 一条没过的判据，说成一句话。
function failCN(port, x) {
  const c = x.check || {};
  const what = checkCN(port, c);
  if (x.missing) {
    return T("ui.failCN.1", {what, field: fieldLabel(port, c.field)});
  }
  return T("ui.failCN.got", {what, got: x.got === "" ? T("ui.failCN.3") : valueCN(x.got)});
}

// 卡片头印中文名，协议里的 port= 名进悬停 —— 对着日志查的时候还要它。
function cardName(p) {
  const s = el("span","nm", portLabel(p.name));
  s.title = T("ui.cardName.1", {name: p.name});
  return s;
}

// 端子排 = Klemmblock。端子号本身是硬件事实，不译。
function blkTerm(p) {
  return p.blk === "-" ? p.term : (T("ui.blkTerm.1", {blk: p.blk, term: p.term}));
}

const BOARD_LABEL = tr({
  bridge:   "board_label.bridge",
  upper:    "board_label.upper",
  lower:    "board_label.lower",
  junction: "board_label.junction",
  whole:    "board_label.whole",
});

// What a hardware engineer wants off this list at a glance: has this port been
// tested, and did it pass. Nothing else.
// Asks the server to judge a frame against the plan's criteria.
//
// The judging is deliberately NOT done here: the criteria live in the plan file
// and the evaluator is internal/ptcheck, and a copy of either in this page
// would drift from what a production run decides. So the page sends the numbers
// it has and shows the answer it gets.
let judgeBusy = {};
let judgeWhy = {};

// Returns the verdict as three states, not two: true, false, or null for "no
// criteria, so nobody knows". Returning a boolean is what made a target with
// no criteria come out as 通过 - the caller only tested for === false, and
// undefined is not false. Found 2026-09-08.
async function judge(frame) {
  if (judgeBusy[frame.port]) { return curVerdict(frame.port); }
  // 多点测量正在逐点改这个口的输出，方案那组判据此刻不成立 —— 它是程序在改，
  // 不是人在改，所以 offPlan 看不见（那张表只记人改过的）。
  if ((aocalRunning && frame.port === "aout") || (aicalRunning && frame.port === "ain")) {
    delete verdicts[frame.port];
    judgeWhy[frame.port] = frame.port === "ain"
      ? T("ui.judge.1")
      : T("ui.judge.2");
    renderTree(); renderPanel();
    return null;
  }
  // 参数被人改过的会话帧，不判 —— 判据是按方案那组参数写的，拿它去判一组别的
  // 参数，好板子也会报失败。pt.run 的目标不受影响：它不带卡片上的参数。
  if (!frame.target) {
    const p = (state.ports || []).find(x => x.name === frame.port);
    const off = p ? offPlan(p) : [];
    if (off.length) {
      delete verdicts[frame.port];
      judgeWhy[frame.port] = offPlanWhy(off);
      renderTree(); renderPanel();
      return null;
    }
  }
  judgeBusy[frame.port] = true;
  try {
    // 只送原始行：字段怎么读由服务端定，和产线跑方案用的是同一份（决策 77）。
    const r = await api("/api/judge", {
      port: frame.port, target: frame.target || "",
      line: frame.line || "", lines: frame.lines || [],
      args: frame.args || {},
    });
    if (r.known === false) {
      judgeWhy[frame.port] = r.why || "";
      delete verdicts[frame.port];
    } else if (r.error) {
      judgeWhy[frame.port] = r.error;
      delete verdicts[frame.port];
    } else {
      verdicts[frame.port] = !!r.pass;
      judgeWhy[frame.port] = (r.results || [])
        .filter(x => !x.pass)
        .map(x => failCN(frame.port, x))
        .join(T("ui.judge.3"));
      // 持续测试里判出不过：停掉整轮、点故障灯（决策 37 第 3 件）。只在持续测试里，
      // 因为单次测试的「不过」就摆在卡片上，人就在跟前。
      if (!r.pass && state.run && (state.run.ports || []).includes(frame.port)) {
        // English: the server writes it into the run log.
        api("/api/fault", {on: true, why: inLang("en", () => T("ui.judge.fault_why", {
          port: portLabel(frame.port),
          why: (r.results || []).filter(x => !x.pass).map(x => failCN(frame.port, x)).join(T("ui.judge.3")),
        }))})
          .then(refreshState);
      }
    }
  } catch (e) {
    judgeWhy[frame.port] = String(e);
    delete verdicts[frame.port];
  } finally {
    judgeBusy[frame.port] = false;
    renderTree(); renderPanel();
  }
  return curVerdict(frame.port);
}

function curVerdict(port) {
  return verdicts[port] === undefined ? null : verdicts[port];
}

// How the plan starts each port, fetched once per port and kept.
//
// *** The card's inputs are prefilled from this, and 开始测试 sends whatever
// *** the inputs say. *** One source of truth on screen: the criteria were
// written for particular parameters, so the page shows those parameters rather
// than starting with one set of values and judging by another. Changing an
// input is then a deliberate act with a visible consequence.
let planParams = {};      // port -> {params, frames} | null when not in the plan
let planPending = {};

// pt.run 目标 -> 方案给它的参数。**一定要发出去** —— 判据是照着某一个窗口写的
// （`sdram.crc` 只算 64 KiB），不带参数跑出来的是固件的默认值，再拿另一套限值去
// 判它，好板子也会报失败。命令行一直是带着参数发的，页面以前没带，于是同一条方案
// 步骤两边得出不同结论。2026-09-13 修。
let planRunArgs = {};

function ensurePortPlan(name) {
  if (planParams[name] !== undefined || planPending[name]) { return; }
  planPending[name] = true;
  api("/api/portplan?port=" + encodeURIComponent(name)).then(pp => {
    Object.assign(planRunArgs, (pp && pp.runs) || {});
    planParams[name] = (pp && pp.known)
      ? {params: pp.params || {}, frames: pp.frames || 3, step: pp.step, peer: pp.peer || ""}
      : null;
  }).catch(() => { planParams[name] = null; })
    .finally(() => { planPending[name] = false; renderPanel(); });
}

// What the person typed, else what the plan says, else what the board reports.
function paramDefault(p, name) {
  const mine = editedVal(p, name);
  if (mine !== undefined) { return mine; }
  const pp = planParams[p.name];
  if (pp && pp.params && pp.params[name] !== undefined) {
    return String(pp.params[name]);
  }
  return (p.values || {})[name] || "";
}

// A per-channel parameter is written "1:100,2:100" in both the plan and the
// board's own vals= line. Prefilling only the scalar ones was a real bug: the
// relay step asks for on=1:1..6:1 and its criteria check ch1 and ch6, so with
// the board's default on=1:0 the one-button test drove nothing and reported a
// healthy board as failed. Found by the browser test, 2026-09-08.
function planPerCh(p, name) {
  const pp = planParams[p.name];
  const spec = pp && pp.params ? pp.params[name] : undefined;
  const out = {};
  if (spec === undefined) { return out; }
  for (const tok of String(spec).split(",")) {
    const [ch, v] = tok.split(":");
    if (v !== undefined) { out[Number(ch)] = v; }
  }
  return out;
}

// ---- 人改过的参数 ---------------------------------------------------------
//
// 存在页面状态里，不存在输入框里。每来一帧 applyState() 都会 renderPanel()，而
// renderPanel() 第一件事就是 #panelbody 整个清空重建 —— 值只活在 DOM 里的话，
// 会话一跑起来，人刚敲进去的数就被下一帧抹掉。
//
// *** 这和 testing / picked / aocal 是同一类东西，理由也是同一个。
let edited = {};          // 端口 -> {参数: "值"} 或 {参数: {通道: "值"}}

function editedVal(p, name) {
  const v = (edited[p.name] || {})[name];
  return (v === undefined || typeof v === "object") ? undefined : v;
}
function setEdited(p, name, v) {
  if (!edited[p.name]) { edited[p.name] = {}; }
  edited[p.name][name] = v;
}
function editedCh(p, name, ch) {
  const m = (edited[p.name] || {})[name];
  return (m && typeof m === "object") ? m[ch] : undefined;
}
function setEditedCh(p, name, ch, v) {
  if (!edited[p.name]) { edited[p.name] = {}; }
  const m = edited[p.name];
  if (!m[name] || typeof m[name] !== "object") { m[name] = {}; }
  m[name][ch] = v;
}

// 当前卡片上的参数和方案里写的差在哪。空数组 = 一模一样。
//
// *** 这是判据能不能用的唯一依据。判据是按方案那组参数写的（station6 的
// *** high-side-out 判 ch1 eq 100 / ch8 eq 100），人把通道或占空比一改，那两条
// *** 判据就永远落空 —— 好板子照样报失败。用户 2026-09-11 就是这么撞上的：
// *** 勾 DO3、占空比 50，1.4 秒出一个「失败」。
function offPlan(p) {
  const pp = planParams[p.name];
  if (!pp || !pp.params) { return []; }
  const out = [];
  for (const [k, planned] of Object.entries(pp.params)) {
    if (k === "ch") {
      const now = chList(p);
      const was = String(planned).split(",").map(s => Number(s.trim()))
                    .filter(n => n >= 1).sort((a,b) => a-b).join(",");
      if (now !== was) {
        out.push({what: T("ui.offPlan.1"), was: chanNames(p, was), now: chanNames(p, now)});
      }
      continue;
    }
    if ((p.perChannel || {})[k]) {
      const was = planPerCh(p, k);
      const now = {};
      for (const i of [...chanSet(p)].sort((a,b) => a-b)) {
        now[i] = String(editedCh(p, k, i) ?? was[i] ?? (p.perChannel[k]||{})[i] ?? 0);
      }
      const wasS = perChText(p, was), nowS = perChText(p, now);
      if (nowS !== wasS) { out.push({what: paramCN(k), was: wasS, now: nowS}); }
      continue;
    }
    const now = String(editedVal(p, k) ?? planned);
    if (now !== String(planned)) {
      out.push({what: paramCN(k), was: valueCN(String(planned)), now: valueCN(now)});
    }
  }
  return out;
}

// 八路都一样就说「八路都一样」，不要把八个格子一个一个念出来 —— 那样一句话
// 撑满半屏，而真正要看的「哪里不一样」反而埋在里面。
function chanNames(p, list) {
  const ns = String(list).split(",").filter(Boolean).map(Number);
  if (!ns.length) { return T("ui.chanNames.1"); }
  if (ns.length === p.channels) { return T("ui.chanNames.2", {channels: p.channels}); }
  return ns.map(n => displayName(p, n)).join(T("ui.chanNames.3"));
}

function perChText(p, m) {
  const keys = Object.keys(m).map(Number).sort((a,b) => a-b);
  if (!keys.length) { return T("ui.perChText.1"); }
  const vals = [...new Set(keys.map(k => String(m[k])))];
  if (vals.length === 1 && keys.length > 1) {
    return T("ui.perChText.all_same", {
      which: keys.length === p.channels ? T("ui.perChText.2", {channels: p.channels}) : T("ui.perChText.3", {keys: keys.length}),
      value: vals[0]});
  }
  return keys.map(k => displayName(p, k) + "=" + m[k]).join(T("ui.perChText.5"));
}

// 判据为什么这次不适用。细节写在卡片顶上的说明块里，按钮旁边只留一句短的 ——
// 同一段话印两遍，等于两处都没人读。
function offPlanWhy(off) {
  const plan = state.criteriaPlan || T("ui.offPlanWhy.1");
  return T("ui.offPlanWhy.text", {plan,
    diffs: off.map(d => T("ui.offPlanWhy.4", {what: d.what, was: d.was, now: d.now})).join(T("ui.offPlanWhy.5"))});
}

// The plan's channel list, applied once when a port is first selected. Once,
// not on every render: the checkboxes are the person's to change, and a render
// that put them back would make unchecking one impossible.
let chanApplied = {};
function applyPlanChannels(p) {
  const pp = planParams[p.name];
  if (!pp || chanApplied[p.name]) { return; }
  chanApplied[p.name] = true;
  const spec = pp.params ? pp.params["ch"] : undefined;
  if (!spec) { return; }
  const s = chanSet(p);
  s.clear();
  for (const tok of String(spec).split(",")) {
    const n = Number(tok.trim());
    if (n >= 1 && n <= p.channels) { s.add(n); }
  }
}

function portStatus(p) {
  if (p.running) { return {icon:"⏳", cls:"testing", text:T("ui.portStatus.1")}; }
  const v = verdicts[p.name];
  if (v === true)  { return {icon:"✅", cls:"pass", text:T("ui.portStatus.2")}; }
  if (v === false) { return {icon:"❌", cls:"fail", text:T("ui.portStatus.3")}; }
  return {icon:"⬜", cls:"untested", text:T("ui.portStatus.4")};
}

function renderTree() {
  const host = $("#treebody"); host.textContent = "";
  if (!state.connected) { host.appendChild(el("div","hint",T("ui.renderTree.1"))); return; }

  // Group by the firmware's board= field, in the order boards are stacked.
  const order = ["bridge","upper","lower","junction","whole"];
  const groups = new Map();
  for (const p of state.ports || []) {
    const b = p.board || "other";
    if (!groups.has(b)) { groups.set(b, []); }
    groups.get(b).push(p);
  }
  const seen = [...groups.keys()].sort(
    (a,b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));

  for (const b of seen) {
    host.appendChild(el("div","boardhd", BOARD_LABEL[b] || b));
    for (const p of groups.get(b)) {
      const st = portStatus(p);
      const row = el("div", "prow " + st.cls + (selected === p.name ? " on" : ""));
      row.appendChild(el("span","ico", st.icon));
      row.appendChild(el("span","nm", portLabel(p.name)));
      // The protocol key is what the log lines and the plan files say, so it
      // stays reachable - but it is not printed here any more. The panel is
      // read in Chinese (user 2026-09-11), and the key has its own labelled
      // row on the card.
      row.title = T("ui.renderTree.2", {name: p.name});
      // 协议名不上屏了，但机器还要认得出这一行是哪个端口 —— 浏览器测试按这个挑。
      row.dataset.port = p.name;
      row.appendChild(el("span","stat", st.text));
      row.onclick = () => { selected = p.name; renderTree(); renderPanel(); };

      // 勾一个就是「这一轮带上它」。只有会话能勾 —— 一次性的用例自己跑完就回来了，
      // 没有「带上它一起持续跑」这回事。
      if (p.kind === "session") {
        const c = el("input","pick"); c.type = "checkbox";
        c.checked = picked2.has(p.name);
        c.dataset.pick = p.name;
        c.title = T("ui.renderTree.3");
        c.onclick = (e) => {
          e.stopPropagation();
          c.checked ? picked2.add(p.name) : picked2.delete(p.name);
          renderBatchBar();
        };
        row.insertBefore(c, row.firstChild);
      }
      host.appendChild(row);
    }
  }
  renderBatchBar();
}

// 勾了哪几个端口要一起跑。和 picked（通道选择）不是一回事，所以另起一个名字。
const picked2 = new Set();

// 左边列表顶上的那一条：勾了几个、跑多久、一个「开始」。
//
// *** 这里没有「单次 / 持续」的选择 —— 一次点好几个端口，要的就是让它们一起跑
// *** 着。要单跑一轮拿结论，去那个端口自己的卡片上点，那里才有判据。
function renderBatchBar() {
  const bar = $("#batchbar");
  if (!bar) { return; }
  bar.textContent = "";
  if (!state.connected) { bar.hidden = true; return; }
  bar.hidden = false;

  const live = state.run;
  if (live) {
    const left = live.left_s;
    bar.appendChild(richText("div","note",
      T("ui.renderBatchBar.1") + (live.ports || []).map(portLabel).join(T("ui.renderBatchBar.2")) +
      "\n" + (left === null || left === undefined
        ? T("ui.renderBatchBar.3")
        : T("ui.renderBatchBar.4", {left: Math.floor(left / 60), left2: (left % 60)})) +
      // 页面的日志窗只留最后几分钟，跑几小时的那部分靠这个文件。说出来，
      // 否则人跑完四小时才发现要找的东西早滚没了。
      (live.log ? T("ui.renderBatchBar.5", {log: live.log}) : "")));
    const stop = el("button","primary",T("ui.renderBatchBar.6"));
    stop.dataset.batch = "stop";
    stop.onclick = () => stopContinuous();
    bar.appendChild(stop);
    return;
  }

  const names = [...picked2];
  const head = el("div","note");
  head.appendChild(el("b", null, T("ui.renderBatchBar.7") + (names.length
    ? names.map(portLabel).join(T("ui.renderBatchBar.8")) : T("ui.renderBatchBar.9"))));
  bar.appendChild(head);
  if (!names.length) {
    bar.appendChild(el("div","sub",T("ui.renderBatchBar.10")));
    return;
  }

  bar.appendChild(hoursPicker(renderBatchBar, false));

  const warn = bandwidthWarning(names);
  if (warn) { bar.appendChild(richText("div","sub warn", warn)); }

  const go = el("button","primary",T("ui.renderBatchBar.11"));
  go.dataset.batch = "start";
  go.disabled = !!warn;
  go.onclick = async () => {
    const cmds = [];
    for (const name of names) {
      const p = (state.ports || []).find(x => x.name === name);
      if (p) { cmds.push(startCommandFor(p)); }
    }
    await startContinuous(names, cmds);
  };
  bar.appendChild(go);
}

// The old expandable tree, kept for the channel checkboxes the cards need.
function renderTreeDetail() {
  const host = $("#treebody");
  for (const p of state.ports || []) {
    const g = el("div","grp");
    const hd = el("div","hd");
    const cb = el("input"); cb.type = "checkbox"; cb.checked = !!expanded[p.name];
    cb.onchange = () => { expanded[p.name] = cb.checked; renderTree(); renderPanel(); };
    hd.appendChild(cb);
    hd.appendChild(el("span","blk " + (["A","B","C","D"].includes(p.blk) ? p.blk : "x"),
                      p.blk === "-" ? T("ui.renderTreeDetail.1") : p.blk));
    hd.appendChild(el("span","nm", p.name));
    if (p.running) hd.appendChild(el("span","tag run",T("ui.renderTreeDetail.2")));
    hd.appendChild(el("span","tag " + p.kind, T("ui.renderTreeDetail.3")));
    g.appendChild(hd);

    if (expanded[p.name]) {
      const kids = el("div","kids");
      if (p.kind === "session" && p.channels > 1) {
        const all = el("button","selall",T("ui.renderTreeDetail.4"));
        all.onclick = () => {
          const s = chanSet(p);
          if (s.size === p.channels) s.clear(); else
            for (let i=1;i<=p.channels;i++) s.add(i);
          renderTree(); renderPanel();
        };
        kids.appendChild(all);
        for (let i = 1; i <= p.channels; i++) {
          const lb = el("label");
          const c = el("input"); c.type="checkbox"; c.checked = chanSet(p).has(i);
          c.onchange = () => { c.checked ? chanSet(p).add(i) : chanSet(p).delete(i);
                               renderPanel(); };
          lb.appendChild(c);
          lb.appendChild(document.createTextNode(displayName(p, i)));
          kids.appendChild(lb);
        }
      } else {
        kids.appendChild(el("div","t", p.term));
      }
      g.appendChild(kids);
    }
    host.appendChild(g);
  }
}

/* ---------------- port cards ---------------- */
function chList(p) { return [...chanSet(p)].sort((a,b)=>a-b).join(","); }

// Which values a parameter takes comes from the board's own limits= line, so a
// mode added to the firmware appears here with no change to this page and a
// dropdown can never offer something the board will refuse. The hard-coded
// pair is the fallback for firmware older than the limits= line.
function modesFor(p) {
  const enum_ = ((p.limits || {}).mode || {}).enum;
  if (enum_ && enum_.length) { return enum_; }
  if (p.name === "relay") return ["hold","square"];
  if (p.name === "dout")  return ["hold","blink"];
  return [(p.values || {}).mode || ""];
}

// A number the board bounds is bounded in the input too, so a value it would
// refuse is hard to type rather than refused after the fact.
function applyLimit(p, name, inp) {
  const l = (p.limits || {})[name];
  if (!l) { return; }
  if (l.min !== null && l.min !== undefined) { inp.min = l.min; }
  if (l.max !== null && l.max !== undefined) { inp.max = l.max; }
  if (l.spec) { inp.title = T("ui.applyLimit.1", {name: paramCN(name), name2: name, spec: l.spec}); }
  watchRange(p, name, inp);
}

// 超出板子收的范围就当场说，不等命令发出去。
//
// *** 范围出自 pt.caps 的 limits= 行，不是按端口写死的。*** 所以「继电器周期
// 不能小于 1000」「DO 频率不能超过 2000」这两条根本不出现在代码里 —— 固件改了
// 上下限，这里跟着变，新加一个参数也自动有。写死的版本会在固件改了之后继续拦
// 一个板子其实能收的值，而那种错最难看出来。
//
// *** 不改用户敲进去的字。*** 悄悄把 500 改成 1000，人下一眼看到的是一个自己
// 没打过的数，而他要的那个值到底行不行，没有任何地方说过。
function watchRange(p, name, inp) {
  const l = (p.limits || {})[name] || {};
  const lo = (l.min === null || l.min === undefined) ? null : Number(l.min);
  const hi = (l.max === null || l.max === undefined) ? null : Number(l.max);
  if (lo === null && hi === null) { return; }

  const say = () => {
    const raw = inp.value.trim();
    const v = Number(raw);
    let why = "";
    if (raw === "") { why = ""; }
    else if (!isFinite(v)) { why = T("ui.watchRange.1"); }
    else if (lo !== null && v < lo) {
      why = T("ui.watchRange.2", {lo, raw});
    } else if (hi !== null && v > hi) {
      why = T("ui.watchRange.3", {hi, raw});
    }
    inp.classList.toggle("bad", !!why);
    // 说明贴在这一格自己后面 —— 八路各一格时，说「有一格超了」等于没说。
    let tip = inp.nextElementSibling;
    if (tip && tip.className !== "rangetip") { tip = null; }
    if (why && !tip) {
      tip = el("span", "rangetip");
      inp.parentNode.insertBefore(tip, inp.nextSibling);
    }
    if (tip) { tip.textContent = why; tip.hidden = !why; }
  };

  inp.addEventListener("input", say);
  inp.addEventListener("change", say);
  say();
}

// 按下去之前就该知道的事：这个口有什么前提没满足、有什么硬件条件不由软件决定。
//
// *** 和用例说明里的「怎么做」不是一回事。*** 那一行讲的是每次都一样的步骤；
// 这里讲的是**此刻这组勾选和这块板子**的状况，勾法一变，说的话就变。
// 按当前的周期和时长，这一轮持续测试要花掉多少次吸合。
//
// *** 算出来的数，不是一句「有寿命」。*** 3 万次听起来很多，14400 次听起来
// 很少，直到把它们放在一句话里 —— 而这两个数正是人要拿来决定的那两个。
function relayWearSays() {
  const p = (state.ports || []).find(x => x.name === "relay");
  const per = p ? portPeriodMs(p) : 1000;
  const hours = runHours || 4;
  const cycles = Math.round(hours * 3600 * 1000 / per);
  const pct = Math.round(cycles / 30000 * 100);
  return T("ui.relayWearSays.text", {per, cycles, pct,
    hours: runHours ? T("ui.relayWearSays.3", {run_hours: runHours}) : T("ui.relayWearSays.4")});
}

function headsUp(p) {
  const out = [];

  // *** 不再说「拿一根八芯线把 DO 接到 DI」。*** 那是这张工作台上的
  // 一种夹具选择，不是必然的接法 —— 面板替产线定夹具，就是替它定了
  // 工位怎么建（DECISIONS 43）。板子那一侧的事实照说：DI 只等输入，DO 只管输出。
  if (p.name === "din") {
    out.push(T("ui.headsUp.1"));
  }
  if (p.name === "dout") {
    out.push(T("ui.headsUp.2"));
  }

  // 出厂九个跳线全开路。这不是配置，是板子焊成什么样 —— 软件读不回来，所以只能
  // 在人按下去之前说一句，免得把「没焊跳线」当成「AI 坏了」。
  if (p.name === "ain" && chanSet(p).size) {
    out.push(T("ui.headsUp.3"));
  }
  if (p.name === "aout" && chanSet(p).size) {
    out.push(T("ui.headsUp.4"));
  }

  // 半双工：发的时候收发器被切去发，所以板子听不见自己。这解释了为什么这个口
  // 非要一个真的对端，而 RS232 不用。
  //
  // *** 这条不看接没接上。*** 它讲的是这块板子的接法，接上了也还是半双工 ——
  // 而「这个口为什么非要对端」正是接上之后最容易忘的那件事。要不要现在去接
  // 是另一句话，跟在后面，只在真台子上没接的时候说。
  if (p.name === "rs485") {
    let t = T("ui.headsUp.5");
    if (!(state.links || {})[p.name] && state.port !== "sim") {
      t += T("ui.headsUp.6");
    }
    out.push(t);
  }

  // 触点是消耗品，而「持续」会一直吸合释放。这一句只在真要那么跑的时候说。
  if (p.name === "relay" && (runMode[p.name] || "once") === "loop") {
    out.push(T("ui.headsUp.7", {relay_wear_says: relayWearSays()}));
  }

  return out;
}

// 「按之前先知道」那一块。位置固定，没话说的时候是空的。
function headsSlot(p) {
  const slot = el("div", "headsslot");
  slot.dataset.heads = p.name;
  fillHeads(p, slot);
  return slot;
}

function fillHeads(p, slot) {
  const out = headsUp(p);
  slot.textContent = "";
  slot.hidden = !out.length;
  if (!out.length) { return; }
  const box = el("div", "headsup");
  box.appendChild(el("div", "st", T("ui.fillHeads.1")));
  for (const t of out) { box.appendChild(richText("div", "v", t)); }
  slot.appendChild(box);
}

// Which plan supplies the limits, shown and switchable.
//
// Switching is a real thing a bench and a line both need - a looser limit set
// exists (station6-poweron-relaxed.json) and somebody has to be able to say
// they used it. What must NOT happen is a limit being edited on screen: that
// leaves no trace, and the production guide bans passing a board by widening a
// limit. Choosing a whole named plan keeps the decision auditable, because the
// name and its limit_version go into every report.
//
// The plan list is fetched once and cached; it only changes when somebody adds
// a file next to the exe.
let critPlans = null;

async function renderCriteria(st) {
  const box = $("#critbox");
  box.hidden = !st.connected;
  if (!st.connected) { return; }

  const sel = $("#critplan");
  if (critPlans === null) {
    critPlans = [];
    try {
      const r = await api("/api/plans");
      critPlans = (r.plans || []).map(p => p.name || p);
    } catch (e) { critPlans = []; }
  }
  const want = st.criteriaPlan || "";
  // Whatever the server says is in use has to be selectable even if the list
  // came back empty, or the box would show something that is not what is
  // judging.
  const names = critPlans.slice();
  if (want && names.indexOf(want) < 0) { names.unshift(want); }

  const same = sel.options.length === names.length &&
               names.every((n, i) => sel.options[i].value === n);
  if (!same) {
    sel.textContent = "";
    for (const n of names) {
      const o = el("option", null, n);
      o.value = n;
      sel.appendChild(o);
    }
  }
  sel.value = want;

  const ver = $("#critver");
  if (st.criteriaProblem) {
    ver.textContent = T("ui.renderCriteria.1", {criteria_problem: st.criteriaProblem});
    ver.style.color = "var(--err)";
  } else {
    ver.textContent = st.criteriaLimits ? T("ui.renderCriteria.2", {criteria_limits: st.criteriaLimits}) : "";
    // A limit set that is not the default is worth noticing, since a board can
    // pass under it and fail under the strict one.
    ver.style.color = /relax|宽/i.test(st.criteriaPlan || "") ? "var(--warn)" : "";
  }
}

$("#critplan").onchange = async () => {
  const j = await api("/api/criteria", {plan: $("#critplan").value});
  if (j.error) { showMessage(j.error, true); return; }
  // Every verdict on screen was produced by the old limits, so they are no
  // longer claims about anything. Cleared rather than left to look current.
  verdicts = {}; judgeWhy = {};
  addLog("panel", () => T("ui.top.crit_changed", {plan: j.plan, limits: j.limitVersion || "?"}));
  const st = await api("/api/state");
  applyState(st);
};

function renderPanel() {
  const host = $("#panelbody");
  const msg = host.querySelector(".msg");
  host.textContent = ""; if (msg) host.appendChild(msg);

  if (!state.connected) {
    host.appendChild(el("div","hint",T("ui.renderPanel.1")));
    return;
  }
  // One rule for this column: it always explains whatever the left list has
  // selected. That is why the plan lives on the same left list - a second
  // explaining pane would be a second rule to learn.
  const p = (state.ports||[]).find(x => x.name === selected);
  if (!p) {
    host.appendChild(el("div","hint",T("ui.renderPanel.2")));
    return;
  }
  ensurePortPlan(p.name);
  applyPlanChannels(p);

  // 这个端口怎么接线，以及它此刻是什么状态。
  //
  // *** 这一块只说接线。*** 「测什么 / 怎么做 / 什么算过」跟着用例走，写在下面
  // 每一段里 —— 一个端口的几个用例前置和判据常常互相矛盾，并成端口级的一段话
  // 就没人知道哪句管哪件事。
  const wiring = PORT_WIRING[p.name];
  const hb = el("div","howto");
  hb.appendChild(el("div","howhd",
    portLabel(p.name) + "\u3000" + portStatus(p).text + "\u3000"));
  for (const [k, v] of [[T("ui.renderPanel.3"), wiring ||
        T("ui.renderPanel.4")],
                        [T("ui.renderPanel.5"), p.name]]) {
    const r = el("div","howrow");
    r.appendChild(el("span","k", k));
    r.appendChild(richText("span","v", v));
    hb.appendChild(r);
  }
  host.appendChild(hb);

  // expanded[] still drives the channel checkboxes the cards use, so
  // selecting a port is also what opens it.
  expanded[p.name] = true;
  host.appendChild(portCard(p));


}

/* ===================== 用例式卡片：先在以太网上试，认可了再铺到别的口 =====================
 *
 * 一个端口有几件不同的事要测，就分成几段「用例」。段内顺序是固定的：
 *
 *     测什么 → 怎么做 → 什么算过 → 配置 → 执行按钮 → 结果
 *
 * *** 按钮永远在它自己那段的配置下面。*** 原来的排法是「动作 → 结果 → 设置 →
 * 设置 → 动作 → 结果 → 动作」，同一张卡上「该点的」和「要填的」交替出现三轮，
 * 五个按钮散在四个地方、四种长相。用户 2026-09-14 看着那张卡说的原话是
 * 「我都不知道哪些是该点的，哪些是参数设置」。
 *
 * *** 一段一个执行按钮。*** 一段里有辅助性的按钮（以太网的 ping）就放进配置区，
 * 它不出结论，只是帮人分辨故障在哪一层。
 */
function caseBlock(o) {
  const box = el("div", "case");
  const hd = el("div", "casehd");
  hd.appendChild(el("span", "no", o.no));
  hd.appendChild(el("span", "nm", o.title));
  if (o.tag) { hd.appendChild(el("span", "casetag", o.tag)); }
  box.appendChild(hd);

  for (const [k, v] of [[T("ui.caseBlock.1"), o.what], [T("ui.caseBlock.2"), o.how], [T("ui.caseBlock.3"), o.pass]]) {
    if (!v) continue;
    const r = el("div", "caserow");
    r.appendChild(el("span", "k", k));
    r.appendChild(richText("span", "v", v));
    box.appendChild(r);
  }

  if (o.config && o.config.length) {
    const cfg = el("div", "casecfg");
    cfg.appendChild(el("div", "st", T("ui.caseBlock.4")));
    for (const n of o.config) { if (n) cfg.appendChild(n); }
    box.appendChild(cfg);
  }

  const act = el("div", "caseact");
  for (const n of o.actions || []) { if (n) act.appendChild(n); }
  box.appendChild(act);

  const res = el("div", "caseres");
  res.appendChild(el("span", "st", T("ui.caseBlock.5")));
  res.appendChild(o.result || el("span", "sub", T("ui.caseBlock.6")));
  box.appendChild(res);
  return box;
}

/* 一个标量参数的输入框，带板子报的取值范围。 */
function scalarParam(p, name, build) {
  const lb = el("label", null, paramCN(name) + " ");
  lb.title = T("ui.scalarParam.1", {name});
  lb.dataset.param = name;
  const inp = el("input");
  inp.value = paramDefault(p, name);
  if (/^\d+$/.test(inp.value)) { inp.type = "number"; applyLimit(p, name, inp); }
  inp.oninput = () => { setEdited(p, name, inp.value); build(); };
  inp.onchange = inp.oninput;
  lb.appendChild(inp);
  return lb;
}

/* 枚举参数做成一行一个的单选，每项后面写它是干什么的。 */
function enumParam(p, name, build) {
  const lim = (p.limits || {})[name] || {};
  const box = el("div", "chvals");
  box.dataset.param = name;
  const st = el("div", "st", paramCN(name));
  st.title = T("ui.enumParam.1", {name});
  box.appendChild(st);
  const pick = el("div", "enumpick");
  const cur = paramDefault(p, name);
  for (const o of (lim.enum || [])) {
    const lb = el("label");
    const r = el("input"); r.type = "radio"; r.name = p.name + "-" + name;
    r.value = o; r.checked = (o === cur); r.title = name + "=" + o;
    r.onchange = () => { setEdited(p, name, o); build(); };
    lb.appendChild(r);
    lb.appendChild(el("b", null, valueCN(o)));
    const why = valueHelp(p.name, o);
    if (why) { lb.appendChild(el("span", "sub", "—— " + why)); }
    pick.appendChild(lb);
  }
  box.appendChild(pick);
  return box;
}

/* ===================== 用例式卡片 =====================
 *
 * 一个端口有几件不同的事要测，就分成几段「用例」。段内顺序是固定的：
 *
 *     测什么 → 怎么做 → 什么算过 → 配置 → 执行按钮 → 结果
 *
 * *** 按钮永远在它自己那段的配置下面。*** 原来的排法是「动作 → 结果 → 设置 →
 * 设置 → 动作 → 结果 → 动作」，同一张卡上「该点的」和「要填的」交替出现三轮，
 * 五个按钮散在四个地方、四种长相。用户 2026-09-14 看着那张卡说的原话是
 * 「我都不知道哪些是该点的，哪些是参数设置」。
 *
 * *** 一段一个执行按钮。*** 一段里有辅助性的按钮（以太网的 ping、把八路设成
 * 同一个值）就放进配置区，它们不出结论。
 *
 * *** 「开始」和「单独跑」的区别这样消掉。*** 原来一个口有一个「开始」（跑这个
 * 口的全部）加上每个单项一个「单独跑」，两者跑的东西重叠，谁也说不清区别 ——
 * 用户 2026-09-14 的原话是「开始指的是什么，单独跑指的是什么？」。现在：
 *   · 每个用例自己一个按钮，一次性的写「执行」，会话写「开始」；
 *   · 想一口气跑完，用卡片最下面那一行「依次跑一遍」，而且它写清了跑哪几段。
 * 一个用例的端口根本不出现那一行，也就没有两个按钮可比。
 */

// 这个端口有哪几个用例，按屏幕上出现的顺序：一次性的动作在前，会话在后。
//
// 顺序不是排版偏好 —— 一次性的那些问的是静态的事（芯片在不在、线通不通），
// 会话问的是跑起来之后的事。静态的先答，会话失败时才知道要不要怀疑硬件。
function portCases(p) {
  const out = (p.runs || []).map(t => ({key: t, run: t}));
  if (p.kind === "session") { out.push({key: "session"}); }
  return out;
}

const CASE_NO = ["①","②","③","④","⑤","⑥","⑦","⑧"];

// 这个口要人先插对端适配器、而人还没绑。返回要说的话，没问题就返回空。
//
// 模拟板不算 —— 它按构造就把每个 link 端口的对端都演了，在那上面要求先绑一个
// 真适配器，是要求一件没有意义的事。
function peerMissing(p) {
  const pk = planParams[p.name];
  if (!pk || pk.peer !== "com") { return ""; }
  if (state.port === "sim") { return ""; }
  if ((state.links || {})[p.name]) { return ""; }
  return T("ui.peerMissing.1", {name: portLabel(p.name)});
}

// 一个端口一张卡。会话口、一次性口、两者都有的口，走的都是这一条路径。
function portCard(p) {
  const c = el("div", "card");
  c.dataset.port = p.name;

  const hd = el("div", "hd");
  hd.appendChild(cardName(p));
  hd.appendChild(el("span", "sub", blkTerm(p)));
  c.appendChild(hd);

  const cases = portCases(p);
  if (cases.length > 1) {
    c.appendChild(el("div", "hint",
      T("ui.portCard.1", {cases: cases.length})));
  }

  // *** 要人插适配器的口，那一行排在所有用例前面。*** 它是开始之前必须先办的
  // 事 —— 没绑对端，这个口跑出来的一定是「丢失一直涨」，而那句话读起来像板子
  // 坏了。用户 2026-09-14：「如有需要绑定端口的都放在最前面」。
  //
  // *** 判断依据是方案里写的 peer，不是 loop=link。*** 按 loop=link 挂，CAN 和
  // KNX 也会挂上一个串口对端选择框 —— 那两个口的回路是板子自己在选定模式下
  // 闭合的（extloop / loopback），总线上根本接不了一个「把每行原样送回来」的
  // 串口适配器。挂在那儿的结果是让人去办一件办不成的事，还附一句「没有对端永
  // 远闭合不了」，而那句话在那两个口上是错的。
  const peerKind = (planParams[p.name] || {}).peer || "";
  if (peerKind === "com") { c.appendChild(linkRow(p, "com")); }

  let build = null;
  cases.forEach((cs, i) => {
    const no = cases.length > 1 ? (CASE_NO[i] || String(i + 1)) : "";
    if (cs.run) {
      c.appendChild(runCase(p, cs.run, no));
    } else {
      const s = sessionCase(p, no);
      build = s.build;
      c.appendChild(s.node);
    }
  });

  if (cases.length > 1) { c.appendChild(allCasesRow(p, cases, build)); }

  return c;
}

// 一次性动作的那一段。
function runCase(p, t, no) {
  const tx = caseTextFor(p, t);

  const cfg = [];
  // pt.run 的参数可以改，因为判据是按参数挑的（judge.go 的 criteriaFor）。
  // 同一个目标在方案里可以有好几步：sd.integrity 跑 1 轮和跑 64 轮是两
  // 组不同的判据，填哪个就按哪组判。填一个方案里没有的值，就只给读数。
  //
  // 没有参数的用例不画配置区 —— 一个只写着「没有要设的参数」的灰框占的
  // 地方和真有参数时一样大。
  const args = Object.assign({}, planRunArgs[t] || {}, runEdited[t] || {});
  const named = Object.entries(args);
  if (named.length) {
    const row = el("div", "row");
    for (const [k, v] of named) {
      const lb = el("label", null, paramCN(k) + " ");
      lb.title = T("ui.runCase.1", {k});
      lb.dataset.param = k;
      const inp = el("input");
      inp.dataset.run = t;
      inp.value = v;
      if (/^\d+$/.test(String(v))) { inp.type = "number"; inp.min = 0; }
      inp.oninput = () => {
        runEdited[t] = runEdited[t] || {};
        runEdited[t][k] = inp.value;
      };
      lb.appendChild(inp);
      row.appendChild(lb);
    }
    cfg.push(row);
    cfg.push(richText("div", "sub",
      T("ui.runCase.2")));
  }

  const b = el("button", "primary", T("ui.runCase.3"));
  b.dataset.run = t;
  b.title = T("ui.runCase.4", {t});
  b.onclick = () => runOne(p, t);

  const note = caseNote[p.name + "|" + t];
  const res = el("span", "tgtres" + (note && note.indexOf("❌") >= 0 ? " bad" : ""),
                 note || T("ui.runCase.5"));
  res.dataset.case = t;

  return caseBlock({
    no: no, title: tx.title, tag: tx.tag,
    what: tx.what, how: tx.how, pass: tx.pass,
    config: cfg, actions: [b], result: res,
  });
}

// 通道复选。和左边树里那组共用同一份 picked 状态 —— 两处显示的永远是同一件事。
//
// *** 也放在卡上，是因为只放在树里等于没放：每路的值就在这张卡上，勾哪几路却
// *** 要跑到另一个面板去，中间还隔着「哪个数字对应哪个端子」这一层。
function channelPicker(p) {
  const pick = el("div", "chvals");
  pick.appendChild(el("div", "st", T("ui.channelPicker.1")));
  const pg = el("div", "chgrid");
  for (let i = 1; i <= p.channels; i++) {
    const lb = el("label");
    const cb = el("input"); cb.type = "checkbox"; cb.checked = chanSet(p).has(i);
    cb.onchange = () => {
      cb.checked ? chanSet(p).add(i) : chanSet(p).delete(i);
      renderTree(); renderPanel();
    };
    lb.appendChild(cb);
    const t = el("span", "t");
    t.appendChild(el("b", null, displayName(p, i)));
    lb.appendChild(t);
    pg.appendChild(lb);
  }
  pick.appendChild(pg);
  const all = el("button", null, T("ui.channelPicker.2"));
  all.onclick = () => {
    const set = chanSet(p);
    if (set.size === p.channels) { set.clear(); }
    else { for (let i = 1; i <= p.channels; i++) set.add(i); }
    renderTree(); renderPanel();
  };
  pick.appendChild(all);
  return pick;
}

// 会话的那一段：配置是通道和参数，动作是「单次 / 持续 + 开始」，结果是读数。
// 返回 build，好让卡片最下面那一行「依次跑一遍」发同一条命令。
function sessionCase(p, no) {
  const cfg = [], res = el("div");
  const inputs = {};       // 参数 -> 一个控件（八路共用）
  const perCh = {};        // 参数 -> { 通道: 控件 }
  const fr = reads[p.name];

  // ------------------------------------------------------------ 配置
  cfg.push(headsSlot(p));
  if (p.channels > 1) { cfg.push(channelPicker(p)); }

  const row = el("div", "row");
  for (const name of p.params || []) {
    if (name === "ch") continue;                 // 通道由上面那组复选管
    const cur = paramDefault(p, name);

    // 板子按通道报的参数，就一路一个框。哪些参数是这样不写死在这里 —— 是什么
    // 形状回来的就按什么形状画，固件加一个新的，这里不用改。
    if ((p.perChannel || {})[name]) {
      const box = el("div", "chvals");
      box.dataset.param = name;
      // 参数名后面跟上板子自己报的取值范围。范围出自 limits= 行，不是写死的。
      const spec = ((p.limits || {})[name] || {}).spec;
      const st = el("div", "st",
        paramCN(name) + T("ui.sessionCase.1") + (spec ? T("ui.sessionCase.2", {spec}) : ""));
      st.title = T("ui.sessionCase.3", {name});
      const ph = paramHelp(p.name, name);
      if (ph) { st.appendChild(el("span", "sub", T("ui.sessionCase.4", {ph}))); }
      box.appendChild(st);
      const grid = el("div", "chgrid");
      perCh[name] = {};
      const want = planPerCh(p, name);
      for (const i of [...chanSet(p)].sort((a, b) => a - b)) {
        const lb = el("label");
        const t = el("span", "t");
        t.appendChild(el("b", null, displayName(p, i)));
        lb.appendChild(t);
        const inp = el("input"); inp.type = "number"; inp.min = 0;
        inp.dataset.ch = i;
        inp.value = editedCh(p, name, i) ?? want[i] ?? p.perChannel[name][i] ?? 0;
        applyLimit(p, name, inp);
        inp.oninput = () => {
          setEditedCh(p, name, i, inp.value);
          refreshStartRow(p, build);
        };
        perCh[name][i] = inp;
        lb.appendChild(inp);
        grid.appendChild(lb);
      }
      box.appendChild(grid);
      const same = el("button", null, T("ui.sessionCase.5"));
      same.onclick = () => {
        const first = Object.values(perCh[name])[0];
        for (const [ch, inp] of Object.entries(perCh[name])) {
          inp.value = first.value;
          setEditedCh(p, name, Number(ch), first.value);
        }
        renderPanel();
      };
      box.appendChild(same);
      cfg.push(box);
      continue;
    }

    const lim = (p.limits || {})[name] || {};

    // 有名字的枚举做成一行一个的单选，每项后面直接写它是干什么的。
    //
    // *** 下拉框只给名字，用途就只能挤到别处再讲一遍 —— 而「别处再讲一遍」正是
    // *** 这张卡最早的毛病。
    //
    // *** 分界是「值有没有名字」，不是「有几个」。*** 按个数分的结果是反的：CAN
    // 的波特率四个纯数字排成了四个单选（125000 要解释什么呢），而模式五个值各有
    // 各的用途，偏偏因为多了一个被挤进下拉框。纯数字的列表照旧用下拉。
    if (lim.enum && lim.enum.length && lim.enum.length <= 6 &&
        lim.enum.some(v => !/^[0-9]+$/.test(v))) {
      const box = enumParam(p, name, () => refreshStartRow(p, build));
      cfg.push(box);
      const pickbox = box.querySelector(".enumpick");
      // build() 只读 .value，给它一个照实回答的对象就够了。
      inputs[name] = {get value() {
        const on = pickbox.querySelector("input:checked");
        return on ? on.value : "";
      }};
      continue;
    }

    const lb = el("label", null, paramCN(name) + " ");
    lb.title = T("ui.sessionCase.6", {name});
    lb.dataset.param = name;
    let inp;
    // 板子把某个参数报成一组取值，它就变成下拉 —— 任何参数，不只是「模式」。
    // 哪些是不写死在这里：固件加一个新的枚举参数，这一页不用改，而板子会拒绝
    // 的值这里根本敲不进去。选项印中文，value 还是板子认的原值。
    if (lim.enum && lim.enum.length) {
      inp = el("select");
      for (const o of lim.enum) {
        const op = el("option", null, valueCN(o)); op.value = o; op.title = o;
        if (o === cur) op.selected = true;
        inp.appendChild(op);
      }
    } else if (name === "mode") {
      // 留给不报 limits 的老固件：modesFor 里是按端口写死的那份退路。
      inp = el("select");
      for (const o of modesFor(p)) {
        const op = el("option", null, valueCN(o)); op.value = o; op.title = o;
        if (o === cur) op.selected = true;
        inp.appendChild(op);
      }
    } else {
      inp = el("input"); inp.value = cur;
      if (/^\d+$/.test(cur)) { inp.type = "number"; applyLimit(p, name, inp); }
    }
    inp.oninput = () => { setEdited(p, name, inp.value); refreshStartRow(p, build); };
    inp.onchange = inp.oninput;
    lb.appendChild(inp); inputs[name] = inp; row.appendChild(lb);
  }
  if (p.channels > 1) {
    row.appendChild(el("span", "hint", T("ui.sessionCase.7", {p: chanNames(p, chList(p))})));
  }
  if (row.childNodes.length) { cfg.push(row); }

  // 面板自己能接上的对端排在这一段的配置里，不在卡片最上面 —— 卡片最上面那个
  // 位置是留给「你必须先动手」的事的，而这两个都不用人动手：
  //   以太网 —— 地址是板子在帧里报的；
  //   USB   —— 板子那个 CDC 口有唯一的 VID:PID。
  // 两个还都有先有鸡还是先有蛋的问题：板子要会话起来才拿 IP、才枚举 CDC，所以
  // 「开始之前先选」根本做不到。
  if (p.name === "aout") { cfg.push(aocalConfig(p)); }
  if (p.name === "ain") { cfg.push(aicalConfig(p)); }
  if (p.name === "eth") { cfg.push(ethPeerRow(p)); }
  else if ((planParams[p.name] || {}).peer === "usb") { cfg.push(linkRow(p, "usb")); }

  // ------------------------------------------------------------ 结果
  if (fr) {
    if (p.channels > 1 || p.name === "ain" || p.name === "aout" || p.name === "temp") {
      const rr = el("div", "reads");
      let anyFloating = false;
      for (let i = 1; i <= p.channels; i++) {
        const v = fr.fields["ch" + i];
        const eng = formatReading(p.name, i, v);
        const shown = eng ? eng.text : v;
        const b = el("div", "bit " + readingClass(v) + (eng && eng.warn ? " warn" : ""),
                     displayName(p, i) + (shown === undefined ? "" : " " + shown));
        if (eng) { b.title = eng.hint; anyFloating = anyFloating || !!eng.warn; }
        rr.appendChild(b);
      }
      res.appendChild(rr);
      // 换算前提要写在看得见的地方：档位是焊出来的，固件读不回来，所以这行
      // 数字只在板子确实按这个档位焊了的时候才成立。
      if (p.name === "ain") {
        res.appendChild(el("div", "sub",
          T("ui.sessionCase.8")));
      }
      if (p.name === "aout") {
        res.appendChild(richText("div", "sub",
          T("ui.sessionCase.9")));
      }
      if (p.name === "dout" && fr.fields.tick !== undefined) {
        res.appendChild(el("div", "sub",
          T("ui.sessionCase.10", {tick: fr.fields.tick})));
      }
      if (anyFloating) {
        res.appendChild(el("div", "sub warn",
          T("ui.sessionCase.11")));
      }
    }
    // 帧里除通道读数以外的那些数，印中文名。原文在悬停里 —— 对着日志查还要它。
    const extra = Object.entries(fr.fields)
      .filter(([k]) => !/^ch\d+$/.test(k) && !["seq", "rx", "miss"].includes(k))
      .map(([k, v]) => fieldCN(k) + " " + valueCN(v));
    if (extra.length) {
      const line = el("div", "sub", extra.join(" "));
      line.title = Object.entries(fr.fields)
        .filter(([k]) => !/^ch\d+$/.test(k) && !["seq", "rx", "miss"].includes(k))
        .map(([k, v]) => k + "=" + v).join(" ");
      res.appendChild(line);
    }
  } else if (p.running) {
    res.appendChild(el("div", "sub", T("ui.sessionCase.13")));
  }
  // 没起来就什么都不加 —— 下面那个结论span已经写着「还没跑」，再说一遍只会让
  // 人以为那是两件事。

  // 报文事件。字段是板子写什么就是什么，固件开始报事件这里不用改。
  const ev = events[p.name];
  if (ev && ev.length) {
    const box = el("div", "chvals");
    box.appendChild(el("div", "st", T("ui.sessionCase.14", {ev: ev.length})));
    for (let i = ev.length - 1; i >= 0; i--) {
      const e = ev[i];
      const bad = e.fields.crc === "bad";
      const line = el("div", "sub" + (bad ? " warn" : ""));
      const parts = [valueCN(e.sub)];
      const raw = [e.sub];
      for (const [k, v] of Object.entries(e.fields)) {
        if (k === "t") continue;
        parts.push(fieldCN(k) + " " + valueCN(v));
        raw.push(k + "=" + v);
      }
      line.textContent = parts.join(" ");
      line.title = raw.join(" ");
      box.appendChild(line);
    }
    // crc= 是机器对一个这块板真实存在的问题给的答案：接收链的极性还没定，
    // 哪一种读法才是真报文由校验字节判，不由眼睛判。
    if (p.name === "knx") {
      box.appendChild(el("div", "sub",
        T("ui.sessionCase.16")));
    }
    res.appendChild(box);
  }

  // 回环计数，故意和读数分开摆。
  if (fr && fr.fields.seq !== undefined) {
    const lk = el("div", "link");
    lk.appendChild(el("span", null, T("ui.sessionCase.17")));
    for (const k of ["seq", "rx", "miss"]) {
      if (fr.fields[k] !== undefined) {
        const s = el("span"); s.title = k + "=" + fr.fields[k];
        s.appendChild(el("b", null, fieldCN(k) + " "));
        s.appendChild(document.createTextNode(fr.fields[k])); lk.appendChild(s);
      }
    }
    lk.appendChild(el("span", "hint", p.loop === "link"
      ? T("ui.sessionCase.18")
      : T("ui.sessionCase.19")));
    res.appendChild(lk);
  }

  // 这一段自己的结论。端口那一个总状态说不出是哪一段的结果 —— 一个口有五段时
  // 尤其如此。
  const note = caseNote[p.name + "|session"];
  const vd = el("span", "tgtres" + (note && note.indexOf("❌") >= 0 ? " bad" : ""),
                note || T("ui.sessionCase.20"));
  vd.dataset.case = "session";
  res.insertBefore(vd, res.firstChild);

  // ------------------------------------------------------------ 动作
  // 发出去的就是屏幕上这组参数 —— 单次和持续发的是同一条命令，差别只在跑完
  // 之后停不停、判不判。
  const build = () => {
    let cmd = "pt.start " + p.name;
    if (p.channels > 1) cmd += " ch=" + chList(p);
    for (const [k, i] of Object.entries(inputs)) if (i.value !== "") cmd += " " + k + "=" + i.value;
    for (const [k, byCh] of Object.entries(perCh)) {
      const parts = Object.entries(byCh)
        .filter(([ch]) => chanSet(p).has(Number(ch)))
        .map(([ch, inp]) => ch + ":" + (inp.value === "" ? 0 : inp.value));
      if (parts.length) cmd += " " + k + "=" + parts.join(",");
    }
    return cmd;
  };

  // 读表那一档的结果是逐点表和拟合，不是一句过 / 不过。
  if (p.name === "aout" && aocal.meter === "manual") { res.appendChild(aocalResult()); }
  if (p.name === "ain" && aical.meter === "manual") { res.appendChild(aicalResult()); }

  const tx = caseTextFor(p, "session");
  const node = caseBlock({
    no: no, title: tx.title, tag: tx.tag,
    what: tx.what, how: tx.how, pass: tx.pass,
    config: cfg,
    actions: [startRow(p, build, "session")],
    result: res,
  });
  return {node: node, build: build};
}

// 卡片最下面那一行：把这个口的用例一个接一个跑完。
//
// *** 它写清了跑哪几段。*** 「开始」两个字过去既可能是「跑这个口的全部」也
// 可能是「跑这一段」，两个按钮并排摆着谁也说不清区别。
function allCasesRow(p, cases, build) {
  const row = el("div", "allrow");
  const busy = testing[p.name];
  const nos = cases.map((_, i) => CASE_NO[i] || String(i + 1)).join("");
  const b = el("button", null, busy ? T("ui.allCasesRow.1") : T("ui.allCasesRow.2", {nos}));
  b.dataset.all = p.name;
  b.disabled = !!busy;
  b.onclick = async () => {
    const why = peerMissing(p);
    if (why) { showMessage(why, true); return; }
    if (p.channels > 1 && chanSet(p).size === 0) {
      showMessage(T("ui.allCasesRow.3", {name: portLabel(p.name)}), true);
      return;
    }
    testing[p.name] = T("ui.allCasesRow.4");
    delete cancelled[p.name];
    renderPanel();
    try {
      await runPortTest(p, t => { testing[p.name] = t; renderPanel(); }, build);
    } finally {
      delete testing[p.name];
      renderTree(); renderPanel();
    }
  };
  row.appendChild(b);
  row.appendChild(el("span", "sub",
    T("ui.allCasesRow.n", {n: cases.length}) +
    (build ? T("ui.allCasesRow.7") : "")));
  return row;
}

// ---- Analog Out: walk a list of points, a meter reads each one -------------
//
// The board cannot check its own analog output - there is no read-back path on
// this hardware, so the µA in an aout frame is arithmetic, not a measurement
// (porttool_aout.c says so out loud). The only judge is an instrument on the
// terminal, and today that instrument is a person with a multimeter.
//
// *** So the reading comes from a human by design, not as a stopgap. What IS a
// *** stopgap is that the human is the only supported source: meter= leaves
// *** room for an instrument that can be asked over a wire, and nothing in the
// *** walk below assumes the value came from a keyboard.
//
// *** Several points, not one. A single point cannot separate an offset from a
// *** gain error, and those need different corrections - which is the whole
// *** reason calibration data is worth collecting at all.
//
// *** The fit (a straight line, CAL-03), the accuracy verdict and the archive
// *** by board UID are the server's: /api/fit, internal/ptcal, ptcheck and
// *** calstore. See PORTTOOL-FLOW.md C.3.2.


// 多点测量正在跑。**不是 aocal.busy** —— 那个是给按钮看的，跑完就清；这个要
// 在最后一帧判完之前一直立着。
let aocalRunning = false;

let aocal = {
  busy: "",
  ch: 1,
  meter: "none",      // "none" = 回显那一档；"manual" = 多点走查
  pointsText: "0, 5, 10, 15, 20",   // mA：满量程的 0 / 25 / 50 / 75 / 100 %（CAL-03）
  tolPct: 2,                 // 合格判据，可配
  rows: [],
  note: "",
  ask: null,                 // 正在等人读表时的 resolve
  fit: null,                 // 跑完之后服务端算出来的那条直线
};

// mA -> DAC millivolts, through the XTR111 set resistor. The board reports the
// current it expects from a given mV; this is that arithmetic inverted, so a
// person can think in the unit the meter shows.
function aocalMaMv(ma) { return Math.round(ma * 1000 * 1024 / 10000); }

function askMeter(what, unit, hint) {
  return new Promise(resolve => {
    $("#meterwhat").textContent = what;
    $("#meterunit").textContent = unit;
    $("#meterhint").textContent = hint || "";
    const inp = $("#meterval");
    inp.value = "";
    $("#meterask").hidden = false;
    inp.focus();
    aocal.ask = resolve;
  });
}

function meterDone(value) {
  const resolve = aocal.ask;
  aocal.ask = null;
  $("#meterask").hidden = true;
  if (resolve) resolve(value);
}

// Resolves once the port has pushed n frames NEWER than the ones already
// seen, so a caller can tell "the board answered my change" from "a frame
// from before it arrived".
function waitForNewFrames(port, n, ms) {
  const before = (reads[port] || {}).tick;
  return new Promise(resolve => {
    const fresh = new Set();
    const start = Date.now();
    const iv = setInterval(() => {
      const r = reads[port];
      if (r && r.tick !== undefined && r.tick !== before) { fresh.add(r.tick); }
      if (fresh.size >= n) { clearInterval(iv); resolve(true); return; }
      if (Date.now() - start > ms) { clearInterval(iv); resolve(false); }
    }, 60);
  });
}

function aocalPoints() {
  return aocal.pointsText.split(/[,，\s]+/)
    .map(s => Number(s))
    .filter(v => isFinite(v) && v >= 0);
}

async function aocalRun(p, say, render) {
  const ch = aocal.ch;
  const pts = aocalPoints();
  if (!pts.length) { say(T("ui.aocalRun.1")); return; }

  say(T("ui.aocalRun.2"));
  await run("pt.stop all");
  await run("pt.start aout ch=" + ch + " mv=" + ch + ":0 period=500");
  if (!await waitForNewFrames("aout", 1, 8000)) {
    await run("pt.stop all");
    say(T("ui.aocalRun.3"));
    return;
  }

  const rows = [];
  for (let i = 0; i < pts.length; i++) {
    const ma = pts[i];
    const mv = aocalMaMv(ma);
    say(T("ui.aocalRun.4", {i: (i + 1), pts: pts.length, ma, mv}));
    await run("pt.set aout mv=" + ch + ":" + mv);
    await waitForNewFrames("aout", 2, 5000);

    // What the board says it should be putting out, after its own quantising.
    // Not a measurement - that is what the meter is for - but it IS the number
    // the meter has to be compared against.
    const f = (reads.aout || {}).fields || {};
    const parts = String(f["ch" + ch] || "0/0/0").split("/");
    const wantUa = Number(parts[2]);

    const typed = await askMeter(
      T("ui.aocalRun.ask", {ch, i: i + 1, n: pts.length, ma: (wantUa / 1000).toFixed(3)}),
      "mA",
      T("ui.aocalRun.8"));

    if (typed === null) { say(T("ui.aocalRun.9")); break; }
    const gotMa = (typed === "") ? null : Number(typed);
    const wantMa = wantUa / 1000;
    const row = {ma: ma, mv: mv, wantMa: wantMa, gotMa: gotMa};
    if (gotMa !== null && isFinite(gotMa)) {
      row.errMa = gotMa - wantMa;
      // Against full scale, not against the reading. At the bottom of the
      // range one DAC step is already a large fraction of the reading, so a
      // percent-of-reading limit is one the hardware cannot meet there -
      // see the note in the panel below.
      row.errPct = wantMa === 0 ? 0 : (row.errMa / AOCAL_FS_MA) * 100;
      row.pass = Math.abs(row.errPct) <= aocal.tolPct;
    }
    rows.push(row);
    aocal.rows = rows;
    render();
  }

  say(T("ui.aocalRun.10"));
  await run("pt.set aout mv=" + ch + ":0");
  await run("pt.stop all");

  // 拟合在服务端算（internal/ptcal），不在这个页面里 —— 产线跑一遍也要算同一件
  // 事，两处各写一份迟早会对同一批点得出不同的系数。
  const fitPts = rows.map(r => ({want: r.wantMa,
                                 got: (r.gotMa === null || !isFinite(r.gotMa)) ? null : r.gotMa}));
  try {
    aocal.fit = await api("/api/fit", {points: fitPts, gain_tol: 0.01, offset_tol: 0.05,
                                       channel: "AO" + ch, unit: "mA"});
  } catch (e) {
    aocal.fit = {known: false, why: String(e)};
  }
}

// 满量程。0-20 mA 那一档，JP3/JP4 开路时成立。
const AOCAL_FS_MA = 20;

// 拟合结果。**残差摆在增益前面** —— 用直线去拟合一条不是直线的响应，唯一的保护
// 就是残差会说出来；先读增益的人会先相信它。
function aocalFitBox(r) {
  return fitBox(r, "mA", f => T("ui.aocalFitBox.text",
    {ma: (f.gain === 0 ? 10 : (10 - f.offset) / f.gain).toFixed(3)}));
}

// 拟合结果框，AO 和 AI 两张卡共用。unit 是这一路的单位，adjust 说出这条直线
// 对这一路意味着什么（AO 要多出多少、AI 读到的数要怎么改）。
function fitBox(r, unit, adjust) {
  const box = el("div","fitbox");
  if (!r || r.known === false) {
    box.appendChild(el("div","msg",
      T("ui.fitBox.unknown", {why: (r && r.why) || T("ui.fitBox.2")})));
    return box;
  }
  const f = r.fit || {};
  const rows = [
    [T("ui.fitBox.4"), T("ui.fitBox.5", {f: f.max_residual.toFixed(4), unit, f2: f.max_residual_at.toFixed(3), unit2: unit}),
     f.exact ? T("ui.fitBox.6")
             : T("ui.fitBox.7")],
    [T("ui.fitBox.8"), f.rms_residual.toFixed(4) + " " + unit, T("ui.fitBox.9")],
    [T("ui.fitBox.10"), f.gain.toFixed(5), T("ui.fitBox.11")],
    [T("ui.fitBox.12"), f.offset.toFixed(4) + " " + unit, T("ui.fitBox.13")],
    [T("ui.fitBox.14"), String(f.points), ""],
  ];
  const grid = el("div","rowgrid");
  for (const [k, v, why] of rows) {
    const line = el("div","gridrow");
    line.appendChild(el("span","c", k));
    line.appendChild(el("span","c", v));
    line.appendChild(el("span","c sub", why));
    grid.appendChild(line);
  }
  box.appendChild(grid);
  box.appendChild(el("div", r.ideal ? "msg ok" : "msg",
    r.ideal ? T("ui.fitBox.15") : adjust(f)));
  box.appendChild(aocalVerdict(r));
  return box;
}

// 精度判定和存档的结果，都是服务端给的（ptcheck、calstore），页面只负责说出来。
function aocalVerdict(r) {
  const box = el("div");
  const j = r.judge || {};
  if (j.pass === true) {
    box.appendChild(el("div", "msg ok", T("ui.aocalVerdict.1", {j: j.residual_pct_fs.toFixed(3), max_residual_pct_fs: j.max_residual_pct_fs, plan: j.plan})));
  } else if (j.pass === false) {
    box.appendChild(el("div", "msg bad", T("ui.aocalVerdict.2") + (j.why ||
      (T("ui.aocalVerdict.3", {j: j.residual_pct_fs.toFixed(3), max_residual_pct_fs: j.max_residual_pct_fs, plan: j.plan})))));
  } else if (j.why) {
    box.appendChild(el("div", "msg", T("ui.aocalVerdict.4", {why: j.why})));
  }
  if (r.store_error) {
    box.appendChild(el("div", "msg bad", T("ui.aocalVerdict.5", {store_error: r.store_error})));
  } else if (r.stored) {
    const st = r.stored;
    let line = T("ui.aocalVerdict.6", {archive: st.archive});
    if (st.kept_archive) line += T("ui.aocalVerdict.7", {kept_archive: st.kept_archive});
    box.appendChild(el("div", "msg", line));
    if (st.image) {
      box.appendChild(el("div", "msg ok", T("ui.aocalVerdict.8", {image: st.image})));
    } else {
      const wait = [];
      const sep = T("ui.aocalVerdict.10");
      if (st.missing && st.missing.length) wait.push(T("ui.aocalVerdict.missing", {list: st.missing.join(sep)}));
      if (st.failing && st.failing.length) wait.push(T("ui.aocalVerdict.failing", {list: st.failing.join(sep)}));
      if (st.unjudged && st.unjudged.length) wait.push(T("ui.aocalVerdict.unjudged", {list: st.unjudged.join(sep)}));
      box.appendChild(el("div", "msg", T("ui.aocalVerdict.cannot", {why: wait.join(T("ui.aocalVerdict.16"))})));
    }
  }
  return box;
}

// 「读数来自」把 AO 这张卡分成两种用法（DECISIONS 47）：不读表就是回显那一档
// —— 方案判、能无人值守；读表就是多点走查 —— 表判、要人守着。合并之前它们是

// 多点走查的结果：逐点表 + 拟合。只在「人工读表」那一档出现。
function aocalResult() {

      line.appendChild(el("span","c " + (r.pass === undefined ? "" : (r.pass ? "ok" : "bad")),
                          r.pass === undefined ? T("ui.aocalResult.9") : (r.pass ? T("ui.aocalResult.10") : T("ui.aocalResult.11"))));
      grid.appendChild(line);
    }
    res.appendChild(grid);

    const measured = aocal.rows.filter(r => r.pass !== undefined);
    if (measured.length) {

}


// ---- 模拟输入的多点测量（AI1、AI2）-----------------------------------------
//
// *** Same walk as the AO card, the other way round: a person sets a signal
// *** source to each point and types what it gives; the board's reading is the
// *** nominal. got ~= gain * want + offset, the calibration area's direction.
//
// *** The nominal is computed from raw the way the app does it, not taken from
// *** the frame's millivolts: the firmware scales those by the measured VDDA,
// *** the app by a fixed 2.5 V, and a fit against the former would carry that
// *** difference into the coefficients. See PORTTOOL-FLOW.md C.3.2.

let aicalRunning = false;

// Per channel: the calibration-area name, unit, full scale and the app's
// nominal conversion ($CORE_REPO libraries/OpenPLC_Ports/src/openplc_analog.c).
const AICAL = {
  1: { channel: "AI1", unit: "mV", fs: 10000, digits: 1, points: "0, 2500, 5000, 7500, 10000",
       nominal: raw => aicalPinMv(raw) * 90.6 / 22.6 },
  2: { channel: "AI2", unit: "mA", fs: 20, digits: 4, points: "0, 5, 10, 15, 20",
       nominal: raw => aicalPinMv(raw) / 124 },
};
// The fixture's ADC is 16-bit, the app's 12-bit; both against 2.5 V.
function aicalPinMv(raw) { return raw * 2500 / 65535; }
const AICAL_FRAMES = 8;     // frames averaged per point

let aical = {
  busy: "",
  ch: 1,
  meter: "none",
  pointsText: { 1: AICAL[1].points, 2: AICAL[2].points },
  tolPct: 1,
  rows: [],
  note: "",
  fit: null,
};

function aicalPoints() {
  return String(aical.pointsText[aical.ch]).split(/[,，\s]+/)
    .map(s => Number(s))
    .filter(v => isFinite(v) && v >= 0);
}

// Average of the raw reading over n frames newer than the call.
async function aicalSampleRaw(ch, n) {
  let sum = 0, got = 0;
  for (let i = 0; i < n; i++) {
    if (!await waitForNewFrames("ain", 1, 5000)) { break; }
    const v = String(((reads.ain || {}).fields || {})["ch" + ch] || "");
    const raw = Number(v.split("/")[0]);
    if (v.includes("/") && isFinite(raw)) { sum += raw; got++; }
  }
  return got ? sum / got : null;
}

async function aicalRun(p, say, render) {
  const ch = aical.ch;
  const def = AICAL[ch];
  const pts = aicalPoints();
  if (!pts.length) { say(T("ui.aicalRun.1")); return; }

  say(T("ui.aicalRun.2"));
  await run("pt.stop all");
  await run("pt.start ain ch=" + ch + " period=200");
  if (!await waitForNewFrames("ain", 1, 8000)) {
    await run("pt.stop all");
    say(T("ui.aicalRun.3"));
    return;
  }

  const rows = [];
  for (let i = 0; i < pts.length; i++) {
    const target = pts[i];
    const typed = await askMeter(
      T("ui.aicalRun.4", {channel: def.channel, i: (i + 1), pts: pts.length, target, unit: def.unit}),
      def.unit,
      T("ui.aicalRun.5", {aical_frames: AICAL_FRAMES}));
    if (typed === null) { say(T("ui.aicalRun.6")); break; }
    say(T("ui.aicalRun.7", {i: (i + 1), pts: pts.length, aical_frames: AICAL_FRAMES}));
    const raw = await aicalSampleRaw(ch, AICAL_FRAMES);
    const gotV = (typed === "") ? null : Number(typed);
    const row = { target: target, raw: raw,
                  want: raw === null ? null : def.nominal(raw),
                  got: (gotV === null || !isFinite(gotV)) ? null : gotV };
    if (row.want !== null && row.got !== null) {
      row.err = row.want - row.got;
      row.errPct = (row.err / def.fs) * 100;
      row.pass = Math.abs(row.errPct) <= aical.tolPct;
    }
    rows.push(row);
    aical.rows = rows;
    render();
  }

  say(T("ui.aicalRun.8"));
  await run("pt.stop all");

  // 拟合、精度判定、存档都在服务端（同 AO 卡）。
  const fitPts = rows.map(r => ({ want: r.want, got: (r.want === null) ? null : r.got }))
                     .filter(r => r.want !== null);
  try {
    aical.fit = await api("/api/fit", { points: fitPts, gain_tol: 0.01, offset_tol: def.fs * 0.0025,
                                        channel: def.channel, unit: def.unit });
  } catch (e) {
    aical.fit = { known: false, why: String(e) };
  }
}
